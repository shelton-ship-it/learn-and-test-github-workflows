name: StreamVault Process (DLP → Telegram)

# ═══════════════════════════════════════════════════════════════════════
# Versão simplificada: yt-dlp (melhor qualidade) → Telegram. Nada mais.
#
# REMOVIDO: HLS, encriptação ChaCha20, shards/push GitHub, registo no
# EdgeOne, canal/batching, cookie self-refresh, limite de altura.
# PLAYLIST: link de playlist (/playlist?list=) é processado um vídeo de
# cada vez (baixa → compatibiliza → envia → apaga). playlist_items e
# skip_first_item funcionam como no original.
#
# MANTIDO: yt-dlp + Deno, cookies opcionais, thumbnail (URL fornecida →
# fallback nativo do YouTube), webhook do dispatcher (libertar a fila),
# cleanup.
#
# QUALIDADE: melhor disponível em H.264 (até 1080p no YouTube) para o
# vídeo tocar inline no Telegram. Se a fonte não vier em h264/aac, o
# step "Compatibilizar" re-encoda (CRF 18). Resoluções acima de 1080p só
# existem em VP9/AV1 — seriam re-encodadas, por isso não são preferidas.
#
# SECRETS NOVOS: TG_API_ID, TG_API_HASH, TG_BOT_TOKEN, TG_CHAT
# (restantes, como DISPATCHER_URL / ADMIN_API_KEY_YT / YTDLP_COOKIES,
# são os que já tinhas).
#
# LIMITE TELEGRAM: 2 GB por ficheiro (bot via MTProto). Acima disso o
# job falha com mensagem clara.
# ═══════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Job ID'
        required: true
      video_url:
        description: 'URL do vídeo no YouTube'
        required: true
      metadata:
        description: 'JSON: { title, ... } (só o título é usado na legenda)'
        required: false
        default: '{}'
      thumbnail_url:
        description: 'URL da thumbnail (qualquer plataforma). Vazio = thumbnail nativa do YouTube.'
        required: false
        default: ''
      timeout_minutes:
        description: 'Teto do job (minutos).'
        required: false
        default: '60'
      # ── Inputs mantidos SÓ por compatibilidade com o dispatcher/worker
      # (se o dispatcher enviar um input que o workflow não declara, o
      # GitHub responde 422). Ignorados neste workflow. ──
      seg_duration:
        description: '(ignorado)'
        required: false
        default: '4'
      max_encode_height:
        description: '(ignorado — agora é sempre a melhor qualidade)'
        required: false
        default: '720'
      playlist_items:
        description: 'Só para playlists: yt-dlp --playlist-items (ex.: 1-10). Vazio = playlist inteira.'
        required: false
        default: ''
      skip_first_item:
        description: 'Só para playlists: "true" ignora o 1º vídeo da lista.'
        required: false
        default: 'false'

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJson(inputs.timeout_minutes) }}
    permissions:
      contents: read

    env:
      WORK_DIR:         /tmp/sv_work/${{ inputs.job_id }}
      ADMIN_API_KEY_YT: ${{ secrets.ADMIN_API_KEY_YT }}
      DISPATCHER_URL:   ${{ secrets.DISPATCHER_URL }}

    steps:
      - name: Preparar ambiente
        run: |
          echo "JOB_ID=${{ inputs.job_id }}" >> $GITHUB_ENV
          mkdir -p "$WORK_DIR/incoming" "$WORK_DIR/out" "$WORK_DIR/thumbs"

      - name: Instalar ffmpeg (cache)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: ffmpeg
          version: 1.0
          execute_install_scripts: true

      - name: Instalar yt-dlp, Telethon e Deno
        run: |
          # cryptg acelera muito o upload/download MTProto do Telethon
          pip install --quiet --upgrade yt-dlp telethon cryptg
          ffmpeg -version | head -1
          yt-dlp --version
          # Runtime JS (Deno) exigido pelo yt-dlp recente p/ assinaturas do YouTube
          curl -fsSL https://deno.land/install.sh | sh -s -- -y
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          "$HOME/.deno/bin/deno" --version

      - name: Detectar playlist
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          python3 << 'PYEOF'
          import os
          from urllib.parse import urlparse, parse_qs
          u    = urlparse(os.environ['VIDEO_URL'].strip())
          q    = parse_qs(u.query)
          host = (u.hostname or '').lower()
          path = u.path.rstrip('/')
          # playlist = /playlist?list=... OU link com list= SEM v= (youtu.be/ID?list= é vídeo)
          is_pl = (path == '/playlist') or (bool(q.get('list')) and not q.get('v') and host != 'youtu.be')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
            f.write(f"IS_PLAYLIST={'true' if is_pl else 'false'}\n")
          print("→ modo:", "PLAYLIST (um vídeo de cada vez)" if is_pl else "vídeo único")
          PYEOF

      - name: 'Playlist: baixar, compatibilizar e enviar (um vídeo de cada vez)'
        if: env.IS_PLAYLIST == 'true'
        env:
          VIDEO_URL:            ${{ inputs.video_url }}
          YTDLP_COOKIES:        ${{ secrets.YTDLP_COOKIES }}
          INPUT_METADATA:       ${{ inputs.metadata }}
          INPUT_THUMBNAIL_URL:  ${{ inputs.thumbnail_url }}
          INPUT_PLAYLIST_ITEMS: ${{ inputs.playlist_items }}
          INPUT_SKIP_FIRST:     ${{ inputs.skip_first_item }}
          TG_API_ID:            ${{ secrets.TG_API_ID }}
          TG_API_HASH:          ${{ secrets.TG_API_HASH }}
          TG_BOT_TOKEN:         ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT:              ${{ secrets.TG_CHAT }}
        run: |
          if [ -n "$YTDLP_COOKIES" ]; then
            echo "$YTDLP_COOKIES" > /tmp/cookies.txt
            echo "✓ Cookies carregados ($(wc -l < /tmp/cookies.txt) linhas)"
          else
            echo "⚠ YTDLP_COOKIES vazio — a tentar sem cookies"
          fi

          python3 << 'PYEOF'
          import os, re, json, subprocess, asyncio, time, random, shutil
          from telethon import TelegramClient
          from telethon.sessions import StringSession
          from telethon.tl.types import DocumentAttributeVideo

          LIMIT  = 2_000_000_000
          PRE    = 1_950_000_000
          TARGET = 1_880_000_000

          work      = os.environ['WORK_DIR']
          dl_dir    = os.path.join(work, 'pl_item')
          out_dir   = os.path.join(work, 'out');    os.makedirs(out_dir, exist_ok=True)
          thumb_dir = os.path.join(work, 'thumbs'); os.makedirs(thumb_dir, exist_ok=True)

          cookie_args = ['--cookies', '/tmp/cookies.txt'] if os.path.exists('/tmp/cookies.txt') else []
          url        = os.environ['VIDEO_URL'].strip()
          items_arg  = os.environ.get('INPUT_PLAYLIST_ITEMS', '').strip()
          skip_first = os.environ.get('INPUT_SKIP_FIRST', 'false').strip().lower() == 'true'
          try:    metadata = json.loads(os.environ.get('INPUT_METADATA', '') or '{}')
          except Exception: metadata = {}
          series_title = (metadata.get('title') or '').strip()
          thumb_url    = os.environ.get('INPUT_THUMBNAIL_URL', '').strip()

          # ── 1. Listar a playlist (rápido, não baixa nada) ──
          cmd = ['yt-dlp', '--flat-playlist', '--ignore-errors', '--no-warnings',
                 '--remote-components', 'ejs:github', *cookie_args,
                 '--print', '%(playlist_index)s\t%(id)s\t%(title)s']
          if items_arg: cmd += ['--playlist-items', items_arg]
          cmd.append(url)
          r = subprocess.run(cmd, capture_output=True, text=True, timeout=300)
          items = []
          for line in r.stdout.splitlines():
            p = line.split('\t', 2)
            if len(p) == 3 and p[0].strip().isdigit() and re.fullmatch(r'[A-Za-z0-9_-]{11}', p[1].strip()):
              items.append({'index': int(p[0]), 'id': p[1].strip(), 'title': p[2].strip()})
          items.sort(key=lambda it: it['index'])

          if skip_first and items:
            rem = items.pop(0)
            print(f"→ skip_first_item: ignorado item {rem['index']} ({rem['id']})")
          if not items:
            print(f"ERRO: nenhum vídeo na playlist (rc={r.returncode}): {r.stderr.strip()[:400]}")
            raise SystemExit(1)
          print(f"→ {len(items)} vídeo(s): {[it['index'] for it in items]}")

          # ── 2. Funções (mesma lógica do modo vídeo único) ──
          def download(vid):
            watch = f'https://www.youtube.com/watch?v={vid}'
            for client in ('', 'youtube:player_client=mweb', 'youtube:player_client=web_safari', 'youtube:player_client=tv'):
              shutil.rmtree(dl_dir, ignore_errors=True); os.makedirs(dl_dir)
              extra = ['--extractor-args', client] if client else []
              cmd = ['yt-dlp', *cookie_args, *extra, '--remote-components', 'ejs:github',
                     '-S', 'vcodec:h264,res,acodec:aac,ext:mp4:m4a', '-f', 'bv*+ba/b',
                     '--merge-output-format', 'mp4', '--retries', '5', '--fragment-retries', '5',
                     '--sleep-requests', '1', '--no-playlist',
                     '-o', os.path.join(dl_dir, 'input.%(ext)s'), watch]
              print(f"  → download (cliente: {client or 'default'})")
              if subprocess.run(cmd).returncode == 0:
                fs = [os.path.join(dl_dir, f) for f in os.listdir(dl_dir)]
                if fs and os.path.getsize(fs[0]) > 10000: return fs[0]
            return None

          def probe(path):
            rr = subprocess.run(['ffprobe','-v','error','-print_format','json',
                                 '-show_streams','-show_format', path], capture_output=True, text=True)
            d = json.loads(rr.stdout or '{}'); st = d.get('streams', [])
            return (d, next((s for s in st if s.get('codec_type') == 'video'), None),
                       next((s for s in st if s.get('codec_type') == 'audio'), None))

          def prepare(src, idx):
            d, v, a = probe(src)
            if not v: raise RuntimeError('sem stream de vídeo')
            dur  = float(d.get('format', {}).get('duration') or 0)
            h    = int(v.get('height') or 0)
            size = os.path.getsize(src)
            vc, pix = v.get('codec_name'), v.get('pix_fmt', '')
            can_copy = (vc == 'h264' and pix in ('yuv420p', 'yuvj420p'))
            aac = (a is not None and a.get('codec_name') == 'aac')
            out = os.path.join(out_dir, f'video_{idx}.mp4')

            def shrink_vargs():
              if dur <= 0: raise RuntimeError('duração desconhecida')
              vbr = int(TARGET * 8 / dur) - 160_000
              if vbr < 400_000: raise RuntimeError(f'demasiado longo p/ 2 GB ({vbr//1000} kbps)')
              vf = ['-vf', 'scale=-2:720'] if (h > 720 and vbr < 1_800_000) else []
              return vf + ['-c:v','libx264','-preset','veryfast','-b:v',str(vbr),
                           '-maxrate',str(int(vbr*1.15)),'-bufsize',str(vbr*2),'-pix_fmt','yuv420p']

            if size > PRE:   attempts = ['shrink']
            elif can_copy:   attempts = ['copy', 'crf', 'shrink']
            else:            attempts = ['crf', 'shrink']

            failed_once = False
            for mode in attempts:
              if mode == 'copy':   vargs = ['-c:v', 'copy']
              elif mode == 'crf':  vargs = ['-c:v','libx264','-preset','veryfast','-crf','18','-pix_fmt','yuv420p']
              else:                vargs = shrink_vargs()
              aargs = ['-c:a','copy'] if (aac and not failed_once) else ['-c:a','aac','-b:a','160k','-ac','2']
              print(f"  → modo: {mode}")
              ok = subprocess.run(['ffmpeg','-hide_banner','-loglevel','warning','-stats','-i',src,
                                   '-map','0:v:0','-map','0:a:0?', *vargs, *aargs,
                                   '-movflags','+faststart','-y', out]).returncode == 0
              if ok and os.path.getsize(out) <= LIMIT: break
              failed_once = True
              if os.path.exists(out): os.remove(out)
            else:
              raise RuntimeError('não coube no limite do Telegram')

            d2, v2, _ = probe(out)
            dur2 = int(float(d2['format'].get('duration') or dur))
            print(f"  ✓ {v2['width']}x{v2['height']} | {dur2}s | {os.path.getsize(out)//(1024*1024)} MB")
            return out, int(v2['width']), int(v2['height']), dur2

          def valid_image(p, min_bytes=100):
            if not os.path.exists(p) or os.path.getsize(p) < min_bytes: return False
            with open(p, 'rb') as f: hd = f.read(12)
            return (hd[:3] == b'\xff\xd8\xff' or hd[:4] == b'\x89PNG' or hd[:4] == b'RIFF'
                    or hd[:6] in (b'GIF87a', b'GIF89a'))

          def fetch(u, dest):
            subprocess.run(['curl','-sL','--retry','2','--max-time','15','-H','User-Agent: Mozilla/5.0','-o',dest,u],
                           capture_output=True)
            if valid_image(dest): return True
            if os.path.exists(dest): os.remove(dest)
            return False

          def make_thumb(vid, idx):
            raw = os.path.join(thumb_dir, f'raw_{idx}')
            got = bool(thumb_url) and fetch(thumb_url, raw)       # URL única p/ todos
            if not got:
              for q in ('maxresdefault','sddefault','hqdefault','mqdefault','default'):
                if fetch(f'https://i.ytimg.com/vi/{vid}/{q}.jpg', raw): got = True; break
            if not got: return None
            out = os.path.join(thumb_dir, f'thumb_{idx}.jpg')
            rr = subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-i',raw,
                                 '-vf','scale=320:320:force_original_aspect_ratio=decrease','-q:v','5',out],
                                capture_output=True)
            return out if (rr.returncode == 0 and os.path.exists(out) and os.path.getsize(out) <= 200*1024) else None

          last = {'t': 0}
          def progress(sent, total):
            now = time.time()
            if now - last['t'] > 10 or sent == total:
              last['t'] = now
              print(f"  upload {sent*100//total}% ({sent//(1024*1024)}/{total//(1024*1024)} MB)", flush=True)

          chat = os.environ['TG_CHAT'].strip()
          chat = int(chat) if chat.lstrip('-').isdigit() else chat

          # ── 3. Um vídeo de cada vez: baixar → compatibilizar → enviar → apagar ──
          async def main():
            client = TelegramClient(StringSession(), int(os.environ['TG_API_ID']),
                                    os.environ['TG_API_HASH'], flood_sleep_threshold=300)
            await client.start(bot_token=os.environ['TG_BOT_TOKEN'])
            sent_ok, failed = [], []
            try:
              for n, it in enumerate(items, start=1):
                print(f"════ [{n}/{len(items)}] item {it['index']} — {it['id']} ════")
                src = out = None
                try:
                  src = await asyncio.to_thread(download, it['id'])
                  if not src: raise RuntimeError('download falhou em todos os clientes')
                  out, w, h, dur = await asyncio.to_thread(prepare, src, it['index'])
                  thumb = await asyncio.to_thread(make_thumb, it['id'], it['index'])
                  cap = (f"{series_title} — Ep. {it['index']}" if series_title else it['title'])[:1024]
                  await client.send_file(
                    chat, out, caption=cap, thumb=thumb, supports_streaming=True, force_document=False,
                    attributes=[DocumentAttributeVideo(duration=dur, w=w, h=h, supports_streaming=True)],
                    progress_callback=progress)
                  sent_ok.append(it['index']); print(f"✓ item {it['index']} enviado")
                except Exception as ex:
                  failed.append(it['index']); print(f"✗ item {it['index']} falhou — {ex}")
                finally:
                  for p in (out, src):
                    if p and os.path.exists(p):
                      try: os.remove(p)
                      except Exception: pass
                shutil.rmtree(dl_dir, ignore_errors=True)
                if n < len(items):
                  pause = random.randint(10, 30)   # alivia o YouTube/IP do runner
                  print(f"  … pausa de {pause}s"); await asyncio.sleep(pause)
            finally:
              await client.disconnect()
            print(f"── Resumo: {len(sent_ok)} enviado(s) {sent_ok} | {len(failed)} falha(s) {failed}")
            if not sent_ok:
              raise SystemExit(1)

          asyncio.run(main())
          PYEOF

      - name: Descarregar vídeo (yt-dlp, melhor qualidade)
        if: env.IS_PLAYLIST != 'true'
        env:
          VIDEO_URL:     ${{ inputs.video_url }}
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
        run: |
          COOKIE_ARGS=()
          if [ -n "$YTDLP_COOKIES" ]; then
            echo "$YTDLP_COOKIES" > /tmp/cookies.txt
            COOKIE_ARGS=(--cookies /tmp/cookies.txt)
            echo "✓ Cookies carregados ($(wc -l < /tmp/cookies.txt) linhas)"
          else
            echo "⚠ YTDLP_COOKIES vazio/inexistente — a tentar sem cookies (IPs do GitHub costumam ser bloqueados)"
          fi

          # Tenta vários clientes do YouTube em sequência: o bloqueio
          # costuma afectar só alguns. "" = cliente por defeito do yt-dlp.
          OK=0
          for CLIENT in "" "youtube:player_client=mweb" "youtube:player_client=web_safari" "youtube:player_client=tv"; do
            echo "════ Tentativa com cliente: ${CLIENT:-default} ════"
            EXTRA=()
            if [ -n "$CLIENT" ]; then EXTRA=(--extractor-args "$CLIENT"); fi
            rm -rf "$WORK_DIR/incoming" && mkdir -p "$WORK_DIR/incoming"

            # -S: prioriza h264 (toca inline no Telegram), depois a maior
            # resolução, depois aac. Sem limite de altura.
            if yt-dlp \
                "${COOKIE_ARGS[@]}" "${EXTRA[@]}" \
                --remote-components ejs:github \
                -S "vcodec:h264,res,acodec:aac,ext:mp4:m4a" \
                -f "bv*+ba/b" \
                --merge-output-format mp4 \
                --retries 5 \
                --fragment-retries 5 \
                --sleep-requests 1 \
                --no-playlist \
                --print-to-file "%(id)s"    "$WORK_DIR/video_id.txt" \
                --print-to-file "%(title)s" "$WORK_DIR/video_title.txt" \
                -o "$WORK_DIR/incoming/input.%(ext)s" \
                "$VIDEO_URL"; then
              OK=1; break
            fi
            echo "⚠ Cliente ${CLIENT:-default} falhou — a tentar o próximo"
          done

          if [ "$OK" != "1" ]; then
            echo "✗ Todos os clientes falharam. Causa provável: IP do runner bloqueado — renova o secret YTDLP_COOKIES (cookies frescos, de sessão anónima/privada exportada)."
            exit 1
          fi

          VIDEO_PATH=$(find "$WORK_DIR/incoming/" -type f | head -1)
          if [ -z "$VIDEO_PATH" ]; then
            echo "ERRO: yt-dlp não produziu nenhum ficheiro"; exit 1
          fi
          SIZE=$(stat -c%s "$VIDEO_PATH")
          if [ "$SIZE" -lt 10000 ]; then
            echo "⚠ Ficheiro demasiado pequeno — download provavelmente falhou"; exit 1
          fi
          echo "VIDEO_PATH=$VIDEO_PATH" >> $GITHUB_ENV
          echo "VIDEO_ID=$(head -1 "$WORK_DIR/video_id.txt" 2>/dev/null)" >> $GITHUB_ENV
          echo "✓ Vídeo: $VIDEO_PATH ($(du -sh "$VIDEO_PATH" | cut -f1))"

      - name: Compatibilizar para Telegram (h264 + aac + faststart)
        if: env.IS_PLAYLIST != 'true'
        run: |
          VC=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$VIDEO_PATH")
          AC=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$VIDEO_PATH")
          echo "  codec vídeo=$VC | áudio=${AC:-nenhum}"

          if [ "$VC" = "h264" ]; then
            VARGS="-c:v copy"
          else
            echo "  → re-encode vídeo (CRF 18, qualidade quase sem perdas visíveis)"
            VARGS="-c:v libx264 -preset veryfast -crf 18 -pix_fmt yuv420p"
          fi
          if [ "$AC" = "aac" ]; then AARGS="-c:a copy"; else AARGS="-c:a aac -b:a 192k"; fi

          OUT="$WORK_DIR/out/video.mp4"
          ffmpeg -hide_banner -loglevel warning -stats \
            -i "$VIDEO_PATH" -map 0:v:0 -map "0:a:0?" \
            $VARGS $AARGS -movflags +faststart -y "$OUT"

          rm -rf "$WORK_DIR/incoming"   # libertar espaço

          W=$(ffprobe -v error -select_streams v:0 -show_entries stream=width  -of csv=p=0 "$OUT")
          H=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$OUT")
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$OUT")
          SIZE=$(stat -c%s "$OUT")

          {
            echo "FINAL_PATH=$OUT"
            echo "FINAL_W=$W"
            echo "FINAL_H=$H"
            echo "FINAL_DUR=${DUR%.*}"
          } >> $GITHUB_ENV
          echo "✓ Final: ${W}x${H} | ${DUR%.*}s | $(du -sh "$OUT" | cut -f1)"

          if [ "$SIZE" -gt $((2000*1024*1024)) ]; then
            echo "✗ Ficheiro tem $((SIZE/1024/1024)) MB — acima do limite de 2 GB do Telegram"
            exit 1
          fi

      - name: Enviar para o Telegram
        if: env.IS_PLAYLIST != 'true'
        env:
          TG_API_ID:           ${{ secrets.TG_API_ID }}
          TG_API_HASH:         ${{ secrets.TG_API_HASH }}
          TG_BOT_TOKEN:        ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT:             ${{ secrets.TG_CHAT }}
          INPUT_METADATA:      ${{ inputs.metadata }}
          INPUT_THUMBNAIL_URL: ${{ inputs.thumbnail_url }}
        run: |
          python3 << 'PYEOF'
          import os, json, subprocess, asyncio, time
          from telethon import TelegramClient
          from telethon.sessions import StringSession
          from telethon.tl.types import DocumentAttributeVideo

          work_dir = os.environ['WORK_DIR']
          video    = os.environ['FINAL_PATH']
          w, h     = int(os.environ['FINAL_W']), int(os.environ['FINAL_H'])
          dur      = int(os.environ.get('FINAL_DUR') or 0)
          video_id = os.environ.get('VIDEO_ID', '').strip()
          thumb_url = os.environ.get('INPUT_THUMBNAIL_URL', '').strip()

          try:    metadata = json.loads(os.environ.get('INPUT_METADATA', '') or '{}')
          except: metadata = {}

          # ── Legenda (limite do Telegram: 1024 caracteres) ──
          title = (metadata.get('title') or '').strip()
          if not title:
            try: title = open(os.path.join(work_dir, 'video_title.txt'), encoding='utf-8').read().strip()
            except Exception: title = ''
          caption = title
          if len(caption) > 1024:
            caption = caption[:1021] + '...'

          # ── Thumbnail: URL fornecida → fallback nativo do YouTube ──
          def valid_image(p, min_bytes=100):
            if not os.path.exists(p) or os.path.getsize(p) < min_bytes: return False
            with open(p, 'rb') as f: hd = f.read(12)
            return (hd[:3] == b'\xff\xd8\xff' or hd[:4] == b'\x89PNG' or hd[:4] == b'RIFF'
                    or hd[:6] in (b'GIF87a', b'GIF89a'))

          def download(url, dest):
            subprocess.run(['curl', '-sL', '--retry', '2', '--retry-delay', '2', '--max-time', '15',
                            '-H', 'User-Agent: Mozilla/5.0', '-o', dest, url], capture_output=True)
            if valid_image(dest): return True
            if os.path.exists(dest): os.remove(dest)
            return False

          raw = os.path.join(work_dir, 'thumbs', 'raw')
          got = False
          if thumb_url:
            got = download(thumb_url, raw)
            print('✓ thumbnail fornecida' if got else '⚠ thumbnail fornecida falhou — fallback YouTube')
          if not got and video_id:
            for q in ('maxresdefault', 'sddefault', 'hqdefault', 'mqdefault', 'default'):
              if download(f"https://i.ytimg.com/vi/{video_id}/{q}.jpg", raw):
                print(f"✓ thumbnail YouTube ({q})"); got = True; break

          thumb = None
          if got:
            # Telegram exige JPEG pequeno (≤200 KB, lado maior ≤320 px) para a miniatura
            out = os.path.join(work_dir, 'thumbs', 'thumb.jpg')
            r = subprocess.run(['ffmpeg', '-hide_banner', '-loglevel', 'error', '-y', '-i', raw,
                                '-vf', 'scale=320:320:force_original_aspect_ratio=decrease',
                                '-q:v', '5', out], capture_output=True)
            if r.returncode == 0 and os.path.exists(out) and os.path.getsize(out) <= 200 * 1024:
              thumb = out
          if not thumb:
            print('⚠ sem miniatura personalizada (o Telegram gera uma automática)')

          # ── Envio ──
          chat = os.environ['TG_CHAT'].strip()
          chat = int(chat) if chat.lstrip('-').isdigit() else chat

          last = {'t': 0}
          def progress(sent, total):
            now = time.time()
            if now - last['t'] > 10 or sent == total:
              last['t'] = now
              print(f"  upload {sent*100//total}% ({sent//(1024*1024)}/{total//(1024*1024)} MB)", flush=True)

          async def main():
            client = TelegramClient(StringSession(), int(os.environ['TG_API_ID']), os.environ['TG_API_HASH'])
            await client.start(bot_token=os.environ['TG_BOT_TOKEN'])
            try:
              await client.send_file(
                chat, video, caption=caption, thumb=thumb,
                supports_streaming=True, force_document=False,
                attributes=[DocumentAttributeVideo(duration=dur, w=w, h=h, supports_streaming=True)],
                progress_callback=progress)
              print('✓ Vídeo enviado para o Telegram')
            finally:
              await client.disconnect()

          asyncio.run(main())
          PYEOF

      - name: Notificar dispatcher (webhook FIFO)
        if: success() || failure()
        continue-on-error: true
        run: |
          if [ -z "$DISPATCHER_URL" ]; then echo "⚠ DISPATCHER_URL não configurado"; exit 0; fi
          EFFECTIVE_JOB_ID="${JOB_ID:-${{ inputs.job_id }}}"
          if [ -z "$EFFECTIVE_JOB_ID" ]; then echo "⚠ job_id indisponível"; exit 0; fi
          if [ "${{ job.status }}" = "success" ]; then WEBHOOK_STATUS="done"; else WEBHOOK_STATUS="failed"; fi
          WEBHOOK_URL="${DISPATCHER_URL%/}/dlp/webhook"
          echo "→ POST ${WEBHOOK_URL} (job_id=${EFFECTIVE_JOB_ID}, status=${WEBHOOK_STATUS})"
          HTTP_CODE=$(curl -s -o /tmp/wh_resp.txt -w '%{http_code}' -X POST \
            -H "Content-Type: application/json" -H "x-api-key: ${ADMIN_API_KEY_YT}" \
            --max-time 20 --retry 2 --retry-delay 3 "${WEBHOOK_URL}" \
            -d "{\"job_id\":\"${EFFECTIVE_JOB_ID}\",\"status\":\"${WEBHOOK_STATUS}\"}") || true
          if [[ "$HTTP_CODE" =~ ^2 ]]; then echo "✓ Webhook enviado (HTTP $HTTP_CODE)"; else
            echo "✗ Webhook falhou (HTTP $HTTP_CODE)"; cat /tmp/wh_resp.txt 2>/dev/null || true; fi

      - name: Cleanup
        if: always()
        run: |
          rm -rf "$WORK_DIR"
          rm -f /tmp/wh_resp.txt /tmp/cookies.txt
          echo "✓ Workspace limpo"

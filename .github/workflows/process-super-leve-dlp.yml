name: StreamVault Process (DLP → Telegram)

# ═══════════════════════════════════════════════════════════════════════
# Versão simplificada: yt-dlp (melhor qualidade) → Telegram. Nada mais.
#
# REMOVIDO: HLS, encriptação ChaCha20, shards/push GitHub, registo no
# EdgeOne, canal/batching, cookie self-refresh, limite de altura.
# PLAYLIST (type anime/series + link com list=): como no original, este
# job vira coordinator — lista a playlist e enfileira CADA vídeo no lote F
# (secrets LOTE_F_WORKER_BASE/KEY); cada um corre no seu próprio runner.
# playlist_items filtra quais enfileirar; skip_first_item ignora o 1º.
#
# MANTIDO: yt-dlp + Deno, cookies opcionais, thumbnail (URL fornecida →
# fallback nativo do YouTube), webhook do dispatcher (libertar a fila),
# cleanup.
#
# QUALIDADE: melhor disponível em H.264 (até 1080p no YouTube) para o
# vídeo tocar inline no Telegram. Se a fonte não vier em h264/aac, o
# step "Compatibilizar" re-encoda (CRF 18). Resoluções acima de 1080p só
# existem em VP9/AV1 — seriam re-encodadas, por isso não são preferidas.
#
# SECRETS NOVOS: TG_API_ID, TG_API_HASH, TG_BOT_TOKEN, TG_CHAT
# (restantes, como DISPATCHER_URL / ADMIN_API_KEY_YT / YTDLP_COOKIES,
# são os que já tinhas).
#
# LIMITE TELEGRAM: 2 GB por ficheiro (bot via MTProto). Acima disso o
# job falha com mensagem clara.
# ═══════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Job ID'
        required: true
      video_url:
        description: 'URL do vídeo no YouTube'
        required: true
      metadata:
        description: 'JSON: { title, ... } (só o título é usado na legenda)'
        required: false
        default: '{}'
      thumbnail_url:
        description: 'URL da thumbnail (qualquer plataforma). Vazio = thumbnail nativa do YouTube.'
        required: false
        default: ''
      timeout_minutes:
        description: 'Teto do job (minutos).'
        required: false
        default: '60'
      # ── Inputs mantidos SÓ por compatibilidade com o dispatcher/worker
      # (se o dispatcher enviar um input que o workflow não declara, o
      # GitHub responde 422). Ignorados neste workflow. ──
      seg_duration:
        description: '(ignorado)'
        required: false
        default: '4'
      max_encode_height:
        description: '(ignorado — agora é sempre a melhor qualidade)'
        required: false
        default: '720'
      playlist_items:
        description: 'Só playlists (anime/series): yt-dlp --playlist-items (ex.: 1-10) = quais enfileirar. Vazio = todos.'
        required: false
        default: ''
      skip_first_item:
        description: 'Só para playlists: "true" ignora o 1º vídeo da lista.'
        required: false
        default: 'false'

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJson(inputs.timeout_minutes) }}
    permissions:
      contents: read

    env:
      WORK_DIR:         /tmp/sv_work/${{ inputs.job_id }}
      ADMIN_API_KEY_YT: ${{ secrets.ADMIN_API_KEY_YT }}
      DISPATCHER_URL:   ${{ secrets.DISPATCHER_URL }}

    steps:
      - name: Preparar ambiente
        run: |
          echo "JOB_ID=${{ inputs.job_id }}" >> $GITHUB_ENV
          mkdir -p "$WORK_DIR/incoming" "$WORK_DIR/out" "$WORK_DIR/thumbs"

      - name: Instalar ffmpeg (cache)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: ffmpeg
          version: 1.0
          execute_install_scripts: true

      - name: Instalar yt-dlp, Telethon e Deno
        run: |
          # cryptg acelera muito o upload/download MTProto do Telethon
          pip install --quiet --upgrade yt-dlp telethon cryptg
          ffmpeg -version | head -1
          yt-dlp --version
          # Runtime JS (Deno) exigido pelo yt-dlp recente p/ assinaturas do YouTube
          curl -fsSL https://deno.land/install.sh | sh -s -- -y
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          "$HOME/.deno/bin/deno" --version

      # ═══════════════════════════════════════════════════════════════════
      # PLAYLIST — como no process-super-leve-dlp.yml original: só para
      # type anime/series; qualquer link com list= (ou /playlist) conta
      # como playlist. Este job vira "coordinator": NÃO baixa nada, lista
      # a playlist e enfileira CADA vídeo no lote F (POST /upload-event) —
      # cada um corre depois no seu próprio runner, como links watch?v=
      # simples (que caem no fluxo de vídeo único abaixo).
      # ═══════════════════════════════════════════════════════════════════
      - name: Detectar playlist
        env:
          VIDEO_URL:      ${{ inputs.video_url }}
          INPUT_METADATA: ${{ inputs.metadata }}
        run: |
          python3 << 'PYEOF'
          import os, json
          from urllib.parse import urlparse, parse_qs
          try:    metadata = json.loads(os.environ.get('INPUT_METADATA', '') or '{}')
          except Exception: metadata = {}
          ctype = (metadata.get('type') or 'video').strip().lower()
          u    = urlparse(os.environ['VIDEO_URL'].strip())
          q    = parse_qs(u.query)
          path = u.path.rstrip('/')
          has_list = bool(q.get('list')) or path == '/playlist'
          is_pl = ctype in ('anime', 'series') and has_list
          with open(os.environ['GITHUB_ENV'], 'a') as f:
            f.write(f"IS_PLAYLIST={'true' if is_pl else 'false'}\n")
          print(f"→ type={ctype} | list= no link: {has_list} | modo:",
                "PLAYLIST (coordinator: um runner por vídeo)" if is_pl else "vídeo único")
          PYEOF

      - name: 'Playlist: listar e enfileirar cada vídeo no lote F'
        if: env.IS_PLAYLIST == 'true'
        env:
          VIDEO_URL:            ${{ inputs.video_url }}
          YTDLP_COOKIES:        ${{ secrets.YTDLP_COOKIES }}
          INPUT_METADATA:       ${{ inputs.metadata }}
          INPUT_THUMBNAIL_URL:  ${{ inputs.thumbnail_url }}
          INPUT_PLAYLIST_ITEMS: ${{ inputs.playlist_items }}
          INPUT_SKIP_FIRST:     ${{ inputs.skip_first_item }}
          SEG_DURATION:         ${{ inputs.seg_duration }}
          MAX_H:                ${{ inputs.max_encode_height }}
          # MESMOS secrets que o original usava para falar com o worker do lote F
          LOTE_F_WORKER_BASE:   ${{ secrets.LOTE_F_WORKER_BASE }}
          LOTE_F_WORKER_KEY:    ${{ secrets.LOTE_F_WORKER_KEY }}
        run: |
          if [ -n "$YTDLP_COOKIES" ]; then
            echo "$YTDLP_COOKIES" > /tmp/cookies.txt
            echo "✓ Cookies carregados ($(wc -l < /tmp/cookies.txt) linhas)"
          fi

          python3 << 'PYEOF'
          import os, re, json, time, subprocess, urllib.request, urllib.error

          cookie_args = ['--cookies', '/tmp/cookies.txt'] if os.path.exists('/tmp/cookies.txt') else []
          url        = os.environ['VIDEO_URL'].strip()
          items_arg  = os.environ.get('INPUT_PLAYLIST_ITEMS', '').strip()
          skip_first = os.environ.get('INPUT_SKIP_FIRST', 'false').strip().lower() == 'true'
          thumb_url  = os.environ.get('INPUT_THUMBNAIL_URL', '').strip()
          job_id     = os.environ['JOB_ID']
          try:    metadata = json.loads(os.environ.get('INPUT_METADATA', '') or '{}')
          except Exception: metadata = {}
          series_title = (metadata.get('title') or '').strip()

          worker_base = os.environ.get('LOTE_F_WORKER_BASE', '').rstrip('/')
          worker_key  = os.environ.get('LOTE_F_WORKER_KEY', '')
          if not worker_base:
            raise SystemExit("ERRO: LOTE_F_WORKER_BASE/LOTE_F_WORKER_KEY não configurados — sem eles "
                             "não é possível enfileirar os vídeos da playlist.")

          # ── 1. Listar a playlist (rápido, não baixa nada) ──
          cmd = ['yt-dlp', '--flat-playlist', '--ignore-errors', '--no-warnings',
                 '--remote-components', 'ejs:github', *cookie_args,
                 '--print', '%(playlist_index)s\t%(id)s\t%(title)s']
          if items_arg: cmd += ['--playlist-items', items_arg]
          cmd.append(url)
          r = subprocess.run(cmd, capture_output=True, text=True, timeout=300)
          items = []
          for line in r.stdout.splitlines():
            p = line.split('\t', 2)
            if len(p) == 3 and p[0].strip().isdigit() and re.fullmatch(r'[A-Za-z0-9_-]{11}', p[1].strip()):
              items.append({'index': int(p[0]), 'id': p[1].strip(), 'title': p[2].strip()})
          items.sort(key=lambda it: it['index'])

          if skip_first and items:
            rem = items.pop(0)
            print(f"→ skip_first_item: ignorado item {rem['index']} ({rem['id']})")
          if not items:
            raise SystemExit(f"ERRO: nenhum vídeo na playlist (rc={r.returncode}): {r.stderr.strip()[:400]}")
          print(f"→ {len(items)} vídeo(s) a enfileirar: {[it['index'] for it in items]}")

          # ── 2. Enfileirar cada vídeo no lote F (só entra na fila pendente;
          # quem dispara é o cron/botão do lote, com concorrência=1 e gap).
          # Sem qualquer limite de quantidade: enfileira TODOS os itens listados. ──
          queued = failed = auth_fails = 0
          # Diagnóstico da fila (igual ao coordinator de canal do original): o worker
          # devolve `position` (= tamanho do array `pending` depois deste push). Numa
          # fila saudável sobe de 1 em 1; salto/queda sugere escrita perdida no KV
          # (o worker faz ler→acrescentar→regravar num único registo).
          last_pos = None; pos_warn = 0
          for it in items:
            watch_url = f"https://www.youtube.com/watch?v={it['id']}"
            title = f"{series_title} — Ep. {it['index']}" if series_title else it['title']
            body = {
              'job_id': f"{job_id}-ep{it['index']}",
              'video_url': watch_url,                       # link simples → fluxo de vídeo único
              'metadata': {**metadata, 'title': title, **({'folder': series_title} if series_title else {})},
              'thumbnail_url': thumb_url,
              'seg_duration': os.environ.get('SEG_DURATION', '4'),
              'max_encode_height': os.environ.get('MAX_H', '720'),
            }
            req = urllib.request.Request(
              f"{worker_base}/upload-event", data=json.dumps(body).encode(),
              headers={'Content-Type': 'application/json', 'x-api-key': worker_key,
                       # UA próprio: o default do urllib é barrado (403) pelo firewall da Cloudflare
                       'User-Agent': 'streamvault-runner/1.0'},
              method='POST')
            try:
              with urllib.request.urlopen(req, timeout=20) as resp:
                raw = resp.read().decode('utf-8', 'replace')
                queued += 1; auth_fails = 0
                try:    pos = int(json.loads(raw).get('position'))
                except Exception: pos = None
                pos_note = ''
                if pos is not None:
                  if last_pos is not None and pos != last_pos + 1:
                    pos_warn += 1
                    pos_note = f" ⚠ posição inesperada (esperado {last_pos + 1})"
                  last_pos = pos
                print(f"  ✓ ep{it['index']} ({it['id']}) enfileirado (HTTP {resp.status}, posição {pos}){pos_note}: {title[:70]}")
            except urllib.error.HTTPError as ex:
              failed += 1
              detail = ex.read().decode('utf-8', 'replace').replace('\n', ' ')[:200]
              print(f"  ✗ ep{it['index']}: HTTP {ex.code} — {detail!r} — NÃO entrou na fila")
              auth_fails = auth_fails + 1 if ex.code in (401, 403) else 0
              if auth_fails >= 3:
                raise SystemExit(f"ERRO: 3 respostas HTTP {ex.code} seguidas — a parar. 401 = LOTE_F_WORKER_KEY "
                                 f"diferente da do worker; 403 = barrado pela Cloudflare; confirma também que "
                                 f"LOTE_F_WORKER_BASE é o URL do worker (sem barra final nem caminho).")
            except Exception as ex:
              failed += 1
              print(f"  ✗ ep{it['index']}: {ex} — NÃO entrou na fila")
            time.sleep(3)   # espaça os POSTs: o worker regrava a fila inteira a cada push

          print(f"── Resumo: {queued} enfileirado(s), {failed} falha(s), de {len(items)} vídeo(s)")
          # Confronto final com o que o worker diz ter na fila (GET /status é público).
          # Pode incluir itens que já lá estavam e vir ligeiramente desfasado (KV
          # eventualmente consistente) — serve de evidência, não de veredicto.
          try:
            rs = urllib.request.Request(f"{worker_base}/status", headers={'User-Agent': 'streamvault-runner/1.0'})
            with urllib.request.urlopen(rs, timeout=15) as r2:
              st = json.loads(r2.read().decode('utf-8', 'replace'))
            print(f"── Fila do lote F segundo o worker: pending={st.get('pending')} | enfileirados por este job: {queued} | "
                  f"última posição devolvida: {last_pos} | saltos de posição: {pos_warn}")
          except Exception as ex:
            print(f"⚠ Não foi possível ler {worker_base}/status pra confrontar a fila ({ex})")
          if queued == 0:
            raise SystemExit("ERRO: nenhum vídeo foi enfileirado.")
          PYEOF

      - name: Descarregar vídeo (yt-dlp, melhor qualidade)
        if: env.IS_PLAYLIST != 'true'
        env:
          VIDEO_URL:     ${{ inputs.video_url }}
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
        run: |
          COOKIE_ARGS=()
          if [ -n "$YTDLP_COOKIES" ]; then
            echo "$YTDLP_COOKIES" > /tmp/cookies.txt
            COOKIE_ARGS=(--cookies /tmp/cookies.txt)
            echo "✓ Cookies carregados ($(wc -l < /tmp/cookies.txt) linhas)"
          else
            echo "⚠ YTDLP_COOKIES vazio/inexistente — a tentar sem cookies (IPs do GitHub costumam ser bloqueados)"
          fi

          # Tenta vários clientes do YouTube em sequência: o bloqueio
          # costuma afectar só alguns. "" = cliente por defeito do yt-dlp.
          OK=0
          for CLIENT in "" "youtube:player_client=mweb" "youtube:player_client=web_safari" "youtube:player_client=tv"; do
            echo "════ Tentativa com cliente: ${CLIENT:-default} ════"
            EXTRA=()
            if [ -n "$CLIENT" ]; then EXTRA=(--extractor-args "$CLIENT"); fi
            rm -rf "$WORK_DIR/incoming" && mkdir -p "$WORK_DIR/incoming"

            # -S: prioriza h264 (toca inline no Telegram), depois a maior
            # resolução, depois aac. Sem limite de altura.
            if yt-dlp \
                "${COOKIE_ARGS[@]}" "${EXTRA[@]}" \
                --remote-components ejs:github \
                -S "vcodec:h264,res,acodec:aac,ext:mp4:m4a" \
                -f "bv*+ba/b" \
                --merge-output-format mp4 \
                --retries 5 \
                --fragment-retries 5 \
                --sleep-requests 1 \
                --no-playlist \
                --print-to-file "%(id)s"    "$WORK_DIR/video_id.txt" \
                --print-to-file "%(title)s" "$WORK_DIR/video_title.txt" \
                -o "$WORK_DIR/incoming/input.%(ext)s" \
                "$VIDEO_URL"; then
              OK=1; break
            fi
            echo "⚠ Cliente ${CLIENT:-default} falhou — a tentar o próximo"
          done

          if [ "$OK" != "1" ]; then
            echo "✗ Todos os clientes falharam. Causa provável: IP do runner bloqueado — renova o secret YTDLP_COOKIES (cookies frescos, de sessão anónima/privada exportada)."
            exit 1
          fi

          VIDEO_PATH=$(find "$WORK_DIR/incoming/" -type f | head -1)
          if [ -z "$VIDEO_PATH" ]; then
            echo "ERRO: yt-dlp não produziu nenhum ficheiro"; exit 1
          fi
          SIZE=$(stat -c%s "$VIDEO_PATH")
          if [ "$SIZE" -lt 10000 ]; then
            echo "⚠ Ficheiro demasiado pequeno — download provavelmente falhou"; exit 1
          fi
          echo "VIDEO_PATH=$VIDEO_PATH" >> $GITHUB_ENV
          echo "VIDEO_ID=$(head -1 "$WORK_DIR/video_id.txt" 2>/dev/null)" >> $GITHUB_ENV
          echo "✓ Vídeo: $VIDEO_PATH ($(du -sh "$VIDEO_PATH" | cut -f1))"

      - name: Compatibilizar para Telegram (h264 + aac + faststart)
        if: env.IS_PLAYLIST != 'true'
        run: |
          VC=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$VIDEO_PATH")
          AC=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$VIDEO_PATH")
          echo "  codec vídeo=$VC | áudio=${AC:-nenhum}"

          if [ "$VC" = "h264" ]; then
            VARGS="-c:v copy"
          else
            echo "  → re-encode vídeo (CRF 18, qualidade quase sem perdas visíveis)"
            VARGS="-c:v libx264 -preset veryfast -crf 18 -pix_fmt yuv420p"
          fi
          if [ "$AC" = "aac" ]; then AARGS="-c:a copy"; else AARGS="-c:a aac -b:a 192k"; fi

          OUT="$WORK_DIR/out/video.mp4"
          ffmpeg -hide_banner -loglevel warning -stats \
            -i "$VIDEO_PATH" -map 0:v:0 -map "0:a:0?" \
            $VARGS $AARGS -movflags +faststart -y "$OUT"

          rm -rf "$WORK_DIR/incoming"   # libertar espaço

          W=$(ffprobe -v error -select_streams v:0 -show_entries stream=width  -of csv=p=0 "$OUT")
          H=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$OUT")
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$OUT")
          SIZE=$(stat -c%s "$OUT")

          {
            echo "FINAL_PATH=$OUT"
            echo "FINAL_W=$W"
            echo "FINAL_H=$H"
            echo "FINAL_DUR=${DUR%.*}"
          } >> $GITHUB_ENV
          echo "✓ Final: ${W}x${H} | ${DUR%.*}s | $(du -sh "$OUT" | cut -f1)"

          if [ "$SIZE" -gt $((2000*1024*1024)) ]; then
            echo "✗ Ficheiro tem $((SIZE/1024/1024)) MB — acima do limite de 2 GB do Telegram"
            exit 1
          fi

      - name: Enviar para o Telegram
        if: env.IS_PLAYLIST != 'true'
        env:
          TG_API_ID:           ${{ secrets.TG_API_ID }}
          TG_API_HASH:         ${{ secrets.TG_API_HASH }}
          TG_BOT_TOKEN:        ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT:             ${{ secrets.TG_CHAT }}
          INPUT_METADATA:      ${{ inputs.metadata }}
          INPUT_THUMBNAIL_URL: ${{ inputs.thumbnail_url }}
        run: |
          python3 << 'PYEOF'
          import os, json, subprocess, asyncio, time
          from telethon import TelegramClient
          from telethon.sessions import StringSession
          from telethon.tl.types import DocumentAttributeVideo

          work_dir = os.environ['WORK_DIR']
          video    = os.environ['FINAL_PATH']
          w, h     = int(os.environ['FINAL_W']), int(os.environ['FINAL_H'])
          dur      = int(os.environ.get('FINAL_DUR') or 0)
          video_id = os.environ.get('VIDEO_ID', '').strip()
          thumb_url = os.environ.get('INPUT_THUMBNAIL_URL', '').strip()

          try:    metadata = json.loads(os.environ.get('INPUT_METADATA', '') or '{}')
          except: metadata = {}

          # ── Legenda (limite do Telegram: 1024 caracteres) ──
          title = (metadata.get('title') or '').strip()
          if not title:
            try: title = open(os.path.join(work_dir, 'video_title.txt'), encoding='utf-8').read().strip()
            except Exception: title = ''
          caption = title
          if len(caption) > 1024:
            caption = caption[:1021] + '...'

          # ── Thumbnail: URL fornecida → fallback nativo do YouTube ──
          def valid_image(p, min_bytes=100):
            if not os.path.exists(p) or os.path.getsize(p) < min_bytes: return False
            with open(p, 'rb') as f: hd = f.read(12)
            return (hd[:3] == b'\xff\xd8\xff' or hd[:4] == b'\x89PNG' or hd[:4] == b'RIFF'
                    or hd[:6] in (b'GIF87a', b'GIF89a'))

          def download(url, dest):
            subprocess.run(['curl', '-sL', '--retry', '2', '--retry-delay', '2', '--max-time', '15',
                            '-H', 'User-Agent: Mozilla/5.0', '-o', dest, url], capture_output=True)
            if valid_image(dest): return True
            if os.path.exists(dest): os.remove(dest)
            return False

          raw = os.path.join(work_dir, 'thumbs', 'raw')
          got = False
          if thumb_url:
            got = download(thumb_url, raw)
            print('✓ thumbnail fornecida' if got else '⚠ thumbnail fornecida falhou — fallback YouTube')
          if not got and video_id:
            for q in ('maxresdefault', 'sddefault', 'hqdefault', 'mqdefault', 'default'):
              if download(f"https://i.ytimg.com/vi/{video_id}/{q}.jpg", raw):
                print(f"✓ thumbnail YouTube ({q})"); got = True; break

          thumb = None
          if got:
            # Telegram exige JPEG pequeno (≤200 KB, lado maior ≤320 px) para a miniatura
            out = os.path.join(work_dir, 'thumbs', 'thumb.jpg')
            r = subprocess.run(['ffmpeg', '-hide_banner', '-loglevel', 'error', '-y', '-i', raw,
                                '-vf', 'scale=320:320:force_original_aspect_ratio=decrease',
                                '-q:v', '5', out], capture_output=True)
            if r.returncode == 0 and os.path.exists(out) and os.path.getsize(out) <= 200 * 1024:
              thumb = out
          if not thumb:
            print('⚠ sem miniatura personalizada (o Telegram gera uma automática)')

          # ── Envio ──
          chat = os.environ['TG_CHAT'].strip()
          chat = int(chat) if chat.lstrip('-').isdigit() else chat

          # ── "Pastas" no Telegram ──────────────────────────────────────────
          # Supergrupo com Tópicos: 1 tópico por pasta (criado se não existir).
          # Canal normal (sem tópicos): cai para uma #hashtag na legenda.
          import re, random

          TYPE_LABELS = {'movie':'Filmes','documentary':'Documentários','dorama':'Animações',
                         'series':'Séries','anime':'Animes','rain':'Chuva','relaxation':'Relaxamento',
                         'ai':'IA','other':'Outros','video':'Vídeos'}
          ctype = (metadata.get('type') or 'video').strip().lower()
          topic_cache = {}

          def tag(name):
            t = re.sub(r'\W+', '_', name, flags=re.UNICODE).strip('_')
            return ('#' + t) if t else ''

          async def place(client, chat, name):
            """(é_fórum, topic_id). Falha → (False, None): envia sem pasta, com hashtag."""
            try:
              # Os requests de tópicos vivem em telethon.tl.functions.MESSAGES (não em channels).
              from telethon.tl.functions.messages import GetForumTopicsRequest, CreateForumTopicRequest
              ent = await client.get_entity(chat)
              if not getattr(ent, 'forum', False):
                return False, None
              if name in topic_cache:
                return True, topic_cache[name]
              async def find():
                res = await client(GetForumTopicsRequest(peer=ent, offset_date=None, offset_id=0,
                                                         offset_topic=0, limit=100, q=name))
                for t in res.topics:
                  if getattr(t, 'title', None) == name: return t.id
                return None
              tid = await find()
              if tid is None:
                await client(CreateForumTopicRequest(peer=ent, title=name,
                                                     random_id=random.randrange(1, 2**62)))
                await asyncio.sleep(1)
                tid = await find()
              topic_cache[name] = tid
              print(f"  📁 pasta (tópico): {name} → id {tid}")
              return True, tid
            except Exception as ex:
              print(f"  ⚠ tópico '{name}' indisponível ({ex}) — envia sem pasta")
              return False, None

          folder_name = ((metadata.get('folder') or '').strip() or TYPE_LABELS.get(ctype, 'Vídeos'))[:128]

          async def preflight(client, chat):
            """Falha em segundos se o bot não puder escrever — ANTES de gastar o upload."""
            ent = await client.get_entity(chat)
            kind = 'fórum' if getattr(ent, 'forum', False) else ('canal' if getattr(ent, 'broadcast', False) else 'grupo')
            me = await client.get_me()
            is_admin = can_post = None
            try:
              perm = await client.get_permissions(ent, me)
              is_admin = bool(perm.is_admin)
              can_post = bool(getattr(perm, 'post_messages', False))
            except Exception as ex:
              print(f"  🔎 não consegui ler as permissões do bot ({type(ex).__name__}) — provavelmente não é membro/admin")
            dbr = getattr(ent, 'default_banned_rights', None)
            media_blocked = bool(dbr and (dbr.send_messages or dbr.send_media or getattr(dbr, 'send_videos', False)))
            print(f"  🔎 {kind} '{getattr(ent, 'title', chat)}' | bot=@{me.username} | admin={is_admin} | "
                  f"mídia bloqueada p/ membros={media_blocked}")
            problem = None
            if kind == 'canal' and is_admin is not None and not can_post:
              problem = "o bot não tem a permissão 'Publicar mensagens' neste canal"
            elif kind != 'canal' and is_admin is False and media_blocked:
              problem = "o grupo bloqueia o envio de mídia a membros e o bot não é administrador"
            elif kind != 'canal' and is_admin is False and kind == 'fórum':
              print("  ⚠ bot não é administrador do fórum — pode falhar a criação de tópicos")
            if problem:
              print(f"✗ SEM PERMISSÃO: {problem}. Corrige no Telegram (Administradores → o teu bot) e volta a correr. "
                    f"Nada foi enviado/descarregado em vão.")
              raise SystemExit(1)

          last = {'t': 0}
          def progress(sent, total):
            now = time.time()
            if now - last['t'] > 10 or sent == total:
              last['t'] = now
              print(f"  upload {sent*100//total}% ({sent//(1024*1024)}/{total//(1024*1024)} MB)", flush=True)

          async def main():
            client = TelegramClient(StringSession(), int(os.environ['TG_API_ID']), os.environ['TG_API_HASH'])
            await client.start(bot_token=os.environ['TG_BOT_TOKEN'])
            try:
              await preflight(client, chat)
              is_forum, tid = await place(client, chat, folder_name)
              cap = caption if is_forum else (caption[:1000] + '\n' + tag(folder_name)).strip()
              await client.send_file(
                chat, video, caption=cap, thumb=thumb, reply_to=tid,
                supports_streaming=True, force_document=False,
                attributes=[DocumentAttributeVideo(duration=dur, w=w, h=h, supports_streaming=True)],
                progress_callback=progress)
              print('✓ Vídeo enviado para o Telegram')
            finally:
              await client.disconnect()

          asyncio.run(main())
          PYEOF

      - name: Notificar dispatcher (webhook FIFO)
        if: success() || failure()
        continue-on-error: true
        run: |
          if [ -z "$DISPATCHER_URL" ]; then echo "⚠ DISPATCHER_URL não configurado"; exit 0; fi
          EFFECTIVE_JOB_ID="${JOB_ID:-${{ inputs.job_id }}}"
          if [ -z "$EFFECTIVE_JOB_ID" ]; then echo "⚠ job_id indisponível"; exit 0; fi
          if [ "${{ job.status }}" = "success" ]; then WEBHOOK_STATUS="done"; else WEBHOOK_STATUS="failed"; fi
          WEBHOOK_URL="${DISPATCHER_URL%/}/dlp/webhook"
          echo "→ POST ${WEBHOOK_URL} (job_id=${EFFECTIVE_JOB_ID}, status=${WEBHOOK_STATUS})"
          HTTP_CODE=$(curl -s -o /tmp/wh_resp.txt -w '%{http_code}' -X POST \
            -H "Content-Type: application/json" -H "x-api-key: ${ADMIN_API_KEY_YT}" \
            --max-time 20 --retry 2 --retry-delay 3 "${WEBHOOK_URL}" \
            -d "{\"job_id\":\"${EFFECTIVE_JOB_ID}\",\"status\":\"${WEBHOOK_STATUS}\"}") || true
          if [[ "$HTTP_CODE" =~ ^2 ]]; then echo "✓ Webhook enviado (HTTP $HTTP_CODE)"; else
            echo "✗ Webhook falhou (HTTP $HTTP_CODE)"; cat /tmp/wh_resp.txt 2>/dev/null || true; fi

      - name: Cleanup
        if: always()
        run: |
          rm -rf "$WORK_DIR"
          rm -f /tmp/wh_resp.txt /tmp/cookies.txt
          echo "✓ Workspace limpo"

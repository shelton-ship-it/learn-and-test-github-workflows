name: StreamVault Process (Super Leve DLP)

# ═══════════════════════════════════════════════════════════════════════
# Deriva do process-leve.yml. Substituição cirúrgica: lib-torrent → yt-dlp.
# Mesmo diretório de workflows, mesma estrutura, mesmas envs/secrets do
# workflow antigo — só o necessário para essa troca foi alterado.
#
# REMOVIDO (consequência direta de tirar o torrent, não redesenho):
#   - libtorrent (apt + pip) e todo o [Coordinator] — servia só pra
#     separar múltiplos ficheiros dentro de UM magnet/torrent de série;
#     o link lógico agora é sempre um watch?v= do YouTube, sempre 1
#     vídeo por job, então esse mecanismo não tem mais função.
#   - Inputs season_number/episode_number/episode_title/file_indices —
#     existiam só para o Coordinator/numeração de episódio.
#   - Download por magnet/.torrent — substituído por yt-dlp.
#
# MANTIDO SEM ALTERAÇÃO (é o que o player/CDN exige): probe de codec,
# stream-copy condicional vídeo/áudio, encode HLS fmp4, encriptação
# ChaCha20, escolha de shard com fallback de quota, push em lotes,
# master.m3u8/nonces.json/cdn_urls.json, token de instalação da App de
# storage, registo no EdgeOne, webhook, cleanup.
#
# contentId = sempre o video_id do YouTube (vem do metadata montado no
# ingest/worker) — estável, nunca ambíguo.
#
# Fluxo do YouTube: watch URL → yt-dlp resolve vídeo+áudio (o próprio
# yt-dlp já chama ffmpeg quando os streams vêm separados) → se a fonte
# já estiver em HLS/codec compatível, sem re-encode — só o probe abaixo
# decide isso, igual já decidia pra fontes h264 de torrent.
#
# ═══════════════════════════════════════════════════════════════════════
# RONDA "TIPOS + PLAYLIST" — MISSÃO 1 E 2, resumo:
#
# MISSÃO 1 — tipos do process-leve passam a ser aceites aqui também
# (metadata.type): 'movie', 'documentary', 'dorama' (rótulo "Animações"),
# 'series', 'anime' — somam-se aos já existentes 'rain'/'relaxation'/
# 'ai'/'other'. O registo no EdgeOne já gravava `type` genericamente
# (metadata.get('type','video')) — nada mudou aí. O que muda é só COMO
# cada tipo é despachado (missão 2), e o suporte disso em ingest/worker/
# dispatcher-novo.js pra esses tipos chegarem até aqui.
#
# MISSÃO 2 — regra de despacho por tipo, decidida DENTRO deste próprio
# job (sem Coordinator novo, sem job separado):
#   - movie / documentary / dorama / rain / relaxation / ai / other →
#     tipo "video": 1 link = 1 vídeo = 1 job. Pipeline de sempre,
#     LITERALMENTE INALTERADO (todos os steps antigos só ganharam
#     `if: env.IS_PLAYLIST != 'true'`, que resolve pra 'true' == false
#     pra estes tipos, ou seja, corre exactamente como antes).
#   - anime / series → mesma URL de playlist, tratados de forma
#     IDÊNTICA quanto a batching (ver ronda "batch unificado" mais
#     abaixo): sonda antes (--flat-playlist --print) e decide quantos
#     vídeos cabem NESTE job (cálculo/tecto do Coordinator do
#     process-leve.yml: filesize*0.55*1.17) — o resto fica em fila no
#     PRÓPRIO mecanismo do lote F (POST /upload-event no worker do lote,
#     já existente — entra na FILA pendente, nunca abre uma janela por
#     si só), respeitando as janelas normais de disparo (cron 08h ou
#     botão manual). A playlist só é dada por concluída quando o último
#     batch enfileirado tiver corrido. A única diferença remanescente
#     entre os dois tipos é cosmética (rótulo/numeração), não o
#     mecanismo de split.
#
# Novo input do workflow_dispatch: `playlist_items` (yt-dlp
# --playlist-items) — vazio = decidir agora (série) ou playlist inteira
# (anime); preenchido = job já sabe o range dele (veio de um batch
# enfileirado). Mais `skip_first_item` ("true"/"false", default
# "false") — quando activo, o 1º vídeo sondado na playlist é removido da
# lista ANTES de decidir anime/série, nunca é baixado/processado; o
# resto (numeração, batches) sai já sem ele. Só é aplicado na sondagem
# inicial — batches já enfileirados herdam a lista já filtrada, nunca
# reaplicam o skip. 9 inputs no total — dentro do limite rígido de 10 do
# GitHub (confirmado por pesquisa, ver histórico do process-leve.yml).
#
# Numeração de episódio: usa o `playlist_index` real do próprio yt-dlp
# (posição verdadeira na playlist) — nunca precisou de campo de offset
# novo, porque `--playlist-items N-M` preserva o índice real dos itens
# seleccionados, mesmo quando só uma fatia é baixada num job.
#
# ÚNICA COISA NÃO 100% "sem env novo": pra este job conseguir enfileirar
# os batches restantes de uma série no lote F, precisa de saber o URL do
# Worker (Cloudflare) e a MESMA chave que o ingest-novo.js já usa (hoje
# hardcoded lá como WORKER_BASE/WORKER_KEY) — não é uma credencial nova,
# é a MESMA que já existe, só que agora também precisa de chegar até
# aqui como secret do repo (LOTE_F_WORKER_BASE / LOTE_F_WORKER_KEY).
# Sinalizado explicitamente ao user — não inventado, só replicado.
# ═══════════════════════════════════════════════════════════════════════
#
# ═══════════════════════════════════════════════════════════════════════
# RONDA "THUMBNAILS SEM FRAME" (esta edição) — resumo:
#
# Extração de frame via ffmpeg (fallback antigo, tanto no modo vídeo
# único quanto no modo playlist) foi REMOVIDA por completo — não existe
# mais em lado nenhum deste ficheiro, nem como último recurso.
#
# Nova cadeia de fallback pra thumbnail (vale pra TODOS os tipos —
# movie/documentary/dorama/rain/relaxation/ai/other/anime/series):
#   1. `thumbnail_url` (input do workflow, vindo do ingest) — se vier
#      preenchido, tenta baixar essa imagem, de QUALQUER plataforma
#      (curl genérico, sem restrição de domínio — nunca foi restrito a
#      YT, isso já era assim antes desta ronda).
#   2. Se vazio, OU se o download da URL fornecida falhar/vier
#      inválido: fallback pra thumbnail nativa do YouTube, em cascata
#      de qualidade decrescente — maxresdefault → sddefault →
#      hqdefault → mqdefault → default. As 3 últimas praticamente
#      sempre existem (ao contrário de maxresdefault, que falha pra
#      vídeos antigos/verticais) — isso garante cobertura quase total
#      sem precisar de frame extraído do vídeo.
#   3. Se nem isso funcionar (sem videoId resolvido, ou as 5
#      qualidades falharem): sem thumbnail pra esse item — não há mais
#      fallback de frame pra cobrir esse caso.
#
# Pra caso 2 funcionar precisa do videoId real de cada vídeo:
#   - Modo vídeo único: capturado logo após o download, via uma chamada
#     leve extra de yt-dlp (--skip-download --print id), sem custo de
#     rede adicional relevante.
#   - Modo playlist (anime/série): o videoId de cada episódio já vem da
#     sondagem (--flat-playlist --print) que decide batch/playlist — só
#     precisou persistir esse mapeamento índice→id num ficheiro
#     ($WORK_DIR/playlist_ids.json) pra sobreviver até o step de
#     processamento dos episódios. Batches enfileirados (que pulavam a
#     sondagem, branch `explicit_items`) agora fazem uma sondagem leve
#     adicional (só pra mapear id, reaproveitando o mesmo
#     --playlist-items já recebido) — sem isso, os episódios de batches
#     2+ de uma série nunca teriam fallback de thumbnail.
#
# `thumbnail_url`, em modo playlist, é uma ÚNICA imagem pro job inteiro
# (o formulário do ingest só tem um campo, não um por episódio) — se
# fornecida, é baixada UMA vez e reutilizada em todos os episódios desse
# job; se não fornecida, cada episódio cai no fallback individual do YT
# usando o seu próprio videoId.
#
# Nenhum input novo de workflow_dispatch foi necessário (continuam 9,
# dentro do limite de 10) — tudo isto é resolvido internamente com o que
# já existia. dispatcher-novo.js e lote-f-worker.js não precisaram de
# nenhuma alteração: ambos já eram pass-through puro do campo
# thumbnail_url (confirmado por leitura de código), sem qualquer
# validação/restrição de plataforma.
# ═══════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Job ID'
        required: true
      video_url:
        description: 'URL do vídeo no YouTube (ou de playlist, para anime/series)'
        required: true
      seg_duration:
        description: 'Duração segmento HLS (segundos)'
        required: false
        default: '4'
      max_encode_height:
        description: 'Altura máxima encode'
        required: false
        default: '720'
      metadata:
        description: 'JSON: { contentId, title, description, type, year, lang }'
        required: false
        default: '{}'
      thumbnail_url:
        description: 'URL da thumbnail (qualquer plataforma). Se vazio, cai no fallback nativo do YouTube (maxresdefault→...→default). Sem fallback de frame extraído.'
        required: false
        default: ''
      timeout_minutes:
        description: 'Teto do job. Vídeos deste catálogo variam de poucos minutos a 10h+ — o ganho de velocidade do yt-dlp/stream-copy só cobre o encode; download+push de um vídeo longo ainda domina o tempo total independentemente disso. Default cobre a maioria; pra vídeos muito longos, definir manualmente um valor maior ao enfileirar (sem lookup automático de duração — nenhuma API nova foi adicionada só pra isso).'
        required: false
        default: '60'
      playlist_items:
        description: 'yt-dlp --playlist-items (uso interno série/anime). Vazio = decidir agora (série) ou playlist inteira (anime); preenchido = job já é um batch com range definido.'
        required: false
        default: ''
      skip_first_item:
        description: '"true" para ignorar sempre o 1º vídeo da playlist (série/anime) — nunca é baixado/processado, numeração/batches do resto saem sem ele.'
        required: false
        default: 'false'

jobs:
  process:
    runs-on: ubuntu-latest
    # GitHub Actions aceita expressão aqui; fromJson converte a string do
    # input pra número.
    timeout-minutes: ${{ fromJson(inputs.timeout_minutes) }}
    permissions:
      contents: read

    env:
      WORK_DIR:         /tmp/sv_work/${{ inputs.job_id }}
      CHACHA_KEY:       ${{ secrets.CHACHA_KEY }}
      PIPELINE_API:     ${{ secrets.PIPELINE_API }}
      # ADMIN_API_KEY  → auth do endpoint EdgeOne/Turso (registo do conteúdo)
      #                  — MESMO secret que o process-leve.yml já usa, nada
      #                  a ver com o dispatcher, não precisa de sufixo _YT.
      # ADMIN_API_KEY_YT → auth do dispatcher-dlp.js (webhook /dlp/webhook)
      #                  — isolado do ADMIN_API_KEY antigo do dispatcher.js
      #                  de propósito, pra testar os dois em paralelo sem
      #                  misturar credenciais.
      ADMIN_API_KEY:    ${{ secrets.ADMIN_API_KEY }}
      ADMIN_API_KEY_YT: ${{ secrets.ADMIN_API_KEY_YT }}
      DISPATCHER_URL:   ${{ secrets.DISPATCHER_URL }}

    steps:
      - name: Preparar ambiente
        run: |
          echo "JOB_ID=${{ inputs.job_id }}"             >> $GITHUB_ENV
          echo "SEG_DURATION=${{ inputs.seg_duration }}" >> $GITHUB_ENV
          echo "MAX_H=${{ inputs.max_encode_height }}"   >> $GITHUB_ENV
          mkdir -p "/tmp/sv_work/${{ inputs.job_id }}/incoming" \
                   "/tmp/sv_work/${{ inputs.job_id }}/hls" \
                   "/tmp/sv_work/${{ inputs.job_id }}/thumbs"

      # ffmpeg continua vindo do apt (mesmo cache de sempre); libtorrent
      # sai da lista — yt-dlp vem só do pip, mais abaixo.
      - name: Instalar ffmpeg (cache)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: ffmpeg
          version: 1.0
          execute_install_scripts: true

      - name: Atualizar cache do linker (ldconfig)
        run: sudo ldconfig

      - name: Instalar dependências Python (pip) + Deno (runtime JS do yt-dlp)
        run: |
          pip install --quiet --upgrade cryptography yt-dlp pynacl
          ffmpeg -version | head -1
          yt-dlp --version
          # yt-dlp recente precisa de um runtime JS (Deno) pra gerar os
          # tokens de assinatura do YouTube — sem isto, alguns formatos
          # ficam indisponíveis e o aviso "No supported JavaScript
          # runtime" aparece (visto em teste real). curl é mais rápido
          # e não depende de repositório apt de terceiros.
          curl -fsSL https://deno.land/install.sh | sh -s -- -y
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          "$HOME/.deno/bin/deno" --version

      # ═══════════════════════════════════════════════════════════════════
      # MISSÃO 2 — decide se este job é "vídeo único" (movie/documentary/
      # dorama/rain/relaxation/ai/other) ou "playlist" (anime/series), e,
      # se for série, decide também QUANTOS itens cabem neste job e
      # enfileira o resto no lote F. Roda ANTES do download — tudo que
      # vem depois só lê IS_PLAYLIST/PLAYLIST_ITEMS_EFFECTIVE, escritos
      # aqui. Também persiste $WORK_DIR/playlist_ids.json (índice→videoId)
      # pra alimentar o fallback de thumbnail por episódio mais adiante.
      # ═══════════════════════════════════════════════════════════════════
      - name: Detectar playlist e decidir batch (série/anime)
        env:
          VIDEO_URL:            ${{ inputs.video_url }}
          INPUT_METADATA:       ${{ inputs.metadata }}
          INPUT_PLAYLIST_ITEMS: ${{ inputs.playlist_items }}
          INPUT_SKIP_FIRST:     ${{ inputs.skip_first_item }}
          INPUT_THUMBNAIL_URL:  ${{ inputs.thumbnail_url }}
          YTDLP_COOKIES:        ${{ secrets.YTDLP_COOKIES }}
          # MESMA credencial que o ingest-novo.js já usa (hardcoded lá
          # como WORKER_BASE/WORKER_KEY) pra falar com o worker do lote F
          # — replicada aqui como secret do repo, não inventada. Ver nota
          # no cabeçalho do ficheiro.
          LOTE_F_WORKER_BASE:   ${{ secrets.LOTE_F_WORKER_BASE }}
          LOTE_F_WORKER_KEY:    ${{ secrets.LOTE_F_WORKER_KEY }}
        run: |
          if [ -n "$YTDLP_COOKIES" ]; then
            echo "$YTDLP_COOKIES" > /tmp/cookies.txt
          fi

          python3 << 'PYEOF'
          import os, json, subprocess, urllib.request

          try:    metadata = json.loads(os.environ.get('INPUT_METADATA', '') or '{}')
          except: metadata = {}
          content_type   = (metadata.get('type') or 'video').strip().lower()
          job_id         = os.environ['JOB_ID']
          work_dir       = os.environ['WORK_DIR']
          video_url      = os.environ['VIDEO_URL']
          explicit_items = os.environ.get('INPUT_PLAYLIST_ITEMS', '').strip()

          def write_env(d):
            with open(os.environ['GITHUB_ENV'], 'a') as f:
              for k, v in d.items():
                f.write(f"{k}={v}\n")

          def write_id_map(mapping):
            # índice_playlist(str) -> videoId — consumido pelo fallback de
            # thumbnail por episódio no step de processamento da playlist.
            with open(os.path.join(work_dir, 'playlist_ids.json'), 'w') as f:
              json.dump(mapping, f)

          # cookie_args precisa estar disponível tanto no caminho de
          # "batch já definido" (early return abaixo) quanto no caminho
          # de sondagem completa — por isso definido aqui em cima, antes
          # de qualquer branch.
          cookie_args = []
          if os.path.exists('/tmp/cookies.txt'):
            cookie_args = ['--cookies', '/tmp/cookies.txt']

          # Qualquer tipo que não seja anime/series segue a regra "video":
          # 1 link = 1 vídeo = 1 job — pipeline de sempre, sem tocar em
          # nada. Cobre movie/documentary/dorama e os tipos antigos
          # (rain/relaxation/ai/other).
          if content_type not in ('anime', 'series'):
            write_env({'IS_PLAYLIST': 'false', 'PLAYLIST_ITEMS_EFFECTIVE': ''})
            print(f"→ type={content_type}: fluxo de vídeo único (sem playlist) — pipeline inalterado")
            raise SystemExit(0)

          write_env({'IS_PLAYLIST': 'true'})

          # Job já chegou com o range dele definido — é um batch de série
          # já enfileirado (ou uma continuação); não sonda de novo pra
          # decidir o batch. Mesmo assim faz uma sondagem LEVE (mesmo
          # range, --flat-playlist, sem custo de download) só pra montar
          # o mapa índice→videoId — sem isso, os episódios de batches 2+
          # nunca teriam fallback de thumbnail do YouTube.
          if explicit_items:
            write_env({'PLAYLIST_ITEMS_EFFECTIVE': explicit_items})
            print(f"→ type={content_type}: playlist_items já definido ({explicit_items}) — sem nova sondagem de batch")
            id_cmd = ['yt-dlp', '--flat-playlist', '--remote-components', 'ejs:github',
                       *cookie_args, '--playlist-items', explicit_items,
                       '--print', '%(playlist_index)s\t%(id)s', video_url]
            try:
              r_id = subprocess.run(id_cmd, capture_output=True, text=True, timeout=120)
              id_map = {}
              for line in r_id.stdout.splitlines():
                parts = line.split('\t')
                if len(parts) == 2 and parts[0].strip().isdigit():
                  id_map[parts[0].strip()] = parts[1].strip()
              write_id_map(id_map)
              print(f"✓ {len(id_map)} videoId(s) mapeado(s) pra fallback de thumbnail deste batch")
            except Exception as ex:
              print(f"⚠ Sondagem leve de videoIds falhou ({ex}) — episódios deste batch ficarão sem fallback de thumbnail do YouTube")
              write_id_map({})
            raise SystemExit(0)

          # Sondagem — MESMO comando indicado pelo user: --print
          # resolução/tamanho aproximado. --flat-playlist não baixa nada,
          # só lista metadados (rápido).
          cmd = ['yt-dlp', '--flat-playlist', '--remote-components', 'ejs:github',
                 *cookie_args,
                 '--print', '%(playlist_index)s\t%(id)s\t%(filesize_approx)s',
                 '-f', f"bestvideo[height<={os.environ['MAX_H']}]",
                 video_url]
          r = subprocess.run(cmd, capture_output=True, text=True, timeout=180)
          if r.returncode != 0:
            print(f"⚠ Sondagem da playlist falhou (rc={r.returncode}): {r.stderr.strip()[:400]}")
          items = []
          for line in r.stdout.splitlines():
            parts = line.split('\t')
            if len(parts) < 2 or not parts[0].strip().isdigit():
              continue
            size = 0
            if len(parts) > 2:
              try: size = int(float(parts[2]))
              except (ValueError, TypeError): size = 0
            items.append({'index': parts[0].strip(), 'id': parts[1].strip(), 'size': size})

          items.sort(key=lambda it: int(it['index']))

          if not items:
            print("⚠ Sondagem não devolveu itens — a tratar como vídeo único (fallback, mesma URL)")
            write_env({'IS_PLAYLIST': 'false', 'PLAYLIST_ITEMS_EFFECTIVE': ''})
            raise SystemExit(0)

          print(f"✓ Playlist sondada: {len(items)} item(ns), ordem: {[it['index'] for it in items]}")

          # skip_first_item: ignora sempre o 1º vídeo da playlist — nunca
          # é baixado/processado. Aplica-se só na sondagem inicial (uma
          # vez), porque os batches de série já enfileirados (branch
          # `explicit_items` acima) herdam a lista já sem ele.
          skip_first = os.environ.get('INPUT_SKIP_FIRST', 'false').strip().lower() == 'true'
          if skip_first and items:
            removed = items.pop(0)
            print(f"→ skip_first_item ativo: ignorando item {removed['index']} (id={removed['id']}) — nunca será baixado/processado")

          if not items:
            print("⚠ Nada sobrou da playlist depois do skip_first_item — nenhum vídeo a processar")
            write_env({'IS_PLAYLIST': 'false', 'PLAYLIST_ITEMS_EFFECTIVE': ''})
            raise SystemExit(0)

          # anime/series — RONDA "BATCH UNIFICADO + LIMITE REALISTA":
          # antes, anime baixava a playlist inteira num job só, sem
          # checagem de tamanho nenhuma — risco real de estourar o disco
          # do runner numa playlist grande (o download de TODOS os itens
          # acontece de uma vez, antes de qualquer processamento/limpeza).
          # Agora os dois tipos passam pelo MESMO cálculo/split — a única
          # diferença remanescente é cosmética (rótulo/numeração).
          #
          # est(size) = size*0.55*1.17 — mesma fórmula herdada do
          # [Coordinator] do process-leve.yml, mantida tal e qual.
          #
          # BATCH_LIMIT — recalibrado. O valor antigo (1400MB estimado,
          # ~2.1GB de download bruto) presumia um disco bem menor do que
          # o real. O runner ubuntu-latest documenta 14GB só pra um disco
          # temporário separado (/mnt) — o filesystem onde $WORK_DIR
          # (/tmp/...) realmente vive é a partição raiz, que na prática
          # tem ~25-29GB livres antes do job começar (confirmado por
          # múltiplas fontes independentes sobre a infra real do runner,
          # não pela doc oficial de specs). Descontando o que os steps de
          # setup instalam (ffmpeg via apt, yt-dlp/deps via pip, Deno —
          # ordem de poucas centenas de MB) e uma margem de segurança
          # generosa pra cobrir: (a) o pico durante o push, quando o
          # conteúdo já codificado/encriptado em $WORK_DIR é COPIADO de
          # novo pra /tmp/shard antes do git add/commit (praticamente
          # dobra o footprint do que sobrou depois do raw ser apagado),
          # e (b) variação entre instâncias de runner — 6000MB estimado
          # (~9.1GB de download bruto por batch) fica com folga
          # confortável sob esse teto real, mesmo somando os dois picos.
          def est(size):
            return int(size * 0.55 * 1.17)
          BATCH_LIMIT = 6_000 * 1024 * 1024

          batches, cur, cur_size = [], [], 0
          for it in items:
            e = est(it['size'])
            if cur and cur_size + e > BATCH_LIMIT:
              batches.append(cur)
              cur, cur_size = [it], e
            else:
              cur.append(it)
              cur_size += e
          if cur:
            batches.append(cur)

          print(f"→ {content_type}: {len(batches)} batch(es) — batch 1 processa neste job, resto vai pra fila do lote F")
          for i, b in enumerate(batches):
            idxs = ','.join(v['index'] for v in b)
            print(f"   batch {i+1}: itens {idxs} (~{sum(v['size'] for v in b)//(1024*1024)}MB raw)")

          first = batches[0]
          write_env({'PLAYLIST_ITEMS_EFFECTIVE': ','.join(v['index'] for v in first)})
          write_id_map({it['index']: it['id'] for it in first})

          worker_base = os.environ.get('LOTE_F_WORKER_BASE', '').rstrip('/')
          worker_key  = os.environ.get('LOTE_F_WORKER_KEY', '')

          if len(batches) > 1:
            if not worker_base:
              print("✗ LOTE_F_WORKER_BASE/LOTE_F_WORKER_KEY não configurados neste repo — "
                    "impossível enfileirar os batches restantes. Configure os secrets com o "
                    "MESMO valor já usado em WORKER_BASE/WORKER_KEY do ingest-novo.js. Só o "
                    f"batch 1 será processado; o(a) {content_type} NÃO ficará completo(a) sem isso.")
            for i, b in enumerate(batches[1:], start=2):
              if not worker_base:
                break
              idxs = ','.join(v['index'] for v in b)
              child_job_id = f"{job_id}-b{i}"
              # POST /upload-event só ADICIONA à fila pendente do lote F
              # (array `pending` no KV do worker) — nunca abre uma leva/
              # janela por si só. Quem decide disparar é o cron das 08h
              # ou o botão manual /admin/open-now (ver lote-f-worker.js).
              # Fila (pendente) e janela (disparo) são coisas diferentes
              # de propósito — este POST nunca confunde as duas.
              body = {
                'job_id': child_job_id,
                'video_url': video_url,
                'metadata': metadata,
                'playlist_items': idxs,
                'thumbnail_url': os.environ.get('INPUT_THUMBNAIL_URL', ''),
                'seg_duration': os.environ.get('SEG_DURATION', '4'),
                'max_encode_height': os.environ.get('MAX_H', '720'),
              }
              req = urllib.request.Request(
                f"{worker_base}/upload-event", data=json.dumps(body).encode(),
                headers={'Content-Type': 'application/json', 'x-api-key': worker_key},
                method='POST')
              try:
                with urllib.request.urlopen(req, timeout=15) as resp:
                  print(f"   ✓ batch {i} enfileirado (fila pendente) no lote F: {child_job_id} (HTTP {resp.status})")
              except Exception as ex:
                print(f"   ✗ falha ao enfileirar batch {i} ({child_job_id}): {ex} — "
                      f"este batch NÃO entrará na fila, o(a) {content_type} ficará incompleto(a) pra ele")
          else:
            print(f"→ {content_type}: playlist inteira cabe num único batch — sem enfileiramento adicional")
          PYEOF

      # ═══════════════════════════════════════════════════════════════════
      # DOWNLOAD (vídeo único) — yt-dlp, único modo suportado pra
      # movie/documentary/dorama/rain/relaxation/ai/other. Seletor
      # adaptativo (nunca itag fixo). INALTERADO — só ganhou o `if`.
      # ═══════════════════════════════════════════════════════════════════

      - name: Descarregar vídeo (yt-dlp)
        if: env.IS_PLAYLIST != 'true'
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          # Opcional: cookies de sessão em formato Netscape, se o canal
          # tiver conteúdo idade-restrita ou o runner começar a levar 429.
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
        run: |
          COOKIE_ARGS=()
          if [ -n "$YTDLP_COOKIES" ]; then
            echo "$YTDLP_COOKIES" > /tmp/cookies.txt
            COOKIE_ARGS=(--cookies /tmp/cookies.txt)
          fi

          # -S (sort) usa o MESMO $MAX_H que já vem do input
          # max_encode_height (o "Altura máxima" do formulário) — antes
          # estava fixo em 1080 aqui, dessincronizado do que o operador
          # escolhe no ingest. Agora o download já vem na resolução
          # pedida, então o probe mais abaixo ativa stream-copy direto
          # (sem re-encode) sempre que a fonte já for h264+aac nessa
          # altura — não só "por sorte" quando a fonte calhava de já ser
          # 720/1080p.
          yt-dlp \
            "${COOKIE_ARGS[@]}" \
            --remote-components ejs:github \
            -S "res:${MAX_H},vcodec:h264,acodec:aac,ext:mp4:m4a" \
            -f "bestvideo[height<=${MAX_H}]+bestaudio/best[height<=${MAX_H}]" \
            --merge-output-format mp4 \
            --retries 5 \
            --fragment-retries 5 \
            --sleep-requests 1 \
            --no-playlist \
            -o "$WORK_DIR/incoming/input.%(ext)s" \
            "$VIDEO_URL"

          VIDEO_PATH=$(find "$WORK_DIR/incoming/" -type f | head -1)
          if [ -z "$VIDEO_PATH" ]; then
            echo "ERRO: yt-dlp não produziu nenhum ficheiro"
            exit 1
          fi
          SIZE=$(stat -c%s "$VIDEO_PATH")
          echo "VIDEO_PATH=$VIDEO_PATH" >> $GITHUB_ENV
          echo "✓ Vídeo: $VIDEO_PATH ($(du -sh "$VIDEO_PATH" | cut -f1), $SIZE bytes)"
          if [ "$SIZE" -lt 10000 ]; then
            echo "⚠ Ficheiro demasiado pequeno — download provavelmente falhou"
            exit 1
          fi

          # videoId real resolvido pelo yt-dlp — necessário pro fallback
          # de thumbnail nativa do YouTube (i.ytimg.com/vi/<id>/...) mais
          # adiante, já que a URL de entrada pode ser youtu.be/embed/
          # shorts e não necessariamente ?v=<id>. Chamada leve, sem
          # download (--skip-download), reaproveita as mesmas cookies.
          VIDEO_ID=$(yt-dlp "${COOKIE_ARGS[@]}" --remote-components ejs:github \
            --skip-download --no-warnings -q --playlist-items 1 \
            --print id "$VIDEO_URL" 2>/dev/null | head -1)
          echo "VIDEO_ID=$VIDEO_ID" >> $GITHUB_ENV
          if [ -n "$VIDEO_ID" ]; then
            echo "✓ videoId resolvido: $VIDEO_ID"
          else
            echo "⚠ Não foi possível resolver videoId — fallback de thumbnail do YouTube ficará indisponível pra este vídeo (só a thumbnail_url fornecida, se houver, poderá funcionar)"
          fi

      - name: Renovar cookie do yt-dlp (self-refresh)
        # yt-dlp regrava /tmp/cookies.txt no fim, com os tokens de sessão
        # rotativos renovados (__Secure-3PSIDTS e afins). Sem isto, esses
        # tokens expiram em dias/semanas e o secret YTDLP_COOKIES precisa
        # de ser refeito à mão sempre que isso acontece. Não elimina a
        # necessidade de login manual por completo — só torna raro (o
        # Google ainda pode forçar reautenticação por deteção de anomalia
        # ou inatividade prolongada), mas resolve o caso comum.
        if: env.YTDLP_COOKIES != ''
        continue-on-error: true
        env:
          SECRETS_UPDATE_PAT: ${{ secrets.SECRETS_UPDATE_PAT }}
        run: |
          if [ ! -f /tmp/cookies.txt ]; then
            echo "sem /tmp/cookies.txt — nada a renovar"
            exit 0
          fi
          if [ -z "$SECRETS_UPDATE_PAT" ]; then
            echo "⚠ SECRETS_UPDATE_PAT não configurado — a saltar renovação (o job continua normalmente)"
            exit 0
          fi
          python3 << 'PYEOF'
          import os, json, base64, urllib.request, urllib.error
          from nacl import encoding, public

          repo  = os.environ['GITHUB_REPOSITORY']
          token = os.environ['SECRETS_UPDATE_PAT']

          with open('/tmp/cookies.txt') as f:
            cookie_content = f.read()

          def api(method, path, data=None):
            req = urllib.request.Request(
              f'https://api.github.com{path}', method=method,
              headers={'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json',
                       'X-GitHub-Api-Version': '2022-11-28'},
              data=json.dumps(data).encode() if data is not None else None)
            with urllib.request.urlopen(req, timeout=20) as r:
              body = r.read()
              return json.loads(body) if body else {}

          try:
            pk = api('GET', f'/repos/{repo}/actions/secrets/public-key')
            public_key = public.PublicKey(pk['key'].encode('utf-8'), encoding.Base64Encoder())
            sealed = public.SealedBox(public_key).encrypt(cookie_content.encode('utf-8'))
            encrypted_value = base64.b64encode(sealed).decode('utf-8')

            api('PUT', f'/repos/{repo}/actions/secrets/YTDLP_COOKIES', {
              'encrypted_value': encrypted_value,
              'key_id': pk['key_id'],
            })
            print("✓ YTDLP_COOKIES actualizado com os cookies renovados por este job")
          except urllib.error.HTTPError as e:
            print(f"⚠ Falha ao renovar YTDLP_COOKIES (não fatal): HTTP {e.code} {e.read().decode()[:300]}")
          PYEOF

      - name: Probe do vídeo
        if: env.IS_PLAYLIST != 'true'
        run: |
          ffprobe -v quiet -print_format json -show_streams -show_format "$VIDEO_PATH" > "$WORK_DIR/probe.json"
          python3 << 'PYEOF'
          import json, os
          d     = json.load(open(os.environ['WORK_DIR'] + '/probe.json'))
          vs    = next((s for s in d['streams'] if s['codec_type'] == 'video'), {})
          as_   = next((s for s in d['streams'] if s['codec_type'] == 'audio'), {})
          fmt   = d['format']
          num, den = map(int, vs.get('r_frame_rate','24/1').split('/'))
          fps        = num / den if den else num
          src_codec  = vs.get('codec_name', 'unknown')
          audio_codec = as_.get('codec_name', 'unknown')
          probe = {
            'duration': float(fmt.get('duration', 0)),
            'width':    vs.get('width',  1920),
            'height':   vs.get('height', 1080),
            'codec':    src_codec,
            'audio_codec': audio_codec,
            'fps':      fps,
            'bitrate':  int(fmt.get('bit_rate', 0)),
          }
          json.dump(probe, open(os.environ['WORK_DIR'] + '/probe_parsed.json','w'))
          max_h = int(os.environ['MAX_H'])
          # Idêntico ao process-leve.yml: stream copy de vídeo se já for
          # h264 (sem reescala possível em copy); áudio é decisão
          # SEPARADA — só copia se já for AAC, senão sempre re-encoda.
          stream_copy = (src_codec == 'h264')
          if stream_copy:
            eff_h, eff_w, will_scale = probe['height'], probe['width'], False
          else:
            eff_h      = min(probe['height'], max_h)
            will_scale = probe['height'] > max_h
            eff_w      = round((probe['width'] / probe['height']) * eff_h / 2) * 2 if will_scale else probe['width']
          audio_copy = (audio_codec == 'aac')
          h     = eff_h
          label = ('4k' if h>=2160 else '1440p' if h>=1440 else '1080p' if h>=1080 else '720p' if h>=720 else f'{h}p')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
            f.write(f"PROBE_DURATION={probe['duration']}\n")
            f.write(f"PROBE_WIDTH={probe['width']}\n")
            f.write(f"PROBE_HEIGHT={probe['height']}\n")
            f.write(f"PROBE_CODEC={probe['codec']}\n")
            f.write(f"PROBE_AUDIO_CODEC={audio_codec}\n")
            f.write(f"PROBE_FPS={fps}\n")
            f.write(f"PROBE_BITRATE={probe['bitrate']}\n")
            f.write(f"EFF_HEIGHT={eff_h}\n")
            f.write(f"EFF_WIDTH={eff_w}\n")
            f.write(f"WILL_SCALE={'true' if will_scale else 'false'}\n")
            f.write(f"QUALITY_LABEL={label}\n")
            f.write(f"AUDIO_COPY={'true' if audio_copy else 'false'}\n")
            f.write(f"STREAM_COPY={'true' if stream_copy else 'false'}\n")
          print(f"✓ {probe['width']}x{probe['height']} | codec: {src_codec} | audio: {audio_codec} | {fps:.2f}fps | {probe['duration']:.1f}s")
          print(f"  → encode {eff_w}x{eff_h} ({label}) | rescale: {will_scale} | stream_copy(v): {stream_copy} | stream_copy(a): {audio_copy}")
          PYEOF

      - name: HLS encode (stream copy se h264 nativo, senão libx264 ultrafast CRF26)
        if: env.IS_PLAYLIST != 'true'
        run: |
          HLS_DIR="$WORK_DIR/hls"
          GOP=$(python3 -c "import math; print(int(math.ceil(${PROBE_FPS} * ${SEG_DURATION})))")

          if [ "$STREAM_COPY" = "true" ]; then
            echo "  → Vídeo: STREAM_COPY (fonte já é h264, sem reescala)"
            VCODEC_ARGS="-c:v copy"
          else
            echo "  → Vídeo: re-encode necessário (codec=${PROBE_CODEC} ou reescala=${WILL_SCALE})"
            if [ "$WILL_SCALE" = "true" ]; then SCALE_ARGS="-vf scale=-2:${EFF_HEIGHT}"; else SCALE_ARGS=""; fi
            VCODEC_ARGS="$SCALE_ARGS -c:v libx264 -preset ultrafast -crf 26 -tune fastdecode -profile:v high -level 4.0 -pix_fmt yuv420p -g $GOP -keyint_min ${SEG_DURATION}"
          fi

          if [ "$AUDIO_COPY" = "true" ]; then
            echo "  → Áudio: STREAM_COPY (fonte já é AAC)"
            ACODEC_ARGS="-c:a copy"
          else
            echo "  → Áudio: re-encode pra AAC necessário (codec fonte=${PROBE_AUDIO_CODEC})"
            ACODEC_ARGS="-c:a aac -b:a 128k -ac 2"
          fi

          run_encode() {
            ffmpeg -hide_banner -loglevel warning -stats \
              -i "$VIDEO_PATH" \
              $VCODEC_ARGS \
              $ACODEC_ARGS \
              -f hls \
              -hls_time ${SEG_DURATION} \
              -hls_playlist_type vod \
              -hls_segment_type fmp4 \
              -hls_fmp4_init_filename "init.mp4" \
              -hls_flags independent_segments \
              -hls_segment_filename "$HLS_DIR/seg%05d.m4s" \
              -y "$HLS_DIR/index.m3u8"
          }

          if ! run_encode; then
            if [ "$STREAM_COPY" = "true" ] || [ "$AUDIO_COPY" = "true" ]; then
              echo "  ⚠ Encode com stream copy falhou — fallback pra re-encode completo (vídeo + áudio)"
              rm -f "$HLS_DIR"/*.m4s "$HLS_DIR/init.mp4" "$HLS_DIR/index.m3u8" 2>/dev/null || true
              if [ "$WILL_SCALE" = "true" ]; then SCALE_ARGS="-vf scale=-2:${EFF_HEIGHT}"; else SCALE_ARGS=""; fi
              VCODEC_ARGS="$SCALE_ARGS -c:v libx264 -preset ultrafast -crf 26 -tune fastdecode -profile:v high -level 4.0 -pix_fmt yuv420p -g $GOP -keyint_min ${SEG_DURATION}"
              ACODEC_ARGS="-c:a aac -b:a 128k -ac 2"
              run_encode
            else
              echo "✗ Encode falhou (modo re-encode, sem fallback disponível)"
              exit 1
            fi
          fi

          echo "✓ $(ls $HLS_DIR/*.m4s | wc -l) segmentos .m4s gerados"
          echo "✓ init.mp4: $(du -sh $HLS_DIR/init.mp4 | cut -f1)"

      # ═══════════════════════════════════════════════════════════════════
      # THUMBNAIL (vídeo único) — RONDA "THUMBNAILS SEM FRAME": sem
      # extração de frame em lado nenhum. Cadeia: thumbnail_url fornecida
      # (qualquer plataforma) → fallback nativo do YouTube em cascata de
      # qualidade (maxresdefault→sddefault→hqdefault→mqdefault→default).
      # Se nada disso resolver, o item fica sem thumbnail.
      # ═══════════════════════════════════════════════════════════════════
      - name: Obter thumbnail
        if: env.IS_PLAYLIST != 'true'
        env:
          INPUT_THUMBNAIL_URL: ${{ inputs.thumbnail_url }}
        run: |
          python3 << 'PYEOF'
          import subprocess, os, json

          thumb_dir = os.environ['WORK_DIR'] + '/thumbs'
          video_id  = os.environ.get('VIDEO_ID', '').strip()
          thumb_url = os.environ.get('INPUT_THUMBNAIL_URL', '').strip()
          thumbs    = []

          def detect_image_ext(path):
            with open(path, 'rb') as f: h = f.read(16)
            if h[:3] == b'\xff\xd8\xff': return 'jpg'
            if h[:4] == b'\x89PNG':       return 'png'
            if h[:4] == b'RIFF':          return 'webp'
            if h[:6] in (b'GIF87a', b'GIF89a'): return 'gif'
            return 'jpg'

          # min_bytes baixo de propósito: thumbnails legítimas podem vir
          # bem pequenas — ex. URLs do tipo
          # https://encrypted-tbn0.gstatic.com/images?q=tbn:...&s=10 (cache
          # de thumbnail do Google Images) frequentemente devolvem imagens
          # de poucas centenas de bytes. O sinal real de validade é a
          # assinatura binária (magic bytes) abaixo, não o tamanho — o
          # min_bytes serve só pra descartar downloads vazios/truncados.
          def is_valid_image(path, min_bytes=100):
            if not os.path.exists(path) or os.path.getsize(path) < min_bytes: return False
            with open(path, 'rb') as f: h = f.read(12)
            return (h[:3] == b'\xff\xd8\xff' or h[:4] == b'\x89PNG' or h[:4] == b'RIFF' or
                    h[:6] in (b'GIF87a', b'GIF89a'))

          def try_download(url, out_base):
            tmp = out_base + '.tmp'
            subprocess.run(['curl','-sL','--retry','2','--retry-delay','2','--max-time','15',
              '-H','User-Agent: Mozilla/5.0','-o',tmp,url], capture_output=True)
            if is_valid_image(tmp):
              ext = detect_image_ext(tmp)
              final_path = f"{out_base}.{ext}"
              os.replace(tmp, final_path)
              return final_path
            if os.path.exists(tmp): os.remove(tmp)
            return None

          result = None

          # Tier 1 — URL explícita fornecida no ingest. Qualquer
          # plataforma — curl genérico, nunca restrito a domínio do YT.
          if thumb_url:
            print(f"  Tentando thumbnail fornecida: {thumb_url}")
            result = try_download(thumb_url, f"{thumb_dir}/thumb_0")
            if result:
              print(f"✓ Thumbnail fornecida válida ({os.path.getsize(result)//1024} KB)")
            else:
              print("⚠ Thumbnail fornecida falhou/indisponível — caindo pro fallback do YouTube")

          # Tier 2 — fallback nativo do YouTube, em cascata de qualidade
          # decrescente. maxresdefault nem sempre existe (vídeos antigos/
          # verticais); as demais praticamente sempre existem. Sem
          # extração de frame como último recurso (removida de propósito).
          if not result and video_id:
            for quality in ('maxresdefault', 'sddefault', 'hqdefault', 'mqdefault', 'default'):
              url = f"https://i.ytimg.com/vi/{video_id}/{quality}.jpg"
              result = try_download(url, f"{thumb_dir}/thumb_0")
              if result:
                print(f"✓ Fallback YouTube ({quality}) válido ({os.path.getsize(result)//1024} KB)")
                break
            if not result:
              print(f"✗ Nenhuma qualidade de thumbnail do YouTube disponível pra videoId={video_id}")
          elif not result:
            print("✗ Sem videoId resolvido — impossível tentar fallback do YouTube")

          if result:
            ext = result.rsplit('.', 1)[-1]
            thumbs.append({'path': result, 'ext': ext, 'time': 0, 'index': 0})

          json.dump(thumbs, open(os.environ['WORK_DIR'] + '/thumbs_manifest.json', 'w'))
          print(f"✓ {len(thumbs)} thumbnail(s)")
          PYEOF

      - name: Encriptar segmentos → .bin
        if: env.IS_PLAYLIST != 'true'
        run: |
          python3 << 'PYEOF'
          import os, json, secrets, struct
          from cryptography.hazmat.primitives.ciphers import Cipher, algorithms
          key_hex = os.environ['CHACHA_KEY']
          if len(key_hex) != 64: raise ValueError('CHACHA_KEY inválido')
          key     = bytes.fromhex(key_hex)
          hls_dir = os.environ['WORK_DIR'] + '/hls'
          CHUNK_SIZE = 65536

          def encrypt_segment(data, key):
            chunks = [data[i:i+CHUNK_SIZE] for i in range(0, len(data), CHUNK_SIZE)]
            out    = [struct.pack('<I', len(chunks))]
            for chunk in chunks:
              nonce       = secrets.token_bytes(12)
              nonce_field = struct.pack('<I', 1) + nonce
              ct          = Cipher(algorithms.ChaCha20(key, nonce_field), None).encryptor().update(chunk)
              out.append(nonce); out.append(struct.pack('<I', len(ct))); out.append(ct)
            return b''.join(out)

          nonce_map = {}
          init_src  = os.path.join(hls_dir, 'init.mp4')
          if os.path.exists(init_src):
            with open(init_src, 'rb') as f: data = f.read()
            encrypted = encrypt_segment(data, key)
            with open(os.path.join(hls_dir, 'init.bin'), 'wb') as f: f.write(encrypted)
            os.remove(init_src)
            nonce_map['init.bin'] = f"chunked:{struct.unpack('<I', encrypted[:4])[0]}"
            print(f"  init.mp4 → init.bin ({len(data)//1024}KB)")

          seg_files = sorted(f for f in os.listdir(hls_dir) if f.endswith('.m4s'))
          if not seg_files: raise RuntimeError('Nenhum .m4s encontrado')

          for fname in seg_files:
            with open(os.path.join(hls_dir, fname), 'rb') as f: data = f.read()
            encrypted = encrypt_segment(data, key)
            bin_name = fname.replace('.m4s', '.bin')
            with open(os.path.join(hls_dir, bin_name), 'wb') as f: f.write(encrypted)
            os.remove(os.path.join(hls_dir, fname))
            nonce_map[bin_name] = f"chunked:{struct.unpack('<I', encrypted[:4])[0]}"

          out = {'key_id': os.environ['CHACHA_KEY'][:8], 'format': 'chunk-v2', 'nonces': nonce_map}
          json.dump(out, open(os.environ['WORK_DIR'] + '/nonces.json','w'))
          print(f"✓ {len(seg_files)} segmentos encriptados")
          PYEOF

      # ═══════════════════════════════════════════════════════════════════
      # PLAYLIST (série/anime) — baixa+processa N episódios NESTE job,
      # reaproveitando as MESMAS regras de probe/encode/encriptação já
      # usadas acima pro vídeo único, só que em loop, uma subpasta por
      # episódio ($WORK_DIR/items/<playlist_index>/...). Thumbnail segue
      # a mesma cadeia (URL fornecida → fallback YT em cascata) — RONDA
      # "THUMBNAILS SEM FRAME": sem extração de frame, thumbnail_url é
      # ÚNICA pro job inteiro (baixada 1 vez, reutilizada em todos os
      # episódios) quando fornecida; senão, cada episódio usa o seu
      # próprio videoId (vindo de $WORK_DIR/playlist_ids.json) pro
      # fallback individual do YouTube.
      # ═══════════════════════════════════════════════════════════════════
      - name: 'Playlist: baixar e processar episódios'
        if: env.IS_PLAYLIST == 'true'
        env:
          VIDEO_URL:           ${{ inputs.video_url }}
          INPUT_THUMBNAIL_URL: ${{ inputs.thumbnail_url }}
          YTDLP_COOKIES:       ${{ secrets.YTDLP_COOKIES }}
        run: |
          COOKIE_ARGS=()
          if [ -n "$YTDLP_COOKIES" ]; then
            echo "$YTDLP_COOKIES" > /tmp/cookies.txt
            COOKIE_ARGS=(--cookies /tmp/cookies.txt)
          fi

          python3 << 'PYEOF'
          import os, json, subprocess, math, secrets as pysecrets, struct
          from cryptography.hazmat.primitives.ciphers import Cipher, algorithms

          work_dir     = os.environ['WORK_DIR']
          video_url    = os.environ['VIDEO_URL']
          max_h        = int(os.environ['MAX_H'])
          seg_duration = int(os.environ['SEG_DURATION'])
          items_arg    = os.environ.get('PLAYLIST_ITEMS_EFFECTIVE', '').strip()
          thumb_url    = os.environ.get('INPUT_THUMBNAIL_URL', '').strip()
          chacha_key   = bytes.fromhex(os.environ['CHACHA_KEY'])
          if len(os.environ['CHACHA_KEY']) != 64:
            raise ValueError('CHACHA_KEY inválido')

          cookie_args = []
          if os.path.exists('/tmp/cookies.txt'):
            cookie_args = ['--cookies', '/tmp/cookies.txt']

          items_dir = os.path.join(work_dir, 'items')
          os.makedirs(items_dir, exist_ok=True)

          # ── 1. Descarregar os itens (mesmo seletor/critérios do modo
          # vídeo único, um yt-dlp só por playlist, filtrado por
          # --playlist-items quando aplicável). ────────────────────────
          out_tmpl = os.path.join(items_dir, '%(playlist_index)s', 'input.%(ext)s')

          cmd = ['yt-dlp', *cookie_args, '--remote-components', 'ejs:github',
                 '-S', f"res:{max_h},vcodec:h264,acodec:aac,ext:mp4:m4a",
                 '-f', f"bestvideo[height<={max_h}]+bestaudio/best[height<={max_h}]",
                 '--merge-output-format', 'mp4',
                 '--retries', '5', '--fragment-retries', '5', '--sleep-requests', '1',
                 # --ignore-errors: um item indisponível/privado/idade-
                 # restrita não pode derrubar a playlist inteira — sem
                 # isto o yt-dlp já baixava o resto (visto em log real:
                 # "Finished downloading playlist" aparece mesmo assim),
                 # mas ainda saía com rc=1 no fim, e o código abaixo
                 # tratava QUALQUER rc!=0 como fatal e descartava
                 # episódios que já tinham baixado com sucesso.
                 '--ignore-errors',
                 '--yes-playlist', '-o', out_tmpl]
          if items_arg:
            cmd += ['--playlist-items', items_arg]
          cmd.append(video_url)

          print(f"→ yt-dlp playlist (items={items_arg or 'todos'})")
          r = subprocess.run(cmd)
          if r.returncode != 0:
            # Não fatal aqui de propósito: com --ignore-errors, rc!=0
            # normalmente significa "pelo menos 1 item da playlist
            # falhou", não "nada baixou". O gate real de falha fatal é
            # "nenhum episódio baixado", logo abaixo, depois de
            # verificar o disco de facto.
            print(f"⚠ yt-dlp terminou com rc={r.returncode} — pelo menos um item da playlist "
                  f"provavelmente falhou (indisponível/privado/idade-restrita); a continuar só "
                  f"com os episódios que baixaram de facto")

          episodes = []
          for name in sorted(os.listdir(items_dir), key=lambda x: (len(x), x)):
            ep_dir = os.path.join(items_dir, name)
            if not os.path.isdir(ep_dir) or not name.isdigit():
              continue
            files = [f for f in os.listdir(ep_dir) if f.startswith('input.')]
            if not files:
              print(f"  ⚠ ep{name}: nenhum ficheiro baixado — ignorado")
              continue
            episodes.append({'ep_num': int(name), 'video_path': os.path.join(ep_dir, files[0]), 'dir': ep_dir})

          if not episodes:
            raise SystemExit("ERRO: nenhum episódio baixado pela playlist (falha real, não só item isolado indisponível)")

          episodes.sort(key=lambda e: e['ep_num'])
          print(f"✓ {len(episodes)} episódio(s) baixado(s): {[e['ep_num'] for e in episodes]}")

          # ── 1b. Carregar mapa índice→videoId (persistido no step de
          # sondagem/decisão de batch) — usado pelo fallback individual
          # de thumbnail de cada episódio quando não há thumbnail_url
          # fornecida. ─────────────────────────────────────────────────
          id_map_path = os.path.join(work_dir, 'playlist_ids.json')
          id_map = json.load(open(id_map_path)) if os.path.exists(id_map_path) else {}
          if not id_map:
            print("⚠ playlist_ids.json vazio/ausente — fallback de thumbnail do YouTube por episódio ficará indisponível (só thumbnail_url fornecida, se houver, funcionará)")

          # ── 2. Probe + HLS encode — MESMA lógica dos steps de vídeo
          # único, chamada por função, por episódio. ─────────────────────
          def probe_video(video_path):
            r = subprocess.run(['ffprobe','-v','quiet','-print_format','json',
                                 '-show_streams','-show_format', video_path],
                                capture_output=True, text=True)
            d = json.loads(r.stdout)
            vs = next((s for s in d['streams'] if s['codec_type'] == 'video'), {})
            as_ = next((s for s in d['streams'] if s['codec_type'] == 'audio'), {})
            fmt = d['format']
            num, den = map(int, vs.get('r_frame_rate', '24/1').split('/'))
            fps = num / den if den else num
            return {
              'duration': float(fmt.get('duration', 0)),
              'width': vs.get('width', 1920), 'height': vs.get('height', 1080),
              'codec': vs.get('codec_name', 'unknown'),
              'audio_codec': as_.get('codec_name', 'unknown'),
              'fps': fps, 'bitrate': int(fmt.get('bit_rate', 0)),
            }

          def encode_hls(video_path, hls_dir, probe, seg_duration, max_h):
            os.makedirs(hls_dir, exist_ok=True)
            stream_copy = (probe['codec'] == 'h264')
            if stream_copy:
              eff_h, eff_w, will_scale = probe['height'], probe['width'], False
            else:
              eff_h = min(probe['height'], max_h)
              will_scale = probe['height'] > max_h
              eff_w = round((probe['width'] / probe['height']) * eff_h / 2) * 2 if will_scale else probe['width']
            audio_copy = (probe['audio_codec'] == 'aac')
            gop = int(math.ceil(probe['fps'] * seg_duration))

            def build_args(force_reencode):
              if stream_copy and not force_reencode:
                vargs = ['-c:v', 'copy']
              else:
                vargs = (['-vf', f'scale=-2:{eff_h}'] if will_scale else []) + \
                        ['-c:v', 'libx264', '-preset', 'ultrafast', '-crf', '26',
                         '-tune', 'fastdecode', '-profile:v', 'high', '-level', '4.0',
                         '-pix_fmt', 'yuv420p', '-g', str(gop), '-keyint_min', str(seg_duration)]
              if audio_copy and not force_reencode:
                aargs = ['-c:a', 'copy']
              else:
                aargs = ['-c:a', 'aac', '-b:a', '128k', '-ac', '2']
              return vargs, aargs

            def run_encode(force_reencode):
              vargs, aargs = build_args(force_reencode)
              cmd = ['ffmpeg', '-hide_banner', '-loglevel', 'warning', '-stats',
                     '-i', video_path, *vargs, *aargs,
                     '-f', 'hls', '-hls_time', str(seg_duration),
                     '-hls_playlist_type', 'vod', '-hls_segment_type', 'fmp4',
                     '-hls_fmp4_init_filename', 'init.mp4', '-hls_flags', 'independent_segments',
                     '-hls_segment_filename', os.path.join(hls_dir, 'seg%05d.m4s'),
                     '-y', os.path.join(hls_dir, 'index.m3u8')]
              return subprocess.run(cmd).returncode == 0

            ok = run_encode(force_reencode=False)
            if not ok and (stream_copy or audio_copy):
              for f in os.listdir(hls_dir):
                if f.endswith('.m4s') or f in ('init.mp4', 'index.m3u8'):
                  os.remove(os.path.join(hls_dir, f))
              ok = run_encode(force_reencode=True)
            if not ok:
              raise RuntimeError(f'Encode falhou para {video_path}')

            label = ('4k' if eff_h >= 2160 else '1440p' if eff_h >= 1440 else
                     '1080p' if eff_h >= 1080 else '720p' if eff_h >= 720 else f'{eff_h}p')
            return {'eff_w': eff_w, 'eff_h': eff_h, 'label': label}

          # ── Thumbnail helpers — mesma lógica do modo vídeo único, sem
          # extração de frame. ─────────────────────────────────────────
          def detect_image_ext(path):
            with open(path, 'rb') as f: h = f.read(16)
            if h[:3] == b'\xff\xd8\xff': return 'jpg'
            if h[:4] == b'\x89PNG':       return 'png'
            if h[:4] == b'RIFF':          return 'webp'
            if h[:6] in (b'GIF87a', b'GIF89a'): return 'gif'
            return 'jpg'

          # min_bytes baixo de propósito: thumbnails legítimas podem vir
          # bem pequenas — ex. URLs do tipo
          # https://encrypted-tbn0.gstatic.com/images?q=tbn:...&s=10 (cache
          # de thumbnail do Google Images) frequentemente devolvem imagens
          # de poucas centenas de bytes. O sinal real de validade é a
          # assinatura binária (magic bytes) abaixo, não o tamanho — o
          # min_bytes serve só pra descartar downloads vazios/truncados.
          def is_valid_image(path, min_bytes=100):
            if not os.path.exists(path) or os.path.getsize(path) < min_bytes: return False
            with open(path, 'rb') as f: h = f.read(12)
            return (h[:3] == b'\xff\xd8\xff' or h[:4] == b'\x89PNG' or h[:4] == b'RIFF' or
                    h[:6] in (b'GIF87a', b'GIF89a'))

          def try_download(url, out_base):
            tmp = out_base + '.tmp'
            subprocess.run(['curl','-sL','--retry','2','--retry-delay','2','--max-time','15',
              '-H','User-Agent: Mozilla/5.0','-o',tmp,url], capture_output=True)
            if is_valid_image(tmp):
              ext = detect_image_ext(tmp)
              final_path = f"{out_base}.{ext}"
              os.replace(tmp, final_path)
              return final_path
            if os.path.exists(tmp): os.remove(tmp)
            return None

          # Tier 1 — thumbnail_url fornecida é ÚNICA pro job inteiro
          # (formulário do ingest não tem um campo por episódio) —
          # baixada 1 vez só, reutilizada em todos os episódios.
          shared_thumb = None
          if thumb_url:
            print(f"→ thumbnail fornecida pra toda a leva de episódios: {thumb_url}")
            shared_thumb = try_download(thumb_url, os.path.join(work_dir, 'shared_thumb'))
            if shared_thumb:
              print(f"✓ Thumbnail compartilhada válida ({os.path.getsize(shared_thumb)//1024} KB) — usada em todos os episódios")
            else:
              print("⚠ Thumbnail fornecida falhou — cada episódio cai pro fallback individual do YouTube")

          def resolve_episode_thumb(ep_num, thumbs_dir):
            # Tier 1 — reusa a thumbnail compartilhada, se existir.
            if shared_thumb:
              ext = shared_thumb.rsplit('.', 1)[-1]
              dest = os.path.join(thumbs_dir, f'thumb_0.{ext}')
              import shutil as _sh
              _sh.copy(shared_thumb, dest)
              return True, ext
            # Tier 2 — fallback nativo do YouTube, cascata de qualidade,
            # usando o videoId individual deste episódio.
            ep_video_id = id_map.get(str(ep_num))
            if ep_video_id:
              for quality in ('maxresdefault', 'sddefault', 'hqdefault', 'mqdefault', 'default'):
                url = f"https://i.ytimg.com/vi/{ep_video_id}/{quality}.jpg"
                result = try_download(url, os.path.join(thumbs_dir, 'thumb_0'))
                if result:
                  return True, result.rsplit('.', 1)[-1]
            return False, None

          def encrypt_dir(hls_dir):
            CHUNK_SIZE = 65536
            def encrypt_segment(data):
              chunks = [data[i:i+CHUNK_SIZE] for i in range(0, len(data), CHUNK_SIZE)]
              out = [struct.pack('<I', len(chunks))]
              for chunk in chunks:
                nonce = pysecrets.token_bytes(12)
                nonce_field = struct.pack('<I', 1) + nonce
                ct = Cipher(algorithms.ChaCha20(chacha_key, nonce_field), None).encryptor().update(chunk)
                out.append(nonce); out.append(struct.pack('<I', len(ct))); out.append(ct)
              return b''.join(out)

            nonce_map = {}
            init_src = os.path.join(hls_dir, 'init.mp4')
            if os.path.exists(init_src):
              with open(init_src, 'rb') as f: data = f.read()
              enc = encrypt_segment(data)
              with open(os.path.join(hls_dir, 'init.bin'), 'wb') as f: f.write(enc)
              os.remove(init_src)
              nonce_map['init.bin'] = f"chunked:{struct.unpack('<I', enc[:4])[0]}"
            for fname in sorted(f for f in os.listdir(hls_dir) if f.endswith('.m4s')):
              with open(os.path.join(hls_dir, fname), 'rb') as f: data = f.read()
              enc = encrypt_segment(data)
              bin_name = fname.replace('.m4s', '.bin')
              with open(os.path.join(hls_dir, bin_name), 'wb') as f: f.write(enc)
              os.remove(os.path.join(hls_dir, fname))
              nonce_map[bin_name] = f"chunked:{struct.unpack('<I', enc[:4])[0]}"
            return nonce_map

          manifest = []
          for ep in episodes:
            print(f"── Episódio {ep['ep_num']} ──")
            probe = probe_video(ep['video_path'])
            hls_dir = os.path.join(ep['dir'], 'hls')
            quality = encode_hls(ep['video_path'], hls_dir, probe, seg_duration, max_h)
            thumbs_dir = os.path.join(ep['dir'], 'thumbs')
            os.makedirs(thumbs_dir, exist_ok=True)
            has_thumb, thumb_ext = resolve_episode_thumb(ep['ep_num'], thumbs_dir)
            if not has_thumb:
              print(f"  ⚠ ep{ep['ep_num']}: sem thumbnail (nem compartilhada, nem fallback do YouTube)")
            nonce_map = encrypt_dir(hls_dir)
            os.remove(ep['video_path'])  # libertar espaço já, como no modo vídeo único
            manifest.append({
              'ep_num': ep['ep_num'], 'dir': ep['dir'], 'hls_dir': hls_dir,
              'thumbs_dir': thumbs_dir, 'has_thumb': has_thumb, 'thumb_ext': thumb_ext,
              'probe': probe, 'quality': quality, 'nonce_map': nonce_map,
            })
            thumb_note = f"thumb .{thumb_ext}" if has_thumb else "sem thumb"
            print(f"  ✓ ep{ep['ep_num']}: {quality['label']} | {len(nonce_map)-1} segmento(s) | {thumb_note}")

          json.dump(manifest, open(os.path.join(work_dir, 'episodes_manifest.json'), 'w'))
          print(f"✓ {len(manifest)} episódio(s) processado(s) e prontos pra envio")
          PYEOF

      - name: Libertar espaço — remover vídeo fonte
        if: always()
        run: |
          rm -rf "$WORK_DIR/incoming"
          rm -rf "$WORK_DIR/items"/*/input.* 2>/dev/null || true
          echo "✓ Vídeo(s) fonte removido(s)"

      # ═══════════════════════════════════════════════════════════════════
      # STORAGE — idêntico ao process-leve.yml (token de instalação da
      # App gerado tarde, shard com fallback de quota, push em lotes).
      # ═══════════════════════════════════════════════════════════════════

      - name: Gerar token de instalação da App (conta de storage)
        env:
          STORAGE_OWNER:           ${{ secrets.STORAGE_OWNER }}
          STORAGE_APP_ID:          ${{ secrets.STORAGE_APP_ID }}
          STORAGE_INSTALLATION_ID: ${{ secrets.STORAGE_INSTALLATION_ID }}
          STORAGE_PRIVATE_KEY:     ${{ secrets.STORAGE_PRIVATE_KEY }}
        run: |
          python3 << 'PYEOF'
          import os, time, json, base64, urllib.request, urllib.error
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding

          target_owner    = os.environ['STORAGE_OWNER']
          app_id          = os.environ['STORAGE_APP_ID']
          installation_id = os.environ['STORAGE_INSTALLATION_ID']
          private_key_pem = os.environ['STORAGE_PRIVATE_KEY']
          if not all([target_owner, app_id, installation_id, private_key_pem]):
            print("ERRO: alguma credencial da App de storage ficou vazia."); raise SystemExit(1)

          def b64url(data): return base64.urlsafe_b64encode(data).rstrip(b'=').decode()
          now    = int(time.time())
          header = {"alg": "RS256", "typ": "JWT"}
          payload = {"iat": now - 60, "exp": now + 9 * 60, "iss": app_id}
          signing_input = f"{b64url(json.dumps(header).encode())}.{b64url(json.dumps(payload).encode())}"
          key = serialization.load_pem_private_key(private_key_pem.encode(), password=None)
          signature = key.sign(signing_input.encode(), padding.PKCS1v15(), hashes.SHA256())
          jwt_token = f"{signing_input}.{b64url(signature)}"

          req = urllib.request.Request(
            f"https://api.github.com/app/installations/{installation_id}/access_tokens",
            method="POST",
            headers={"Authorization": f"Bearer {jwt_token}", "Accept": "application/vnd.github+json",
                     "X-GitHub-Api-Version": "2022-11-28"})
          try:
            with urllib.request.urlopen(req, timeout=20) as r: data = json.loads(r.read())
          except urllib.error.HTTPError as e:
            print(f"ERRO: falha ao gerar installation token: HTTP {e.code} {e.read().decode()[:300]}"); raise SystemExit(1)

          token = data['token']
          print(f"::add-mask::{token}")
          with open(os.environ['GITHUB_ENV'], 'a') as f:
            f.write(f"STORAGE_TARGET_OWNER={target_owner}\n")
            f.write(f"STORAGE_TARGET_TOKEN={token}\n")
          print(f"✓ Token de instalação gerado: {target_owner} (expira {data['expires_at']})")
          PYEOF

      - name: Definir branch exclusiva do job
        run: |
          python3 << 'PYEOF'
          import os, re
          job_id = os.environ['JOB_ID']
          safe = re.sub(r'[^A-Za-z0-9._-]', '-', job_id)
          safe = re.sub(r'\.{2,}', '.', safe).strip('.-') or 'job'
          branch = f"job-{safe}"
          with open(os.environ['GITHUB_ENV'], 'a') as f: f.write(f"JOB_BRANCH={branch}\n")
          print(f"✓ Branch exclusiva do job: {branch}")
          PYEOF

      - name: Escolher shard, gerar URLs e enviar (com fallback automático de shard cheio)
        if: env.IS_PLAYLIST != 'true'
        env:
          STORAGE_TOKEN: ${{ env.STORAGE_TARGET_TOKEN }}
          STORAGE_OWNER: ${{ env.STORAGE_TARGET_OWNER }}
          STORAGE_CREATE_PAT: ${{ secrets.STORAGE_CREATE_PAT }}
        run: |
          git config --global core.deltaBaseCacheLimit 2047m
          git config --global core.looseObjects 0
          git config --global pack.compression 0
          git config --global pack.window 0
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999
          git config --global repack.useDeltaBaseOffset true
          git config --global advice.detachedHead false

          python3 << 'PYEOF'
          import os, subprocess, json, time, random, re, shutil

          THRESHOLD_KB       = 3_500 * 1024
          MAX_SHARDS_TO_SCAN = 20
          MAX_SHARD_ATTEMPTS = 5
          BATCH_SIZE         = 400

          owner      = os.environ['STORAGE_OWNER']
          token      = os.environ['STORAGE_TOKEN']
          work_dir   = os.environ['WORK_DIR']
          job_id     = os.environ['JOB_ID']
          job_branch = os.environ['JOB_BRANCH']
          eff_w      = os.environ['EFF_WIDTH']
          eff_h      = os.environ['EFF_HEIGHT']
          seg_duration = int(os.environ['SEG_DURATION'])

          hls_dir    = work_dir + '/hls'
          orig_index = hls_dir + '/index.m3u8.orig'
          shutil.copy(hls_dir + '/index.m3u8', orig_index)

          def api(method, path, data=None):
            cmd = ['curl','-s','-L','-w','\n%{http_code}','-X',method,
                   '-H',f'Authorization: Bearer {token}','-H','Accept: application/vnd.github+json',
                   f'https://api.github.com{path}']
            if data is not None: cmd += ['-d', json.dumps(data)]
            r = subprocess.run(cmd, capture_output=True, text=True)
            out = r.stdout
            body, _, code = out.rpartition('\n') if '\n' in out else ('', '', out)
            try: return int(code.strip()), body
            except ValueError: return 0, body

          def get_repo_size_kb(repo, max_attempts=4):
            last_code = 0
            for attempt in range(1, max_attempts + 1):
              code, out = api('GET', f'/repos/{owner}/{repo}')
              if code == 200: return True, json.loads(out).get('size', 0)
              if code == 404: return False, 0
              last_code = code
              wait = [3, 8, 15, 25][min(attempt - 1, 3)]
              print(f"  ⚠ GET {repo} → HTTP {code or 'sem resposta'} — tentativa {attempt}/{max_attempts}, aguarda {wait}s...")
              time.sleep(wait)
            print(f"  ✗ GET {repo} falhou após {max_attempts} tentativas (último HTTP {last_code})")
            return None, 0

          def create_repo(repo):
            create_pat = os.environ.get('STORAGE_CREATE_PAT', '')
            if not create_pat:
              print(f"  ✗ STORAGE_CREATE_PAT não configurado — impossível criar {repo}"); return False
            cmd = ['curl','-s','-w','\n%{http_code}','-X','POST',
                   '-H',f'Authorization: Bearer {create_pat}','-H','Accept: application/vnd.github+json',
                   'https://api.github.com/user/repos',
                   '-d', json.dumps({'name': repo, 'private': False, 'auto_init': True})]
            r = subprocess.run(cmd, capture_output=True, text=True)
            out = r.stdout
            body, _, code_str = out.rpartition('\n') if '\n' in out else ('', '', out)
            try: cc = int(code_str.strip())
            except ValueError: cc = 0
            if cc == 201: return True
            if cc == 422: print(f"  ⚠ {repo} já existe — reutilizando"); return True
            print(f"  ✗ Falha ao criar {repo}: HTTP {cc} {body[:200]}"); return False

          def pick_shard(exclude):
            eligible = []
            n = 1
            while n <= MAX_SHARDS_TO_SCAN:
              repo = f'compiled{n:02d}'
              if repo in exclude: n += 1; continue
              existe, size_kb = get_repo_size_kb(repo)
              if existe is None: raise SystemExit(1)
              if not existe:
                print(f"  → {repo} não existe ainda, a criar...")
                if not create_repo(repo): raise SystemExit(1)
                return repo
              size_mb = size_kb // 1024
              print(f"  {repo}: {size_mb}MB")
              if size_kb < THRESHOLD_KB: eligible.append(repo)
              n += 1
            if eligible:
              chosen = random.choice(eligible)
              print(f"  → {len(eligible)} shard(s) elegível(eis): {eligible} — escolhido: {chosen}")
              return chosen
            print(f"  → nenhum shard no range 1..{MAX_SHARDS_TO_SCAN} tem espaço — procurando além disso...")
            HARD_CEILING = 200
            while n <= HARD_CEILING:
              repo = f'compiled{n:02d}'
              if repo in exclude: n += 1; continue
              existe, size_kb = get_repo_size_kb(repo)
              if existe is None: raise SystemExit(1)
              if not existe:
                print(f"  → {repo} não existe — a criar...")
                if not create_repo(repo): raise SystemExit(1)
                return repo
              if size_kb < THRESHOLD_KB:
                print(f"  → {repo} já existe e tem espaço ({size_kb//1024}MB) — reutilizando")
                return repo
              print(f"  {repo}: {size_kb//1024}MB — cheio, avançando")
              n += 1
            print(f"  ✗ Nenhum slot de shard livre até compiled{HARD_CEILING:02d}"); raise SystemExit(1)

          def rewrite_urls(shard):
            raw_base = f"https://cdn.jsdelivr.net/gh/{owner}/{shard}@{job_branch}/{job_id}"
            with open(orig_index) as f: content = f.read()
            content = re.sub(r'#EXT-X-MAP:URI="init\.mp4"', f'#EXT-X-MAP:URI="{raw_base}/hls/init.bin"', content)
            content = re.sub(r'^(seg\d+)\.m4s$', lambda m: f"{raw_base}/hls/{m.group(1)}.bin", content, flags=re.MULTILINE)
            with open(hls_dir + '/index.m3u8', 'w') as f: f.write(content)

            bin_files = sorted(f for f in os.listdir(hls_dir) if f.endswith('.bin') and f != 'init.bin')
            if bin_files:
              total_bytes  = sum(os.path.getsize(os.path.join(hls_dir, f)) for f in bin_files)
              duration_s   = len(bin_files) * seg_duration
              real_bitrate = int((total_bytes * 8) / duration_s) if duration_s > 0 else 2000000
            else:
              real_bitrate = int(os.environ.get('PROBE_BITRATE') or 2000000)
            master = '\n'.join(['#EXTM3U', '#EXT-X-VERSION:6', '',
              f'#EXT-X-STREAM-INF:BANDWIDTH={real_bitrate},RESOLUTION={eff_w}x{eff_h}',
              f'{raw_base}/hls/index.m3u8'])
            with open(work_dir + '/master.m3u8', 'w') as f: f.write(master)

            nonces = json.load(open(work_dir + '/nonces.json'))
            thumbs_path = work_dir + '/thumbs_manifest.json'
            thumbs = json.load(open(thumbs_path)) if os.path.exists(thumbs_path) else []
            cdn_urls = [f"{raw_base}/master.m3u8", f"{raw_base}/nonces.json",
                        f"{raw_base}/hls/index.m3u8", f"{raw_base}/hls/init.bin"]
            seg_names = sorted(bn for bn in nonces['nonces'] if bn != 'init.bin')
            cdn_urls += [f"{raw_base}/hls/{bn}" for bn in seg_names]
            cdn_urls += [f"{raw_base}/thumbs/{os.path.basename(t['path'])}" for t in thumbs]
            json.dump(cdn_urls, open(work_dir + '/cdn_urls.json', 'w'))
            print(f"✓ URLs geradas pro shard {shard}")

          QUOTA_MARKERS = ('size quota', 'pre-receive hook declined', 'repository is above')

          def push_batch(batch_num, total_batches, max_attempts=8):
            for attempt in range(1, max_attempts + 1):
              print(f"→ Lote {batch_num}/{total_batches} — push tentativa {attempt}/{max_attempts}...")
              r = subprocess.run(['git', 'push', '-q', '--force', 'origin', job_branch], capture_output=True, text=True)
              out = (r.stdout + r.stderr)
              if r.returncode == 0:
                print(f"✓ Lote {batch_num}/{total_batches} enviado (tentativa {attempt})"); return 'ok'
              if any(m in out.lower() for m in QUOTA_MARKERS):
                print(f"✗ Shard cheio (quota): {out.strip()[:300]}"); return 'quota'
              wait = attempt * 8 + random.randint(0, 10)
              print(f"  ⚠ Push falhou (transitório) — retry em {wait}s... {out.strip()[:300]}")
              time.sleep(wait)
            print(f"✗ Lote {batch_num}/{total_batches} falhou após {max_attempts} tentativas"); return 'fail'

          def push_all_batches(shard):
            repo_url = f"https://x-access-token:{token}@github.com/{owner}/{shard}.git"
            shutil.rmtree('/tmp/shard', ignore_errors=True)
            os.makedirs('/tmp/shard')
            os.chdir('/tmp/shard')
            subprocess.run(['git', 'init', '-q'], check=True)
            subprocess.run(['git', 'checkout', '-q', '-b', job_branch], check=True)
            subprocess.run(['git', 'remote', 'add', 'origin', repo_url], check=True)
            os.makedirs(f'{job_id}/hls', exist_ok=True)
            os.makedirs(f'{job_id}/thumbs', exist_ok=True)

            files = sorted(os.path.join('hls', f) for f in os.listdir(hls_dir))
            files += ['master.m3u8', 'nonces.json']
            thumbs_dir = work_dir + '/thumbs'
            if os.path.isdir(thumbs_dir) and os.listdir(thumbs_dir):
              files += sorted(os.path.join('thumbs', f) for f in os.listdir(thumbs_dir))

            total = len(files)
            num_batches = (total + BATCH_SIZE - 1) // BATCH_SIZE
            print(f"→ {total} ficheiro(s) em {num_batches} lote(s) na branch {job_branch} (shard {shard})")

            for bi in range(num_batches):
              batch = files[bi*BATCH_SIZE:(bi+1)*BATCH_SIZE]
              for rel in batch:
                os.makedirs(os.path.dirname(f'{job_id}/{rel}') or '.', exist_ok=True)
                shutil.copy(f'{work_dir}/{rel}', f'{job_id}/{rel}')
              subprocess.run(['git', '-c', 'user.name=sv-bot', '-c', 'user.email=sv-bot@pixgo.frii.site',
                               'add', job_id], check=True)
              subprocess.run(['git', '-c', 'user.name=sv-bot', '-c', 'user.email=sv-bot@pixgo.frii.site',
                               'commit', '-m', f'job={job_id} lote={bi+1}/{num_batches}', '-q'])
              result = push_batch(bi+1, num_batches)
              if result != 'ok':
                os.chdir('/'); shutil.rmtree('/tmp/shard', ignore_errors=True)
                return result
            os.chdir('/'); shutil.rmtree('/tmp/shard', ignore_errors=True)
            print(f"✓ Todos os {num_batches} lote(s) enviados para {shard}@{job_branch}: {job_id}")
            return 'ok'

          exclude = set()
          final_shard = None
          for shard_attempt in range(1, MAX_SHARD_ATTEMPTS + 1):
            print(f"════ Shard — tentativa {shard_attempt}/{MAX_SHARD_ATTEMPTS} (excluindo: {sorted(exclude) or '-'}) ════")
            shard = pick_shard(exclude)
            print(f"✓ Shard escolhido: {shard}")
            rewrite_urls(shard)
            result = push_all_batches(shard)
            if result == 'ok': final_shard = shard; break
            elif result == 'quota': exclude.add(shard)
            else: raise SystemExit(1)

          if not final_shard: raise SystemExit(1)
          with open(os.environ['GITHUB_ENV'], 'a') as f: f.write(f"SHARD_REPO={final_shard}\n")
          print(f"✓ Envio concluído — shard definitivo: {final_shard}")
          PYEOF

      # ═══════════════════════════════════════════════════════════════════
      # PLAYLIST — mesma mecânica de shard/push acima, generalizada pra N
      # episódios num único push (uma subpasta por episódio dentro do
      # mesmo job_id/branch). Reaproveita literalmente as mesmas funções
      # pick_shard/create_repo/push_batch — só push_all_batches passa a
      # copiar vários episódios em vez de 1 hls/thumbs. Nome/extensão da
      # thumbnail de cada episódio agora é dinâmico (ep['thumb_ext']) —
      # RONDA "THUMBNAILS SEM FRAME": a imagem pode vir de qualquer
      # plataforma (jpg/png/webp/gif), não só do YouTube.
      # ═══════════════════════════════════════════════════════════════════
      - name: 'Playlist: escolher shard e enviar episódios'
        if: env.IS_PLAYLIST == 'true'
        env:
          STORAGE_TOKEN: ${{ env.STORAGE_TARGET_TOKEN }}
          STORAGE_OWNER: ${{ env.STORAGE_TARGET_OWNER }}
          STORAGE_CREATE_PAT: ${{ secrets.STORAGE_CREATE_PAT }}
        run: |
          git config --global core.deltaBaseCacheLimit 2047m
          git config --global core.looseObjects 0
          git config --global pack.compression 0
          git config --global pack.window 0
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999
          git config --global repack.useDeltaBaseOffset true
          git config --global advice.detachedHead false

          python3 << 'PYEOF'
          import os, subprocess, json, time, random, re, shutil

          THRESHOLD_KB       = 3_500 * 1024
          MAX_SHARDS_TO_SCAN = 20
          MAX_SHARD_ATTEMPTS = 5
          BATCH_SIZE         = 400

          owner      = os.environ['STORAGE_OWNER']
          token      = os.environ['STORAGE_TOKEN']
          work_dir   = os.environ['WORK_DIR']
          job_id     = os.environ['JOB_ID']
          job_branch = os.environ['JOB_BRANCH']
          seg_duration = int(os.environ['SEG_DURATION'])

          manifest = json.load(open(os.path.join(work_dir, 'episodes_manifest.json')))

          def api(method, path, data=None):
            cmd = ['curl','-s','-L','-w','\n%{http_code}','-X',method,
                   '-H',f'Authorization: Bearer {token}','-H','Accept: application/vnd.github+json',
                   f'https://api.github.com{path}']
            if data is not None: cmd += ['-d', json.dumps(data)]
            r = subprocess.run(cmd, capture_output=True, text=True)
            out = r.stdout
            body, _, code = out.rpartition('\n') if '\n' in out else ('', '', out)
            try: return int(code.strip()), body
            except ValueError: return 0, body

          def get_repo_size_kb(repo, max_attempts=4):
            last_code = 0
            for attempt in range(1, max_attempts + 1):
              code, out = api('GET', f'/repos/{owner}/{repo}')
              if code == 200: return True, json.loads(out).get('size', 0)
              if code == 404: return False, 0
              last_code = code
              wait = [3, 8, 15, 25][min(attempt - 1, 3)]
              print(f"  ⚠ GET {repo} → HTTP {code or 'sem resposta'} — tentativa {attempt}/{max_attempts}, aguarda {wait}s...")
              time.sleep(wait)
            print(f"  ✗ GET {repo} falhou após {max_attempts} tentativas (último HTTP {last_code})")
            return None, 0

          def create_repo(repo):
            create_pat = os.environ.get('STORAGE_CREATE_PAT', '')
            if not create_pat:
              print(f"  ✗ STORAGE_CREATE_PAT não configurado — impossível criar {repo}"); return False
            cmd = ['curl','-s','-w','\n%{http_code}','-X','POST',
                   '-H',f'Authorization: Bearer {create_pat}','-H','Accept: application/vnd.github+json',
                   'https://api.github.com/user/repos',
                   '-d', json.dumps({'name': repo, 'private': False, 'auto_init': True})]
            r = subprocess.run(cmd, capture_output=True, text=True)
            out = r.stdout
            body, _, code_str = out.rpartition('\n') if '\n' in out else ('', '', out)
            try: cc = int(code_str.strip())
            except ValueError: cc = 0
            if cc == 201: return True
            if cc == 422: print(f"  ⚠ {repo} já existe — reutilizando"); return True
            print(f"  ✗ Falha ao criar {repo}: HTTP {cc} {body[:200]}"); return False

          def pick_shard(exclude):
            eligible = []
            n = 1
            while n <= MAX_SHARDS_TO_SCAN:
              repo = f'compiled{n:02d}'
              if repo in exclude: n += 1; continue
              existe, size_kb = get_repo_size_kb(repo)
              if existe is None: raise SystemExit(1)
              if not existe:
                print(f"  → {repo} não existe ainda, a criar...")
                if not create_repo(repo): raise SystemExit(1)
                return repo
              size_mb = size_kb // 1024
              print(f"  {repo}: {size_mb}MB")
              if size_kb < THRESHOLD_KB: eligible.append(repo)
              n += 1
            if eligible:
              chosen = random.choice(eligible)
              print(f"  → {len(eligible)} shard(s) elegível(eis): {eligible} — escolhido: {chosen}")
              return chosen
            print(f"  → nenhum shard no range 1..{MAX_SHARDS_TO_SCAN} tem espaço — procurando além disso...")
            HARD_CEILING = 200
            while n <= HARD_CEILING:
              repo = f'compiled{n:02d}'
              if repo in exclude: n += 1; continue
              existe, size_kb = get_repo_size_kb(repo)
              if existe is None: raise SystemExit(1)
              if not existe:
                print(f"  → {repo} não existe — a criar...")
                if not create_repo(repo): raise SystemExit(1)
                return repo
              if size_kb < THRESHOLD_KB:
                print(f"  → {repo} já existe e tem espaço ({size_kb//1024}MB) — reutilizando")
                return repo
              print(f"  {repo}: {size_kb//1024}MB — cheio, avançando")
              n += 1
            print(f"  ✗ Nenhum slot de shard livre até compiled{HARD_CEILING:02d}"); raise SystemExit(1)

          def rewrite_urls_for_episode(shard, ep):
            raw_base = f"https://cdn.jsdelivr.net/gh/{owner}/{shard}@{job_branch}/{job_id}/ep{ep['ep_num']}"
            hls_dir = ep['hls_dir']
            orig_index = hls_dir + '/index.m3u8.orig'
            shutil.copy(hls_dir + '/index.m3u8', orig_index)
            with open(orig_index) as f: content = f.read()
            content = re.sub(r'#EXT-X-MAP:URI="init\.mp4"', f'#EXT-X-MAP:URI="{raw_base}/hls/init.bin"', content)
            content = re.sub(r'^(seg\d+)\.m4s$', lambda m: f"{raw_base}/hls/{m.group(1)}.bin", content, flags=re.MULTILINE)
            with open(hls_dir + '/index.m3u8', 'w') as f: f.write(content)

            bin_files = sorted(f for f in os.listdir(hls_dir) if f.endswith('.bin') and f != 'init.bin')
            if bin_files:
              total_bytes = sum(os.path.getsize(os.path.join(hls_dir, f)) for f in bin_files)
              duration_s  = len(bin_files) * seg_duration
              real_bitrate = int((total_bytes * 8) / duration_s) if duration_s > 0 else 2000000
            else:
              real_bitrate = int(ep['probe'].get('bitrate') or 2000000)
            eff_w, eff_h = ep['quality']['eff_w'], ep['quality']['eff_h']
            master = '\n'.join(['#EXTM3U', '#EXT-X-VERSION:6', '',
              f'#EXT-X-STREAM-INF:BANDWIDTH={real_bitrate},RESOLUTION={eff_w}x{eff_h}',
              f'{raw_base}/hls/index.m3u8'])
            with open(os.path.join(ep['dir'], 'master.m3u8'), 'w') as f: f.write(master)

            # RONDA "THUMBNAILS SEM FRAME": extensão dinâmica (thumb_ext
            # persistido no manifest) em vez de ".jpg" fixo — a imagem
            # pode ter vindo de qualquer plataforma ou do fallback YT.
            if ep['has_thumb']:
              thumb_urls = [f"{raw_base}/thumbs/thumb_0.{ep['thumb_ext']}"]
            else:
              thumb_urls = []
            cdn_urls = [f"{raw_base}/master.m3u8", f"{raw_base}/hls/index.m3u8", f"{raw_base}/hls/init.bin"]
            seg_names = sorted(bn for bn in ep['nonce_map'] if bn != 'init.bin')
            cdn_urls += [f"{raw_base}/hls/{bn}" for bn in seg_names]
            cdn_urls += thumb_urls
            json.dump({'cdn_urls': cdn_urls, 'thumb_urls': thumb_urls, 'master_url': f"{raw_base}/master.m3u8"},
                      open(os.path.join(ep['dir'], 'urls.json'), 'w'))

          def push_batch(batch_num, total_batches, max_attempts=8):
            for attempt in range(1, max_attempts + 1):
              print(f"→ Lote {batch_num}/{total_batches} — push tentativa {attempt}/{max_attempts}...")
              r = subprocess.run(['git', 'push', '-q', '--force', 'origin', job_branch], capture_output=True, text=True)
              out = (r.stdout + r.stderr)
              if r.returncode == 0:
                print(f"✓ Lote {batch_num}/{total_batches} enviado (tentativa {attempt})"); return 'ok'
              if any(m in out.lower() for m in ('size quota', 'pre-receive hook declined', 'repository is above')):
                print(f"✗ Shard cheio (quota): {out.strip()[:300]}"); return 'quota'
              wait = attempt * 8 + random.randint(0, 10)
              print(f"  ⚠ Push falhou (transitório) — retry em {wait}s... {out.strip()[:300]}")
              time.sleep(wait)
            print(f"✗ Lote {batch_num}/{total_batches} falhou após {max_attempts} tentativas"); return 'fail'

          def push_all_episodes(shard):
            repo_url = f"https://x-access-token:{token}@github.com/{owner}/{shard}.git"
            shutil.rmtree('/tmp/shard', ignore_errors=True)
            os.makedirs('/tmp/shard')
            os.chdir('/tmp/shard')
            subprocess.run(['git', 'init', '-q'], check=True)
            subprocess.run(['git', 'checkout', '-q', '-b', job_branch], check=True)
            subprocess.run(['git', 'remote', 'add', 'origin', repo_url], check=True)

            files = []
            for ep in manifest:
              base = f'{job_id}/ep{ep["ep_num"]}'
              os.makedirs(f'{base}/hls', exist_ok=True)
              for f in sorted(os.listdir(ep['hls_dir'])):
                shutil.copy(os.path.join(ep['hls_dir'], f), f'{base}/hls/{f}')
                files.append(f'{base}/hls/{f}')
              shutil.copy(os.path.join(ep['dir'], 'master.m3u8'), f'{base}/master.m3u8')
              files.append(f'{base}/master.m3u8')
              if ep['has_thumb']:
                os.makedirs(f'{base}/thumbs', exist_ok=True)
                thumb_name = f"thumb_0.{ep['thumb_ext']}"
                shutil.copy(os.path.join(ep['thumbs_dir'], thumb_name), f'{base}/thumbs/{thumb_name}')
                files.append(f'{base}/thumbs/{thumb_name}')

            total = len(files)
            num_batches = (total + BATCH_SIZE - 1) // BATCH_SIZE
            print(f"→ {total} ficheiro(s) de {len(manifest)} episódio(s) em {num_batches} lote(s) na branch {job_branch} (shard {shard})")

            for bi in range(num_batches):
              batch = files[bi*BATCH_SIZE:(bi+1)*BATCH_SIZE]
              for rel in batch:
                subprocess.run(['git', 'add', rel], check=True)
              subprocess.run(['git', '-c', 'user.name=sv-bot', '-c', 'user.email=sv-bot@pixgo.frii.site',
                               'commit', '-m', f'job={job_id} lote={bi+1}/{num_batches}', '-q'])
              result = push_batch(bi+1, num_batches)
              if result != 'ok':
                os.chdir('/'); shutil.rmtree('/tmp/shard', ignore_errors=True)
                return result
            os.chdir('/'); shutil.rmtree('/tmp/shard', ignore_errors=True)
            print(f"✓ Todos os {num_batches} lote(s) enviados para {shard}@{job_branch}: {job_id}")
            return 'ok'

          exclude = set()
          final_shard = None
          for shard_attempt in range(1, MAX_SHARD_ATTEMPTS + 1):
            print(f"════ Shard — tentativa {shard_attempt}/{MAX_SHARD_ATTEMPTS} (excluindo: {sorted(exclude) or '-'}) ════")
            shard = pick_shard(exclude)
            print(f"✓ Shard escolhido: {shard}")
            for ep in manifest:
              rewrite_urls_for_episode(shard, ep)
            result = push_all_episodes(shard)
            if result == 'ok': final_shard = shard; break
            elif result == 'quota': exclude.add(shard)
            else: raise SystemExit(1)

          if not final_shard: raise SystemExit(1)
          with open(os.environ['GITHUB_ENV'], 'a') as f: f.write(f"SHARD_REPO={final_shard}\n")
          print(f"✓ Envio concluído — shard definitivo: {final_shard}")
          PYEOF

      - name: Registar no EdgeOne (Turso + KV)
        if: env.IS_PLAYLIST != 'true'
        continue-on-error: true
        env:
          METADATA:      ${{ inputs.metadata }}
          STORAGE_OWNER: ${{ env.STORAGE_TARGET_OWNER }}
        run: |
          python3 << 'PYEOF'
          import json, os, urllib.request, urllib.error, datetime, time

          pipeline_api = os.environ.get('PIPELINE_API','').rstrip('/')
          if not pipeline_api: print('⚠ PIPELINE_API não configurado'); raise SystemExit(0)

          work_dir     = os.environ['WORK_DIR']
          job_id       = os.environ['JOB_ID']
          quality      = os.environ.get('QUALITY_LABEL', '')
          seg_dur      = int(os.environ.get('SEG_DURATION', '4') or '4')
          storage_owner = os.environ['STORAGE_OWNER']
          shard_repo    = os.environ['SHARD_REPO']
          job_branch    = os.environ['JOB_BRANCH']
          raw_base      = f"https://cdn.jsdelivr.net/gh/{storage_owner}/{shard_repo}@{job_branch}/{job_id}"

          try: metadata = json.loads(os.environ.get('METADATA','{}'))
          except: metadata = {}

          probe = json.load(open(os.path.join(work_dir, 'probe_parsed.json')))
          eff_w = int(os.environ.get('EFF_WIDTH', '0') or '0')
          eff_h = int(os.environ.get('EFF_HEIGHT', '0') or '0')
          nonces    = json.load(open(os.path.join(work_dir, 'nonces.json')))
          seg_count = len([k for k in nonces['nonces'] if k != 'init.bin'])
          thumbs_path = os.path.join(work_dir, 'thumbs_manifest.json')
          thumbs      = json.load(open(thumbs_path)) if os.path.exists(thumbs_path) else []
          thumb_urls  = [f"{raw_base}/thumbs/{os.path.basename(t['path'])}" for t in thumbs]
          cdn_urls_path = os.path.join(work_dir, 'cdn_urls.json')
          cdn_urls      = json.load(open(cdn_urls_path)) if os.path.exists(cdn_urls_path) else []

          # contentId é sempre o video_id do YouTube (vem já preenchido
          # como tal pelo worker de despacho) — nunca cai de volta pro
          # job_id, então nunca há entradas duplicadas por título variar.
          content_id = metadata.get('contentId', job_id)

          body = {
            'contentId':content_id,'title':metadata.get('title','Untitled'),'description':metadata.get('description',''),
            'type':metadata.get('type','video'),'year':int(metadata.get('year') or datetime.datetime.now().year),
            'lang':metadata.get('lang','pt'),'duration':round(probe.get('duration', 0)),'thumbnail':thumb_urls[0] if thumb_urls else '',
            'thumbnails':thumb_urls,'qualities':[quality] if quality else [],'width':eff_w,'height':eff_h,'codec':'h264','fps':probe.get('fps', 24),
            'bitrate':probe.get('bitrate', 0),'segmentCount':seg_count,'segDuration':seg_dur,'videoID':job_id,'cdnUrls':cdn_urls,
            'encrypted':True,'encryption':'chacha20-chunk-v2','container':'fmp4','segExt':'bin',
            'masterUrl':f"{raw_base}/master.m3u8",'noncesUrl':f"{raw_base}/nonces.json",
            'storageRepo': shard_repo, 'storageOwner': storage_owner, 'storageBranch': job_branch,
          }
          payload = json.dumps(body).encode()
          for attempt in range(1, 6):
            req = urllib.request.Request(f"{pipeline_api}/api/pipeline/register", data=payload,
              headers={'Content-Type':'application/json','X-API-Key':os.environ.get('ADMIN_API_KEY','')}, method='POST')
            try:
              with urllib.request.urlopen(req, timeout=30) as r: print(f"✓ Conteúdo registado ({r.status})"); break
            except urllib.error.HTTPError as e:
              if e.code < 500 and e.code != 429: print(f"  Erro cliente ({e.code})"); break
              print(f"⚠ Tentativa {attempt} — HTTP {e.code}")
            except Exception as e: print(f"⚠ Tentativa {attempt} — {e}")
            if attempt < 5: time.sleep([5,10,20,40][attempt-1])
          print("✓ Registo concluído")
          PYEOF

      # ═══════════════════════════════════════════════════════════════════
      # PLAYLIST — 1 registo POR EPISÓDIO, reaproveitando exactamente os
      # MESMOS campos seasonNumber/episodeNumber/episodeTitle já usados
      # pelo process-leve.yml (nenhum campo novo). ep_num vem do
      # playlist_index real do yt-dlp — nunca precisou de offset.
      # ═══════════════════════════════════════════════════════════════════
      - name: 'Playlist: registar episódios no EdgeOne (Turso + KV)'
        if: env.IS_PLAYLIST == 'true'
        continue-on-error: true
        env:
          METADATA:      ${{ inputs.metadata }}
          STORAGE_OWNER: ${{ env.STORAGE_TARGET_OWNER }}
        run: |
          python3 << 'PYEOF'
          import json, os, urllib.request, urllib.error, datetime, time

          pipeline_api = os.environ.get('PIPELINE_API','').rstrip('/')
          if not pipeline_api: print('⚠ PIPELINE_API não configurado'); raise SystemExit(0)

          work_dir      = os.environ['WORK_DIR']
          job_id        = os.environ['JOB_ID']
          seg_dur       = int(os.environ.get('SEG_DURATION', '4') or '4')
          storage_owner = os.environ['STORAGE_OWNER']
          shard_repo    = os.environ['SHARD_REPO']
          job_branch    = os.environ['JOB_BRANCH']

          try: metadata = json.loads(os.environ.get('METADATA','{}'))
          except: metadata = {}
          content_type = (metadata.get('type') or 'video').strip().lower()
          content_id   = metadata.get('contentId', job_id)

          manifest = json.load(open(os.path.join(work_dir, 'episodes_manifest.json')))

          for ep in manifest:
            raw_base = f"https://cdn.jsdelivr.net/gh/{storage_owner}/{shard_repo}@{job_branch}/{job_id}/ep{ep['ep_num']}"
            urls = json.load(open(os.path.join(ep['dir'], 'urls.json')))
            probe = ep['probe']
            eff_w, eff_h = ep['quality']['eff_w'], ep['quality']['eff_h']
            seg_count = len([k for k in ep['nonce_map'] if k != 'init.bin'])

            body = {
              'contentId': content_id, 'title': metadata.get('title', 'Untitled'),
              'description': metadata.get('description', ''), 'type': content_type,
              'year': int(metadata.get('year') or datetime.datetime.now().year),
              'lang': metadata.get('lang', 'pt'), 'duration': round(probe.get('duration', 0)),
              'thumbnail': urls['thumb_urls'][0] if urls['thumb_urls'] else '',
              'thumbnails': urls['thumb_urls'], 'qualities': [ep['quality']['label']],
              'width': eff_w, 'height': eff_h, 'codec': 'h264', 'fps': probe.get('fps', 24),
              'bitrate': probe.get('bitrate', 0), 'segmentCount': seg_count, 'segDuration': seg_dur,
              'videoID': f"{job_id}-ep{ep['ep_num']}", 'cdnUrls': urls['cdn_urls'],
              'encrypted': True, 'encryption': 'chacha20-chunk-v2', 'container': 'fmp4', 'segExt': 'bin',
              'masterUrl': urls['master_url'], 'noncesUrl': '',
              'storageRepo': shard_repo, 'storageOwner': storage_owner, 'storageBranch': job_branch,
              # MESMOS 3 campos já usados pelo process-leve.yml pra
              # episódios — nenhum campo novo inventado.
              'seasonNumber': '1', 'episodeNumber': str(ep['ep_num']), 'episodeTitle': '',
            }
            payload = json.dumps(body).encode()
            ok = False
            for attempt in range(1, 6):
              req = urllib.request.Request(f"{pipeline_api}/api/pipeline/register", data=payload,
                headers={'Content-Type': 'application/json', 'X-API-Key': os.environ.get('ADMIN_API_KEY', '')}, method='POST')
              try:
                with urllib.request.urlopen(req, timeout=30) as r:
                  print(f"✓ ep{ep['ep_num']} registado ({r.status})"); ok = True; break
              except urllib.error.HTTPError as e:
                if e.code < 500 and e.code != 429:
                  print(f"  ep{ep['ep_num']} — erro cliente ({e.code})"); break
                print(f"⚠ ep{ep['ep_num']} tentativa {attempt} — HTTP {e.code}")
              except Exception as e:
                print(f"⚠ ep{ep['ep_num']} tentativa {attempt} — {e}")
              if attempt < 5: time.sleep([5,10,20,40][attempt-1])
            if not ok:
              print(f"✗ ep{ep['ep_num']} NÃO foi registado após 5 tentativas")
          print(f"✓ Registo de {len(manifest)} episódio(s) concluído")
          PYEOF

      - name: Notificar dispatcher (webhook FIFO)
        if: success() || failure()
        continue-on-error: true
        run: |
          if [ -z "$DISPATCHER_URL" ]; then echo "⚠ DISPATCHER_URL não configurado"; exit 0; fi
          EFFECTIVE_JOB_ID="${JOB_ID:-${{ inputs.job_id }}}"
          if [ -z "$EFFECTIVE_JOB_ID" ]; then echo "⚠ job_id indisponível"; exit 0; fi
          if [ "${{ job.status }}" = "success" ]; then WEBHOOK_STATUS="done"; else WEBHOOK_STATUS="failed"; fi
          # DISPATCHER_URL é o MESMO secret que o process-leve.yml usa (só
          # o host base, sem sufixo) — o /dlp/ aqui é fixo neste workflow
          # porque o dispatcher-dlp.js está montado sob esse prefixo no
          # index.js do alwaysdata, pra não colidir com as rotas do
          # dispatcher.js antigo (/webhook, na raiz, continua servindo o
          # process-leve.yml normalmente).
          WEBHOOK_URL="${DISPATCHER_URL%/}/dlp/webhook"
          echo "→ POST ${WEBHOOK_URL} (job_id=${EFFECTIVE_JOB_ID}, status=${WEBHOOK_STATUS})"
          HTTP_CODE=$(curl -s -o /tmp/wh_resp.txt -w '%{http_code}' -X POST \
            -H "Content-Type: application/json" -H "x-api-key: ${ADMIN_API_KEY_YT}" \
            --max-time 20 --retry 2 --retry-delay 3 "${WEBHOOK_URL}" \
            -d "{\"job_id\":\"${EFFECTIVE_JOB_ID}\",\"status\":\"${WEBHOOK_STATUS}\"}") || true
          if [[ "$HTTP_CODE" =~ ^2 ]]; then echo "✓ Webhook enviado (HTTP $HTTP_CODE)"; else
            echo "✗ Webhook falhou (HTTP $HTTP_CODE)"; cat /tmp/wh_resp.txt 2>/dev/null || true; fi

      - name: Cleanup
        if: always()
        run: |
          rm -rf "$WORK_DIR"
          rm -rf /tmp/shard
          rm -f /tmp/wh_resp.txt /tmp/cookies.txt
          echo "✓ Workspace limpo"

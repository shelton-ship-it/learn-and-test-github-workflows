name: StreamVault Process (Leve)

# ═══════════════════════════════════════════════════════════════════════
# VERSÃO "LEVE" — variante do process.yml, não substitui o original.
#
# [... histórico de patches 1-8 preservado, ver secção FIX CIRÚRGICO #8
#  original — dorama saiu do Coordinator, vai por lote A/B como vídeo
#  único ...]
#
#   9. FIX CIRÚRGICO (este patch — lotes C/D + multi-link por temporada):
#      Duas mudanças, ambas em resposta ao mesmo pedido: séries/animes
#      deixam de disparar instantâneo (caminho "Manual" antigo, removido
#      do ingest.html) e passam a entrar em lotes C/D próprios (worker
#      Cloudflare, ver lotes-worker.js) com a regra "só dispara o próximo
#      título da fila quando o anterior já concluiu de facto — nunca 2
#      simultâneos".
#
#      9a. DISPATCH DE FILHOS PASSA A IR PELO dispatcher.js, NÃO MAIS
#          DIRETO À API DO GITHUB:
#          Antes, dispatch_child() chamava a API do GitHub directamente
#          com o GITHUB_TOKEN automático do próprio job (exceção
#          documentada do workflow_dispatch). Isso tinha uma consequência
#          não percebida até agora: o dispatcher.js NUNCA soube da
#          existência desses jobs filhos — só tem o job "pai" (a
#          submissão original) no jobStore, e esse pai reporta "done" a
#          si mesmo assim que o Coordinator TERMINA DE DISPARAR os
#          filhos (sys.exit(0) faz o step suceder, os steps seguintes são
#          pulados via COORDINATOR_DISPATCHED, o job termina com sucesso
#          e dispara o webhook do PAI em poucos minutos) — muito antes de
#          qualquer filho ter de facto terminado de baixar/codificar.
#          Sem saber quando os filhos realmente acabam, não há como
#          implementar "só dispara o próximo título do lote quando este
#          já concluiu".
#          Fix: dispatch_child() agora faz POST para
#          "${DISPATCHER_URL}/dispatch" (mesmo endpoint que o
#          ingest.html/worker já usam), autenticado com o mesmo
#          ADMIN_API_KEY já usado no step "Notificar dispatcher" e em
#          "Registar no EdgeOne" (secret já existe no repo, nada novo a
#          configurar). Cada filho ganha entrada própria no jobStore do
#          dispatcher (round-robin de conta, jitter anti-rajada da
#          DispatchQueue — bónus: os filhos agora também se beneficiam
#          dessa proteção anti-abuso, que antes só existia pra chamadas
#          vindas do server.js/worker). EFEITO COLATERAL DELIBERADO: os
#          filhos podem agora cair em QUALQUER uma das contas GitHub
#          configuradas no dispatcher (round-robin), não mais sempre na
#          MESMA conta/repo do Coordinator pai — isso é seguro porque
#          nada no pipeline depende de filho e pai estarem no mesmo repo
#          (branch exclusiva por job_id, shard de storage é uma conta
#          totalmente separada) e na prática distribui melhor a carga
#          entre as 2 contas.
#      9b. PARENT_JOB / BATCH_TOTAL — cada filho agora recebe (via novos
#          inputs do workflow_dispatch) o job_id do Coordinator pai e o
#          total de filhos esperados (len(children)). O filho propaga
#          esses 2 valores no seu PRÓPRIO webhook final pro dispatcher —
#          o dispatcher.js (não este ficheiro) usa isso pra acumular
#          "quantos dos N filhos já terminaram" na entrada do PAI no
#          jobStore, e expõe isso num novo endpoint GET
#          /parent-status/:jobId. É esse endpoint que o worker dos lotes
#          C/D consulta a cada minuto pra saber se pode liberar o próximo
#          título da fila.
#      9c. EPISODE_COUNT — pro caso "1 link cobre N episódios" (torrent
#          com N ficheiros de vídeo pertencentes à MESMA submissão, ex.:
#          um magnet com 2 episódios). Quando o chamador informa
#          episode_number (início) E episode_count (quantos), E o número
#          de ficheiros de vídeo encontrados no torrent bate exactamente
#          com episode_count, a numeração é SEQUENCIAL e DETERMINÍSTICA
#          (episode_number, episode_number+1, ...) pela ORDEM DOS
#          FICHEIROS DENTRO DO TORRENT — nunca por regex/adivinhação no
#          nome. LIMITAÇÃO CONHECIDA E ASSUMIDA: essa ordem é a ordem de
#          indexação do próprio torrent (fs.files(), mesma usada em todo
#          o resto do coordinator) — não há garantia de que bata com a
#          ordem "real" dos episódios se o release empacotar os
#          ficheiros fora de ordem dentro do torrent. Se episode_count
#          não bater com o número de ficheiros encontrados, cai de volta
#          pro modo automático antigo (regex/contador) com aviso
#          explícito no log — não falha o job, mas a numeração pode sair
#          errada nesse caso, mesmo aviso já dado como "confira o
#          episode_count enviado". O caso "1 link = 1 episódio"
#          (episode_count=1, já suportado desde o fix #6) continua
#          idêntico.
#      NÃO MUDA: o timer fixo de 20min entre disparos DENTRO de um único
#      Coordinator (DISPATCH_INTERVAL_SECONDS) continua igual — isso
#      espaça o INÍCIO das runs dos episódios de UM MESMO título entre
#      si, é uma preocupação diferente do semáforo entre TÍTULOS
#      diferentes do lote C/D (esse semáforo vive no worker Cloudflare,
#      fora deste ficheiro). O timeout-minutes: 45 do job inteiro também
#      não muda — é o que já implementa "job com falha se auto-apaga":
#      o próprio GitHub Actions cancela o run ao bater o teto, o
#      histórico do run fica retido normalmente no GitHub, nada a
#      adicionar aqui.
# ═══════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Job ID'
        required: true
      video_url:
        description: 'URL do vídeo — HTTP(S), magnet:, .torrent'
        required: false
        default: ''
      seg_duration:
        description: 'Duração segmento HLS (segundos)'
        required: false
        default: '4'
      max_encode_height:
        description: 'Altura máxima encode'
        required: false
        default: '720'
      metadata:
        description: 'JSON: { contentId, title, description, type, year, lang }'
        required: false
        default: '{}'
      thumbnail_url:
        description: 'URL da thumbnail (JPG/PNG)'
        required: false
        default: ''
      season_number:
        description: 'Número da temporada'
        required: false
        default: '0'
      episode_number:
        description: 'Número do episódio (ou episódio INICIAL, se episode_count > 1)'
        required: false
        default: '0'
      episode_title:
        description: 'Título do episódio'
        required: false
        default: ''
      file_indices:
        description: 'Índices dos ficheiros no torrent'
        required: false
        default: ''
      episode_count:
        description: 'Quantos episódios este link/torrent cobre (>1 = numeração sequencial determinística a partir de episode_number)'
        required: false
        default: '1'
      parent_job:
        description: '[uso interno — filhos do coordinator] job_id do Coordinator pai'
        required: false
        default: ''
      batch_total:
        description: '[uso interno — filhos do coordinator] total de filhos esperados pelo pai'
        required: false
        default: ''

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: write
      contents: read

    env:
      WORK_DIR:       /tmp/sv_work/${{ inputs.job_id }}
      CHACHA_KEY:     ${{ secrets.CHACHA_KEY }}
      PIPELINE_API:   ${{ secrets.PIPELINE_API }}
      ADMIN_API_KEY:  ${{ secrets.ADMIN_API_KEY }}
      DISPATCHER_URL: ${{ secrets.DISPATCHER_URL }}

    steps:
      # ── 0. Preparar ambiente ─────────────────────────────────────────────
      - name: Preparar ambiente
        run: |
          echo "JOB_ID=${{ inputs.job_id }}"             >> $GITHUB_ENV
          echo "SEG_DURATION=${{ inputs.seg_duration }}" >> $GITHUB_ENV
          echo "MAX_H=${{ inputs.max_encode_height }}"   >> $GITHUB_ENV
          echo "PARENT_JOB=${{ inputs.parent_job }}"     >> $GITHUB_ENV
          echo "BATCH_TOTAL=${{ inputs.batch_total }}"   >> $GITHUB_ENV
          mkdir -p "/tmp/sv_work/${{ inputs.job_id }}/incoming" \
                   "/tmp/sv_work/${{ inputs.job_id }}/hls" \
                   "/tmp/sv_work/${{ inputs.job_id }}/thumbs"

      - name: Instalar pacotes apt (ffmpeg + libtorrent, cache)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: ffmpeg python3-libtorrent
          version: 1.0
          execute_install_scripts: true

      - name: Atualizar cache do linker (ldconfig)
        run: sudo ldconfig

      - name: Instalar dependências Python (pip)
        run: |
          pip install --quiet --upgrade cryptography
          ffmpeg -version | head -1
          python3 -c "import libtorrent as lt; print(f'✓ libtorrent {lt.version}')"

      # ═══════════════════════════════════════════════════════════════════
      # COORDINATOR (séries e animes — dorama continua fora desta condição,
      # processa sempre como vídeo único via lote A/B)
      # ═══════════════════════════════════════════════════════════════════

      - name: '[Coordinator] Detectar episódios e disparar jobs filhos'
        if: |
          inputs.video_url != '' &&
          inputs.file_indices == '' &&
          (
            contains(fromJson(inputs.metadata).type, 'series') ||
            contains(fromJson(inputs.metadata).type, 'anime')
          ) &&
          (
            startsWith(inputs.video_url, 'magnet:') ||
            endsWith(inputs.video_url, '.torrent')  ||
            contains(inputs.video_url, 'infohash:')
          )
        env:
          INPUT_METADATA:      ${{ inputs.metadata }}
          INPUT_VIDEO_URL:     ${{ inputs.video_url }}
          INPUT_THUMBNAIL:     ${{ inputs.thumbnail_url }}
          INPUT_SEG:           ${{ inputs.seg_duration }}
          INPUT_HEIGHT:        ${{ inputs.max_encode_height }}
          INPUT_SEASON:        ${{ inputs.season_number }}
          INPUT_EPISODE:       ${{ inputs.episode_number }}
          INPUT_EP_TITLE:      ${{ inputs.episode_title }}
          INPUT_EPISODE_COUNT: ${{ inputs.episode_count }}
          DISPATCHER_URL:      ${{ secrets.DISPATCHER_URL }}
          ADMIN_API_KEY:       ${{ secrets.ADMIN_API_KEY }}
        run: |
          python3 << 'PYEOF'
          import libtorrent as lt
          import os, sys, re, json, time, subprocess, urllib.request, urllib.error

          url          = os.environ['INPUT_VIDEO_URL']
          metadata_raw = os.environ['INPUT_METADATA']
          season_num   = int(os.environ.get('INPUT_SEASON', '0') or '0')
          input_episode_raw = (os.environ.get('INPUT_EPISODE', '') or '').strip()
          input_episode      = int(input_episode_raw) if input_episode_raw.isdigit() and input_episode_raw != '0' else None
          input_ep_title      = os.environ.get('INPUT_EP_TITLE', '') or ''
          # FIX 9c (multi-link/temporada): quantos episódios ESTE link/torrent
          # cobre. '1' (default) = comportamento antigo, sem mudança.
          input_episode_count_raw = (os.environ.get('INPUT_EPISODE_COUNT', '') or '1').strip()
          input_episode_count = int(input_episode_count_raw) if input_episode_count_raw.isdigit() and input_episode_count_raw != '0' else 1
          VIDEO_EXTS   = {'.mp4','.mkv','.avi','.mov','.wmv','.flv','.ts','.m4v','.webm','.mpg','.mpeg'}
          BATCH_LIMIT  = 1_400 * 1024 * 1024

          try:    metadata = json.loads(metadata_raw)
          except: metadata = {}
          content_id = metadata.get('contentId') or ''
          if not content_id:
            print("  ⚠ metadata.contentId vazio — o ID será derivado do título. Se o título "
                  "variar minimamente entre submissões do MESMO conteúdo (espaços, maiúsculas, "
                  "pontuação), cada submissão vira uma entrada DIFERENTE no catálogo. Prefira "
                  "sempre passar contentId explícito ao juntar episódios da mesma série/filme.")

          print(f"Coordinator: {metadata.get('title','?')} S{season_num:02d} | {url[:70]}...")

          ses = lt.session({
            'listen_interfaces':       '0.0.0.0:6882',
            'enable_dht':              True,
            'enable_lsd':              True,
            'use_dht_as_fallback':     True,
            'dht_restrict_routing_ips': False,
            'dht_bootstrap_nodes':     'router.bittorrent.com:6881,router.utorrent.com:6881,dht.transmissionbt.com:6881,dht.aelitis.com:6881',
            'alert_mask':              0xffffffff,
          })
          try: ses.apply_settings({'connections_limit':200,'active_downloads':1,'active_seeds':0})
          except Exception as e: print(f"  apply_settings parcial: {e}")

          def log_alerts(ses):
            tracker_replied = False
            peer_signal     = False
            for a in ses.pop_alerts():
              name = type(a).__name__
              try:
                msg = a.message()
              except Exception:
                msg = str(a)
              if 'tracker_error' in name:
                print(f"  ✗ {name}: {msg}")
              elif 'tracker_reply' in name:
                tracker_replied = True
                if getattr(a, 'num_peers', 0) > 0:
                  peer_signal = True
                print(f"  ✓ {name}: {msg}")
              elif 'tracker_warning' in name:
                print(f"  ⚠ {name}: {msg}")
            return tracker_replied, peer_signal

          os.makedirs('/tmp/coord_meta', exist_ok=True)

          if url.startswith('magnet:') or 'infohash:' in url:
            params = lt.parse_magnet_uri(url)
            params.save_path = '/tmp/coord_meta'
          else:
            torrent_path = '/tmp/coord.torrent'
            urllib.request.urlretrieve(url, torrent_path)
            ti = lt.torrent_info(torrent_path)
            params = lt.add_torrent_params()
            params.ti = ti
            params.save_path = '/tmp/coord_meta'

          params.flags = lt.torrent_flags.upload_mode | lt.torrent_flags.paused
          handle = ses.add_torrent(params)
          handle.resume()

          print("  Aguardando metadados...")
          t0 = time.time()
          CHECK_INTERVAL = 15
          last_check_t   = -1

          while not handle.status().has_metadata:
            log_alerts(ses)
            elapsed = int(time.time() - t0)
            st = handle.status()
            dht_nodes = ses.status().dht_nodes if hasattr(ses.status(), 'dht_nodes') else 0
            if elapsed != last_check_t and elapsed % CHECK_INTERVAL == 0:
              last_check_t = elapsed
              print(f"  ... {elapsed}s | peers: {st.num_peers} | dht_nodes: {dht_nodes}")
            ses.wait_for_alert(1000)

          info = handle.get_torrent_info()
          fs   = info.files()
          print(f"  Metadados OK: {info.name()} | {fs.num_files()} ficheiros | {info.total_size()//(1024*1024)} MB")
          ses.remove_torrent(handle)

          video_files = []
          for i in range(fs.num_files()):
            path = fs.file_path(i)
            size = fs.file_size(i)
            ext  = os.path.splitext(path)[1].lower()
            if ext in VIDEO_EXTS:
              video_files.append({'index': i, 'path': path, 'size': size, 'name': os.path.basename(path)})

          if not video_files:
            print("ERRO: nenhum ficheiro de vídeo nos metadados")
            sys.exit(1)

          print(f"  Vídeos encontrados: {len(video_files)}")

          def extract_ep(name):
            base = os.path.splitext(name)[0]
            patterns = [
              r'[Ss]\d+[Ee](\d+)',
              r'[Ee][Pp]?[\s._-]?(\d{1,3})',
              r'[\s._-](\d{2,3})[\s._-]',
              r'^(\d{1,3})[\s._-]',
              r'[\s._-](\d{1,3})\.',
            ]
            for pat in patterns:
              m = re.search(pat, base, re.IGNORECASE)
              if m: return int(m.group(1))
            return None

          # FIX 9c: quando o chamador informou episode_number (início) E
          # episode_count>1, E o número de ficheiros de vídeo encontrados
          # bate exactamente — numeração sequencial determinística pela
          # ordem dos ficheiros no torrent, sem NENHUMA tentativa de
          # adivinhar pelo nome.
          if input_episode is not None and len(video_files) == input_episode_count and input_episode_count > 1:
            for i, vf in enumerate(video_files):
              vf['ep_num'] = input_episode + i
            print(f"  {len(video_files)} ficheiro(s) == episode_count esperado ({input_episode_count}) — "
                  f"numerando sequencialmente a partir de ep{input_episode:02d} pela ordem dos ficheiros "
                  f"no torrent (ignorando qualquer padrão no nome)")
          elif len(video_files) == 1 and input_episode is not None:
            # Caso já existente (fix #6): torrent com 1 único ficheiro e
            # episode_number explícito — usa direto, sem regex.
            video_files[0]['ep_num'] = input_episode
            print(f"  Episódio único com episode_number explícito: usando ep{input_episode:02d} "
                  f"(ignorando qualquer padrão no nome do ficheiro)")
          else:
            if input_episode is not None and input_episode_count > 1:
              print(f"  ⚠ episode_count={input_episode_count} não bate com {len(video_files)} ficheiro(s) "
                    f"de vídeo encontrado(s) no torrent — voltando pro modo automático (regex/contador), "
                    f"a numeração pode sair errada. Confira o link e o episode_count enviados.")
            for vf in video_files:
              vf['ep_num'] = extract_ep(vf['name'])

            used_nums = {v['ep_num'] for v in video_files if v['ep_num'] is not None}
            counter   = 1
            for vf in video_files:
              if vf['ep_num'] is None:
                while counter in used_nums:
                  counter += 1
                vf['ep_num'] = counter
                used_nums.add(counter)
                counter += 1

          for vf in video_files:
            print(f"  [{vf['index']:2d}] ep{vf['ep_num']:02d} | {vf['name']} | {vf['size']//(1024*1024)}MB")

          def est(size):
            return int(size * 0.55 * 1.17)

          batches, cur, cur_size = [], [], 0
          for vf in video_files:
            e = est(vf['size'])
            if cur and cur_size + e > BATCH_LIMIT:
              batches.append(cur)
              cur, cur_size = [vf], e
            else:
              cur.append(vf)
              cur_size += e
          if cur: batches.append(cur)

          print(f"  Batches: {len(batches)}")
          for i, b in enumerate(batches):
            print(f"    Batch {i+1}: eps {[v['ep_num'] for v in b]} | ~{sum(v['size'] for v in b)//(1024*1024)}MB raw")

          safe_cid = re.sub(r'[^a-z0-9-]', '', (content_id or metadata.get('title','serie'))[:20].replace(' ','-').lower())

          children = []
          for bi, batch in enumerate(batches):
            indices_str = ','.join(str(v['index']) for v in batch)
            ep_numbers  = ','.join(str(v['ep_num']) for v in batch)
            first_ep    = batch[0]['ep_num']
            child_id    = f"{safe_cid}-s{season_num:02d}-ep{first_ep:02d}-b{bi+1}"
            child_meta  = {**metadata, 'contentId': content_id or safe_cid}

            children.append({
              'job_id':            child_id,
              'video_url':         url,
              'thumbnail_url':     os.environ.get('INPUT_THUMBNAIL',''),
              'seg_duration':      os.environ.get('INPUT_SEG','4'),
              'max_encode_height': os.environ.get('INPUT_HEIGHT','720'),
              'metadata':          json.dumps(child_meta),
              'season_number':     str(season_num),
              'episode_number':    ep_numbers,
              'episode_title':     input_ep_title if len(batch) == 1 else '',
              'file_indices':      indices_str,
            })

          if not children:
            print("ERRO: nenhum filho preparado")
            sys.exit(1)

          # FIX 9a: filhos passam a ser disparados através do dispatcher.js
          # (não mais direto na API do GitHub) — dá visibilidade real de
          # conclusão ao dispatcher (ver comentário no topo do ficheiro).
          dispatcher_url = os.environ.get('DISPATCHER_URL', '').rstrip('/')
          admin_key      = os.environ.get('ADMIN_API_KEY', '')
          parent_job_id  = os.environ['JOB_ID']

          if not dispatcher_url or not admin_key:
            print("ERRO: DISPATCHER_URL ou ADMIN_API_KEY indisponíveis — impossível rotear filhos pelo dispatcher")
            sys.exit(1)

          DISPATCH_INTERVAL_SECONDS = 20 * 60  # 20min — timer fixo entre disparos, NÃO espera o job anterior terminar (ver nota 9 no topo)

          def dispatch_child(child, index, total):
            body = {**child, 'parent_job': parent_job_id, 'batch_total': str(total)}
            for attempt in range(1, 4):
              r = subprocess.run([
                'curl', '-sf', '-o', '/dev/null', '-w', '%{http_code}', '-X', 'POST',
                '-H', 'Content-Type: application/json',
                '-H', f'x-api-key: {admin_key}',
                f'{dispatcher_url}/dispatch',
                '-d', json.dumps(body),
              ], capture_output=True, text=True)
              code = r.stdout.strip()
              if code == '200':
                print(f"  ✓ Episódio {index}/{total} disparado via dispatcher: {child['job_id']}")
                return True
              elif code.startswith('5') or code == '':
                wait = [10, 25][attempt-1] if attempt <= 2 else 25
                print(f"  ⚠ Episódio {index}/{total} tentativa {attempt}/3 — HTTP {code or 'sem resposta'} — aguarda {wait}s...")
                time.sleep(wait)
              else:
                print(f"  ✗ Episódio {index}/{total} erro HTTP {code} (não retry)")
                return False
            print(f"  ✗ Episódio {index}/{total} falhou após 3 tentativas")
            return False

          ok_count = 0
          for i, child in enumerate(children, start=1):
            if dispatch_child(child, i, len(children)):
              ok_count += 1
            if i < len(children):
              print(f"  … aguardando {DISPATCH_INTERVAL_SECONDS}s antes do próximo disparo ({i+1}/{len(children)})")
              time.sleep(DISPATCH_INTERVAL_SECONDS)

          fail_count = len(children) - ok_count
          print(f"\n✅ Coordinator: {ok_count}/{len(children)} episódio(s) disparados sequencialmente" + (f" | ✗ {fail_count} falha(s)" if fail_count else ""))
          if ok_count == 0:
            sys.exit(1)

          with open(os.environ['GITHUB_ENV'], 'a') as f:
            f.write("COORDINATOR_DISPATCHED=true\n")
          sys.exit(0)
          PYEOF

      # ═══════════════════════════════════════════════════════════════════
      # DOWNLOAD / ENCODE / ENCRIPTAÇÃO (inalterado)
      # ═══════════════════════════════════════════════════════════════════

      - name: '[Modo A] Descarregar vídeo'
        if: inputs.video_url != '' && env.COORDINATOR_DISPATCHED != 'true'
        run: |
          URL="${{ inputs.video_url }}"
          if [[ "$URL" == magnet:* ]] || [[ "$URL" == *.torrent ]] || [[ "$URL" == *infohash:* ]]; then
            echo "→ Modo torrent (libtorrent Python)"
            python3 << 'PYEOF'
          import libtorrent as lt
          import os, sys, time, pathlib

          url      = os.environ['video_url_env']
          dest_dir = os.environ['WORK_DIR'] + '/incoming'
          MAX_WAIT = 3600

          ses = lt.session({
            'listen_interfaces':       '0.0.0.0:6881',
            'enable_dht':              True,
            'enable_lsd':              True,
            'use_dht_as_fallback':     True,
            'dht_restrict_routing_ips': False,
            'dht_bootstrap_nodes':     'router.bittorrent.com:6881,router.utorrent.com:6881,dht.transmissionbt.com:6881,dht.aelitis.com:6881',
            'alert_mask':              0xffffffff,
          })
          try: ses.apply_settings({'connections_limit':200,'active_downloads':1,'active_seeds':0})
          except Exception as e: print(f"⚠ apply_settings parcial: {e}")

          def log_alerts(ses):
            tracker_replied = False
            peer_signal     = False
            for a in ses.pop_alerts():
              name = type(a).__name__
              try:
                msg = a.message()
              except Exception:
                msg = str(a)
              if 'tracker_error' in name:
                print(f"  ✗ {name}: {msg}")
              elif 'tracker_reply' in name:
                tracker_replied = True
                if getattr(a, 'num_peers', 0) > 0:
                  peer_signal = True
                print(f"  ✓ {name}: {msg}")
              elif 'tracker_warning' in name:
                print(f"  ⚠ {name}: {msg}")
              elif 'tracker_announce' in name:
                print(f"  → {name}: {msg}")
            return tracker_replied, peer_signal

          params = lt.add_torrent_params()
          params.save_path = dest_dir

          if url.startswith('magnet:') or 'infohash:' in url:
            params = lt.parse_magnet_uri(url)
            params.save_path = dest_dir
            print(f"  Adicionando magnet: {url[:80]}...")
          else:
            import urllib.request
            torrent_path = '/tmp/input.torrent'
            print(f"  Descarregando .torrent de: {url}")
            urllib.request.urlretrieve(url, torrent_path)
            info = lt.torrent_info(torrent_path)
            params.ti = info
            print(f"  Torrent: {info.name()} ({info.total_size() // (1024*1024)} MB)")

          handle = ses.add_torrent(params)

          file_indices_raw = os.environ.get('FILE_INDICES_ENV', '').strip()
          if file_indices_raw:
            print(f"  Modo worker — aguardando metadados para definir prioridades...")
            t0_meta = time.time()
            while not handle.status().has_metadata:
              if time.time() - t0_meta > 60:
                print("  ⚠ Timeout metadados — continuando sem prioridades")
                break
              ses.wait_for_alert(500)
            if handle.status().has_metadata:
              info_w    = handle.get_torrent_info()
              num_files = info_w.files().num_files()
              wanted    = set(int(x) for x in file_indices_raw.split(',') if x.strip().isdigit())
              for fi in range(num_files):
                prio = 7 if fi in wanted else 0
                handle.file_priority(fi, prio)
              print(f"  Prioridades definidas: {sorted(wanted)} activos | {num_files - len(wanted)} ignorados")
            else:
              print("  ⚠ Sem metadados — descarregando tudo (fallback)")

          print(f"  Destino: {dest_dir}")
          last_pct       = -1
          last_log_t     = 0
          start_t        = time.time()
          stall_t        = time.time()
          stall_bytes    = 0
          CHECK_INTERVAL = 30

          while True:
            s = handle.status()
            log_alerts(ses)
            pct     = int(s.progress * 100)
            elapsed = int(time.time() - start_t)
            is_check_point = (pct != last_pct or elapsed - last_log_t >= CHECK_INTERVAL)
            if is_check_point:
              dl_kb     = s.download_rate // 1024
              peers     = s.num_peers
              dht_nodes = ses.status().dht_nodes if hasattr(ses.status(), 'dht_nodes') else '?'
              print(f"  [{elapsed:4d}s] {pct:3d}% | {dl_kb:6d} KB/s | peers: {peers} | dht_nodes: {dht_nodes}")
              last_pct   = pct
              last_log_t = elapsed
            current_bytes = int(s.progress * (s.total_wanted or 1))
            if current_bytes > stall_bytes:
              stall_bytes = current_bytes
              stall_t     = time.time()
            elif s.num_peers > 0 and (time.time() - stall_t) > 300:
              print('⚠ Sem progresso por 5 min — continuando...')
              stall_t = time.time()
            if s.is_seeding or s.progress >= 1.0:
              print(f"✓ Download completo ({int(time.time()-start_t)}s)")
              break
            if (time.time() - start_t) > MAX_WAIT:
              print(f'⚠ Timeout após {MAX_WAIT}s — progresso: {pct}%')
              if pct < 50:
                sys.exit(1)
              print('  Download parcial (>50%) — continuando...')
              break
            ses.wait_for_alert(1000)

          ses.remove_torrent(handle, 0)
          files      = list(pathlib.Path(dest_dir).rglob('*'))
          video_exts = {'.mp4','.mkv','.avi','.mov','.wmv','.flv','.ts','.m4v','.webm','.mpg','.mpeg'}
          videos     = [f for f in files if f.suffix.lower() in video_exts]
          print(f"  Ficheiros descarregados: {len(files)}")
          for v in videos: print(f"  → Vídeo: {v} ({v.stat().st_size // (1024*1024)} MB)")
          if not videos:
            print('⚠ Nenhum vídeo encontrado no torrent')
            for f in files: print(f'  {f} ({f.stat().st_size} bytes)')
          PYEOF
          else
            echo "→ Modo URL directa (curl)"
            curl -L --retry 3 --retry-delay 5 --progress-bar --fail \
              -o "$WORK_DIR/incoming/input.video" \
              "$URL"
            SIZE=$(stat -c%s "$WORK_DIR/incoming/input.video" 2>/dev/null || echo 0)
            echo "✓ Download: $(du -sh $WORK_DIR/incoming/input.video | cut -f1) ($SIZE bytes)"
            if [ "$SIZE" -lt 10000 ]; then
              echo "⚠ Ficheiro demasiado pequeno — download falhou"
              cat "$WORK_DIR/incoming/input.video" || true
              exit 1
            fi
          fi
        env:
          video_url_env:    ${{ inputs.video_url }}
          FILE_INDICES_ENV: ${{ inputs.file_indices }}

      - name: '[Modo B] Obter vídeo via Artifact'
        if: inputs.video_url == ''
        uses: actions/download-artifact@v4
        with:
          name: video-${{ inputs.job_id }}
          path: ${{ env.WORK_DIR }}/incoming/

      - name: Detectar ficheiro de vídeo (+ extrair .rar/.zip se necessário)
        if: env.COORDINATOR_DISPATCHED != 'true'
        run: |
          VIDEO_EXTS="mp4 mkv avi mov wmv flv ts m4v webm mpg mpeg video"
          FILE_INDICES="${{ inputs.file_indices }}"
          if [ -n "$FILE_INDICES" ]; then
            echo "→ Modo worker | file_indices: $FILE_INDICES"
          fi

          find_video() {
            for ext in $VIDEO_EXTS; do
              FOUND=$(find "$WORK_DIR/incoming/" -iname "*.${ext}" | head -1)
              if [ -n "$FOUND" ]; then echo "$FOUND"; return; fi
            done
          }

          VIDEO_PATH=$(find_video)

          if [ -z "$VIDEO_PATH" ]; then
            echo "Nenhum vídeo directo — procurando arquivos comprimidos..."
            RAR_FILES=$(find "$WORK_DIR/incoming/" -iname "*.rar" | head -1)
            ZIP_FILES=$(find "$WORK_DIR/incoming/" -iname "*.zip" | head -1)
            TAR_FILES=$(find "$WORK_DIR/incoming/" -iname "*.tar*" | head -1)

            if [ -n "$RAR_FILES" ]; then
              echo "→ Encontrado .rar: $RAR_FILES"
              sudo apt-get install -y --no-install-recommends unrar-free 2>/dev/null || \
              sudo apt-get install -y --no-install-recommends unrar 2>/dev/null || true
              EXTRACT_DIR="$WORK_DIR/incoming/extracted"
              mkdir -p "$EXTRACT_DIR"
              if command -v unrar &>/dev/null; then
                unrar x -o+ "$RAR_FILES" "$EXTRACT_DIR/" && echo "✓ unrar concluído"
              elif command -v unrar-free &>/dev/null; then
                unrar-free -x "$RAR_FILES" "$EXTRACT_DIR/" && echo "✓ unrar-free concluído"
              else
                echo "  unrar não disponível — tentando bsdtar"
                bsdtar -x -f "$RAR_FILES" -C "$EXTRACT_DIR/" && echo "✓ bsdtar concluído"
              fi
              VIDEO_PATH=$(find_video)
            elif [ -n "$ZIP_FILES" ]; then
              echo "→ Encontrado .zip: $ZIP_FILES"
              EXTRACT_DIR="$WORK_DIR/incoming/extracted"
              mkdir -p "$EXTRACT_DIR"
              unzip -o "$ZIP_FILES" -d "$EXTRACT_DIR/"
              VIDEO_PATH=$(find_video)
            elif [ -n "$TAR_FILES" ]; then
              echo "→ Encontrado .tar: $TAR_FILES"
              EXTRACT_DIR="$WORK_DIR/incoming/extracted"
              mkdir -p "$EXTRACT_DIR"
              tar -xf "$TAR_FILES" -C "$EXTRACT_DIR/"
              VIDEO_PATH=$(find_video)
            fi
          fi

          if [ -z "$VIDEO_PATH" ]; then
            echo "ERRO: nenhum vídeo encontrado após extracção"
            find "$WORK_DIR/incoming/" -type f | head -20
            exit 1
          fi

          echo "VIDEO_PATH=$VIDEO_PATH" >> $GITHUB_ENV
          echo "✓ Vídeo: $VIDEO_PATH ($(du -sh "$VIDEO_PATH" | cut -f1))"

      - name: Probe do vídeo
        if: env.COORDINATOR_DISPATCHED != 'true'
        run: |
          ffprobe -v quiet -print_format json -show_streams -show_format "$VIDEO_PATH" > "$WORK_DIR/probe.json"
          python3 << 'PYEOF'
          import json, os
          d     = json.load(open(os.environ['WORK_DIR'] + '/probe.json'))
          vs    = next((s for s in d['streams'] if s['codec_type'] == 'video'), {})
          as_   = next((s for s in d['streams'] if s['codec_type'] == 'audio'), {})
          fmt   = d['format']
          num, den = map(int, vs.get('r_frame_rate','24/1').split('/'))
          fps        = num / den if den else num
          src_codec  = vs.get('codec_name', 'unknown')
          audio_codec = as_.get('codec_name', 'unknown')
          probe = {
            'duration': float(fmt.get('duration', 0)),
            'width':    vs.get('width',  1920),
            'height':   vs.get('height', 1080),
            'codec':    src_codec,
            'audio_codec': audio_codec,
            'fps':      fps,
            'bitrate':  int(fmt.get('bit_rate', 0)),
          }
          json.dump(probe, open(os.environ['WORK_DIR'] + '/probe_parsed.json','w'))
          max_h = int(os.environ['MAX_H'])
          stream_copy = (src_codec == 'h264')
          if stream_copy:
            eff_h      = probe['height']
            eff_w      = probe['width']
            will_scale = False
          else:
            eff_h      = min(probe['height'], max_h)
            will_scale = probe['height'] > max_h
            eff_w      = round((probe['width'] / probe['height']) * eff_h / 2) * 2 if will_scale else probe['width']
          audio_copy = (audio_codec == 'aac')
          h     = eff_h
          label = ('4k' if h>=2160 else '1440p' if h>=1440 else '1080p' if h>=1080 else '720p' if h>=720 else f'{h}p')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
            f.write(f"PROBE_DURATION={probe['duration']}\n")
            f.write(f"PROBE_WIDTH={probe['width']}\n")
            f.write(f"PROBE_HEIGHT={probe['height']}\n")
            f.write(f"PROBE_CODEC={probe['codec']}\n")
            f.write(f"PROBE_AUDIO_CODEC={audio_codec}\n")
            f.write(f"PROBE_FPS={fps}\n")
            f.write(f"PROBE_BITRATE={probe['bitrate']}\n")
            f.write(f"EFF_HEIGHT={eff_h}\n")
            f.write(f"EFF_WIDTH={eff_w}\n")
            f.write(f"WILL_SCALE={'true' if will_scale else 'false'}\n")
            f.write(f"QUALITY_LABEL={label}\n")
            f.write(f"AUDIO_COPY={'true' if audio_copy else 'false'}\n")
            f.write(f"STREAM_COPY={'true' if stream_copy else 'false'}\n")
          print(f"✓ {probe['width']}x{probe['height']} | codec: {src_codec} | audio: {audio_codec} | {fps:.2f}fps | {probe['duration']:.1f}s")
          print(f"  → encode {eff_w}x{eff_h} ({label}) | rescale: {will_scale} | stream_copy(v): {stream_copy} | stream_copy(a): {audio_copy}")
          PYEOF

      - name: HLS encode (stream copy se h264 nativo, senão libx264 ultrafast CRF26)
        if: env.COORDINATOR_DISPATCHED != 'true'
        run: |
          HLS_DIR="$WORK_DIR/hls"
          GOP=$(python3 -c "import math; print(int(math.ceil(${PROBE_FPS} * ${SEG_DURATION})))")

          if [ "$STREAM_COPY" = "true" ]; then
            echo "  → Vídeo: STREAM_COPY (fonte já é h264, sem reescala)"
            VCODEC_ARGS="-c:v copy"
          else
            echo "  → Vídeo: re-encode necessário (codec=${PROBE_CODEC} ou reescala=${WILL_SCALE})"
            if [ "$WILL_SCALE" = "true" ]; then
              SCALE_ARGS="-vf scale=-2:${EFF_HEIGHT}"
            else
              SCALE_ARGS=""
            fi
            VCODEC_ARGS="$SCALE_ARGS -c:v libx264 -preset ultrafast -crf 26 -tune fastdecode -profile:v high -level 4.0 -pix_fmt yuv420p -g $GOP -keyint_min ${SEG_DURATION}"
          fi

          if [ "$AUDIO_COPY" = "true" ]; then
            echo "  → Áudio: STREAM_COPY (fonte já é AAC)"
            ACODEC_ARGS="-c:a copy"
          else
            echo "  → Áudio: re-encode pra AAC necessário (codec fonte=${PROBE_AUDIO_CODEC})"
            ACODEC_ARGS="-c:a aac -b:a 128k -ac 2"
          fi

          echo "  GOP=$GOP frames (${PROBE_FPS}fps × ${SEG_DURATION}s) — GOP só se aplica quando vídeo está em re-encode"

          run_encode() {
            ffmpeg -hide_banner -loglevel warning -stats \
              -i "$VIDEO_PATH" \
              $VCODEC_ARGS \
              $ACODEC_ARGS \
              -f hls \
              -hls_time ${SEG_DURATION} \
              -hls_playlist_type vod \
              -hls_segment_type fmp4 \
              -hls_fmp4_init_filename "init.mp4" \
              -hls_flags independent_segments \
              -hls_segment_filename "$HLS_DIR/seg%05d.m4s" \
              -y "$HLS_DIR/index.m3u8"
          }

          if ! run_encode; then
            if [ "$STREAM_COPY" = "true" ] || [ "$AUDIO_COPY" = "true" ]; then
              echo "  ⚠ Encode com stream copy falhou (container incompatível) — fallback pra re-encode completo (vídeo + áudio)"
              rm -f "$HLS_DIR"/*.m4s "$HLS_DIR/init.mp4" "$HLS_DIR/index.m3u8" 2>/dev/null || true
              if [ "$WILL_SCALE" = "true" ]; then
                SCALE_ARGS="-vf scale=-2:${EFF_HEIGHT}"
              else
                SCALE_ARGS=""
              fi
              VCODEC_ARGS="$SCALE_ARGS -c:v libx264 -preset ultrafast -crf 26 -tune fastdecode -profile:v high -level 4.0 -pix_fmt yuv420p -g $GOP -keyint_min ${SEG_DURATION}"
              ACODEC_ARGS="-c:a aac -b:a 128k -ac 2"
              run_encode
            else
              echo "✗ Encode falhou (modo re-encode, sem fallback disponível)"
              exit 1
            fi
          fi

          echo "✓ $(ls $HLS_DIR/*.m4s | wc -l) segmentos .m4s gerados"
          echo "✓ init.mp4: $(du -sh $HLS_DIR/init.mp4 | cut -f1)"

      - name: Obter thumbnails
        if: env.COORDINATOR_DISPATCHED != 'true'
        env:
          INPUT_THUMBNAIL_URL: ${{ inputs.thumbnail_url }}
        run: |
          python3 << 'PYEOF'
          import subprocess, os, json
          thumb_dir = os.environ['WORK_DIR'] + '/thumbs'
          duration  = float(os.environ['PROBE_DURATION'])
          video     = os.environ['VIDEO_PATH']
          thumb_url = os.environ.get('INPUT_THUMBNAIL_URL', '').strip()
          thumbs    = []

          def detect_image_ext(path):
            with open(path, 'rb') as f:
              h = f.read(16)
            if h[:3] == b'\xff\xd8\xff':                                    return 'jpg'
            if h[:4] == b'\x89PNG':                                          return 'png'
            if h[:4] == b'RIFF' and len(h) >= 12 and h[8:12] == b'WEBP':     return 'webp'
            if h[:4] == b'RIFF':                                             return 'webp'
            if h[:6] in (b'GIF87a', b'GIF89a'):                              return 'gif'
            if h[:2] == b'BM':                                               return 'bmp'
            if h[:4] in (b'II*\x00', b'MM\x00*'):                            return 'tiff'
            if len(h) >= 12 and h[4:8] == b'ftyp':                           return 'heic'
            return 'jpg'

          def is_valid_image(path, min_bytes=5000):
            if not os.path.exists(path): return False
            if os.path.getsize(path) < min_bytes: return False
            with open(path, 'rb') as f:
              h = f.read(12)
            return (h[:3] == b'\xff\xd8\xff' or h[:4] == b'\x89PNG' or h[:4] == b'RIFF' or
                    h[:6] in (b'GIF87a', b'GIF89a') or h[:2] == b'BM' or
                    h[:4] in (b'II*\x00', b'MM\x00*') or
                    (len(h) >= 8 and h[4:8] == b'ftyp'))

          def finalize_thumb(tmp_path, index=0, time_s=0):
            ext = detect_image_ext(tmp_path)
            final_path = f"{thumb_dir}/thumb_{index}.{ext}"
            if tmp_path != final_path:
              os.replace(tmp_path, final_path)
            return final_path, ext

          def extract_frame(video, out_path, time_pct=0.07):
            t = max(1.0, duration * time_pct)
            r = subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-ss',f'{t:.2f}',
              '-i',video,'-vframes','1','-vf','scale=1280:-2','-q:v','2','-y',out_path], capture_output=True)
            return r.returncode == 0 and is_valid_image(out_path)

          if thumb_url:
            tmp = f"{thumb_dir}/thumb_0.tmp"
            print(f"  Descarregando thumbnail: {thumb_url}")
            subprocess.run(['curl','-sL','--retry','2','--retry-delay','2','--max-time','15',
              '-H','User-Agent: Mozilla/5.0','-o',tmp,thumb_url], capture_output=True)
            if is_valid_image(tmp):
              final_path, ext = finalize_thumb(tmp, 0)
              thumbs.append({'path':final_path,'ext':ext,'time':0,'index':0})
              print(f"✓ Thumbnail válida ({os.path.getsize(final_path)//1024} KB, .{ext})")
            else:
              if os.path.exists(tmp): os.remove(tmp)
              out = f"{thumb_dir}/thumb_0.jpg"
              if extract_frame(video, out):
                thumbs.append({'path':out,'ext':'jpg','time':0,'index':0})
                print(f"✓ Frame extraído como fallback")
              else: print('✗ Falha ao extrair frame')
          else:
            out = f"{thumb_dir}/thumb_0.jpg"
            print(f"  Extraindo frame a 7% ({duration*0.07:.1f}s)")
            if extract_frame(video, out, time_pct=0.07):
              thumbs.append({'path':out,'ext':'jpg','time':duration*0.07,'index':0})
              print(f"✓ Frame extraído: {os.path.getsize(out)//1024} KB")
            elif extract_frame(video, out, time_pct=0.05):
              thumbs.append({'path':out,'ext':'jpg','time':duration*0.05,'index':0})
              print(f"✓ Frame extraído a 5%: {os.path.getsize(out)//1024} KB")
            else: print('✗ Não foi possível extrair frame')

          json.dump(thumbs, open(os.environ['WORK_DIR'] + '/thumbs_manifest.json', 'w'))
          print(f"✓ {len(thumbs)} thumbnail(s)")
          PYEOF

      - name: Encriptar segmentos → .bin
        if: env.COORDINATOR_DISPATCHED != 'true'
        run: |
          python3 << 'PYEOF'
          import os, json, secrets, struct
          from cryptography.hazmat.primitives.ciphers import Cipher, algorithms
          key_hex = os.environ['CHACHA_KEY']
          if len(key_hex) != 64: raise ValueError('CHACHA_KEY inválido')
          key     = bytes.fromhex(key_hex)
          hls_dir = os.environ['WORK_DIR'] + '/hls'
          CHUNK_SIZE = 65536

          def encrypt_segment(data, key):
            chunks = [data[i:i+CHUNK_SIZE] for i in range(0, len(data), CHUNK_SIZE)]
            out    = [struct.pack('<I', len(chunks))]
            for chunk in chunks:
              nonce       = secrets.token_bytes(12)
              nonce_field = struct.pack('<I', 1) + nonce
              ct          = Cipher(algorithms.ChaCha20(key, nonce_field), None).encryptor().update(chunk)
              out.append(nonce)
              out.append(struct.pack('<I', len(ct)))
              out.append(ct)
            return b''.join(out)

          nonce_map = {}
          init_src  = os.path.join(hls_dir, 'init.mp4')
          if os.path.exists(init_src):
            with open(init_src, 'rb') as f: data = f.read()
            encrypted = encrypt_segment(data, key)
            with open(os.path.join(hls_dir, 'init.bin'), 'wb') as f: f.write(encrypted)
            os.remove(init_src)
            nonce_map['init.bin'] = f"chunked:{struct.unpack('<I', encrypted[:4])[0]}"
            print(f"  init.mp4 → init.bin ({len(data)//1024}KB)")

          seg_files = sorted(f for f in os.listdir(hls_dir) if f.endswith('.m4s'))
          if not seg_files: raise RuntimeError('Nenhum .m4s encontrado')

          for fname in seg_files:
            with open(os.path.join(hls_dir, fname), 'rb') as f: data = f.read()
            encrypted = encrypt_segment(data, key)
            bin_name = fname.replace('.m4s', '.bin')
            with open(os.path.join(hls_dir, bin_name), 'wb') as f: f.write(encrypted)
            os.remove(os.path.join(hls_dir, fname))
            nonce_map[bin_name] = f"chunked:{struct.unpack('<I', encrypted[:4])[0]}"

          out = {'key_id': os.environ['CHACHA_KEY'][:8], 'format': 'chunk-v2', 'nonces': nonce_map}
          json.dump(out, open(os.environ['WORK_DIR'] + '/nonces.json','w'))
          print(f"✓ {len(seg_files)} segmentos encriptados")
          PYEOF

      - name: Libertar espaço — remover vídeo fonte e temporários de torrent
        if: always()
        run: |
          echo "Espaço em disco antes da limpeza:"
          df -h "$WORK_DIR" 2>/dev/null | tail -1 || true
          rm -rf "$WORK_DIR/incoming"
          rm -f /tmp/input.torrent /tmp/coord.torrent
          rm -rf /tmp/coord_meta
          echo "✓ Vídeo fonte e ficheiros temporários de torrent removidos"
          echo "Espaço em disco depois da limpeza:"
          df -h "$WORK_DIR" 2>/dev/null | tail -1 || true

      - name: Gerar token de instalação da App (conta de storage)
        if: env.COORDINATOR_DISPATCHED != 'true'
        env:
          STORAGE_OWNER:          ${{ secrets.STORAGE_OWNER }}
          STORAGE_APP_ID:         ${{ secrets.STORAGE_APP_ID }}
          STORAGE_INSTALLATION_ID: ${{ secrets.STORAGE_INSTALLATION_ID }}
          STORAGE_PRIVATE_KEY:    ${{ secrets.STORAGE_PRIVATE_KEY }}
        run: |
          python3 << 'PYEOF'
          import os, time, json, base64, urllib.request, urllib.error
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding

          target_owner    = os.environ['STORAGE_OWNER']
          app_id          = os.environ['STORAGE_APP_ID']
          installation_id = os.environ['STORAGE_INSTALLATION_ID']
          private_key_pem = os.environ['STORAGE_PRIVATE_KEY']

          if not all([target_owner, app_id, installation_id, private_key_pem]):
            print("ERRO: alguma credencial da App de storage ficou vazia — confira os secrets STORAGE_OWNER/APP_ID/INSTALLATION_ID/PRIVATE_KEY.")
            raise SystemExit(1)

          def b64url(data: bytes) -> str:
            return base64.urlsafe_b64encode(data).rstrip(b'=').decode()

          now    = int(time.time())
          header = {"alg": "RS256", "typ": "JWT"}
          payload = {"iat": now - 60, "exp": now + 9 * 60, "iss": app_id}
          signing_input = f"{b64url(json.dumps(header).encode())}.{b64url(json.dumps(payload).encode())}"

          key = serialization.load_pem_private_key(private_key_pem.encode(), password=None)
          signature = key.sign(signing_input.encode(), padding.PKCS1v15(), hashes.SHA256())
          jwt_token = f"{signing_input}.{b64url(signature)}"

          req = urllib.request.Request(
            f"https://api.github.com/app/installations/{installation_id}/access_tokens",
            method="POST",
            headers={
              "Authorization":        f"Bearer {jwt_token}",
              "Accept":               "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
            },
          )
          try:
            with urllib.request.urlopen(req, timeout=20) as r:
              data = json.loads(r.read())
          except urllib.error.HTTPError as e:
            print(f"ERRO: falha ao gerar installation token: HTTP {e.code} {e.read().decode()[:300]}")
            raise SystemExit(1)

          token = data['token']
          print(f"::add-mask::{token}")
          with open(os.environ['GITHUB_ENV'], 'a') as f:
            f.write(f"STORAGE_TARGET_OWNER={target_owner}\n")
            f.write(f"STORAGE_TARGET_TOKEN={token}\n")
          print(f"✓ Token de instalação gerado para conta de storage: {target_owner} (expira {data['expires_at']})")
          PYEOF

      - name: Definir branch exclusiva do job
        if: env.COORDINATOR_DISPATCHED != 'true'
        run: |
          python3 << 'PYEOF'
          import os, re
          job_id = os.environ['JOB_ID']
          safe = re.sub(r'[^A-Za-z0-9._-]', '-', job_id)
          safe = re.sub(r'\.{2,}', '.', safe).strip('.-')
          if not safe:
            safe = 'job'
          branch = f"job-{safe}"
          with open(os.environ['GITHUB_ENV'], 'a') as f:
            f.write(f"JOB_BRANCH={branch}\n")
          print(f"✓ Branch exclusiva do job: {branch}")
          PYEOF

      - name: Escolher shard, gerar URLs e enviar (com fallback automático de shard cheio)
        if: env.COORDINATOR_DISPATCHED != 'true'
        env:
          STORAGE_TOKEN: ${{ env.STORAGE_TARGET_TOKEN }}
          STORAGE_OWNER: ${{ env.STORAGE_TARGET_OWNER }}
          STORAGE_CREATE_PAT: ${{ secrets.STORAGE_CREATE_PAT }}
        run: |
          git config --global core.deltaBaseCacheLimit 2047m
          git config --global core.looseObjects 0
          git config --global pack.compression 0
          git config --global pack.window 0
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999
          git config --global repack.useDeltaBaseOffset true
          git config --global advice.detachedHead false

          python3 << 'PYEOF'
          import os, subprocess, json, time, random, re, shutil

          THRESHOLD_KB       = 3_500 * 1024
          MAX_SHARDS_TO_SCAN = 20
          MAX_SHARD_ATTEMPTS = 5
          BATCH_SIZE         = 400

          owner      = os.environ['STORAGE_OWNER']
          token      = os.environ['STORAGE_TOKEN']
          work_dir   = os.environ['WORK_DIR']
          job_id     = os.environ['JOB_ID']
          job_branch = os.environ['JOB_BRANCH']
          eff_w      = os.environ['EFF_WIDTH']
          eff_h      = os.environ['EFF_HEIGHT']
          seg_duration = int(os.environ['SEG_DURATION'])

          hls_dir    = work_dir + '/hls'
          orig_index = hls_dir + '/index.m3u8.orig'
          shutil.copy(hls_dir + '/index.m3u8', orig_index)

          def api(method, path, data=None):
            cmd = ['curl','-s','-L','-w','\n%{http_code}','-X',method,
                   '-H',f'Authorization: Bearer {token}',
                   '-H','Accept: application/vnd.github+json',
                   f'https://api.github.com{path}']
            if data is not None:
              cmd += ['-d', json.dumps(data)]
            r = subprocess.run(cmd, capture_output=True, text=True)
            out = r.stdout
            if '\n' in out:
              body, _, code = out.rpartition('\n')
            else:
              body, code = '', out
            try:
              return int(code.strip()), body
            except ValueError:
              return 0, body

          def get_repo_size_kb(repo, max_attempts=4):
            last_code = 0
            for attempt in range(1, max_attempts + 1):
              code, out = api('GET', f'/repos/{owner}/{repo}')
              if code == 200:
                return True, json.loads(out).get('size', 0)
              if code == 404:
                return False, 0
              last_code = code
              wait = [3, 8, 15, 25][min(attempt - 1, 3)]
              print(f"  ⚠ GET {repo} → HTTP {code or 'sem resposta'} (não é 404, pode ser transitório) — tentativa {attempt}/{max_attempts}, aguarda {wait}s...")
              time.sleep(wait)
            print(f"  ✗ GET {repo} falhou persistentemente após {max_attempts} tentativas (último HTTP {last_code})")
            return None, 0

          def create_repo(repo):
            create_pat = os.environ.get('STORAGE_CREATE_PAT', '')
            if not create_pat:
              print(f"  ✗ STORAGE_CREATE_PAT não configurado — impossível criar {repo} (installation token de App não cria repos em conta pessoal)")
              return False
            cmd = ['curl','-s','-w','\n%{http_code}','-X','POST',
                   '-H',f'Authorization: Bearer {create_pat}',
                   '-H','Accept: application/vnd.github+json',
                   'https://api.github.com/user/repos',
                   '-d', json.dumps({'name': repo, 'private': False, 'auto_init': True})]
            r = subprocess.run(cmd, capture_output=True, text=True)
            out = r.stdout
            body, _, code_str = out.rpartition('\n') if '\n' in out else ('', '', out)
            try: cc = int(code_str.strip())
            except ValueError: cc = 0
            if cc == 201:
              return True
            if cc == 422:
              print(f"  ⚠ {repo} já existe (criado concorrentemente por outro job) — reutilizando")
              return True
            print(f"  ✗ Falha ao criar {repo}: HTTP {cc} {body[:200]}")
            return False

          def pick_shard(exclude):
            eligible = []
            n = 1
            while n <= MAX_SHARDS_TO_SCAN:
              repo = f'compiled{n:02d}'
              if repo in exclude:
                n += 1
                continue
              existe, size_kb = get_repo_size_kb(repo)
              if existe is None:
                raise SystemExit(1)
              if not existe:
                print(f"  → {repo} não existe ainda, a criar...")
                if not create_repo(repo):
                  raise SystemExit(1)
                return repo
              size_mb = size_kb // 1024
              print(f"  {repo}: {size_mb}MB")
              if size_kb < THRESHOLD_KB:
                eligible.append(repo)
              n += 1

            if eligible:
              chosen = random.choice(eligible)
              print(f"  → {len(eligible)} shard(s) elegível(eis): {eligible} — escolhido aleatoriamente: {chosen}")
              return chosen

            print(f"  → nenhum shard no range 1..{MAX_SHARDS_TO_SCAN} tem espaço — procurando além disso...")
            HARD_CEILING = 200
            while n <= HARD_CEILING:
              repo = f'compiled{n:02d}'
              if repo in exclude:
                n += 1
                continue
              existe, size_kb = get_repo_size_kb(repo)
              if existe is None:
                raise SystemExit(1)
              if not existe:
                print(f"  → {repo} não existe — a criar...")
                if not create_repo(repo):
                  raise SystemExit(1)
                return repo
              size_mb = size_kb // 1024
              if size_kb < THRESHOLD_KB:
                print(f"  → {repo} já existe e tem espaço ({size_mb}MB) — reutilizando")
                return repo
              print(f"  {repo}: {size_mb}MB — cheio, avançando pro próximo número")
              n += 1

            print(f"  ✗ Nenhum slot de shard livre até compiled{HARD_CEILING:02d}")
            raise SystemExit(1)

          def rewrite_urls(shard):
            raw_base = f"https://cdn.jsdelivr.net/gh/{owner}/{shard}@{job_branch}/{job_id}"
            with open(orig_index) as f:
              content = f.read()
            content = re.sub(r'#EXT-X-MAP:URI="init\.mp4"',
                              f'#EXT-X-MAP:URI="{raw_base}/hls/init.bin"', content)
            content = re.sub(r'^(seg\d+)\.m4s$',
                              lambda m: f"{raw_base}/hls/{m.group(1)}.bin",
                              content, flags=re.MULTILINE)
            with open(hls_dir + '/index.m3u8', 'w') as f:
              f.write(content)

            bin_files = sorted(f for f in os.listdir(hls_dir) if f.endswith('.bin') and f != 'init.bin')
            if bin_files:
              total_bytes  = sum(os.path.getsize(os.path.join(hls_dir, f)) for f in bin_files)
              duration_s   = len(bin_files) * seg_duration
              real_bitrate = int((total_bytes * 8) / duration_s) if duration_s > 0 else 2000000
            else:
              real_bitrate = int(os.environ.get('PROBE_BITRATE') or 2000000)
            master = '\n'.join(['#EXTM3U', '#EXT-X-VERSION:6', '',
              f'#EXT-X-STREAM-INF:BANDWIDTH={real_bitrate},RESOLUTION={eff_w}x{eff_h}',
              f'{raw_base}/hls/index.m3u8'])
            with open(work_dir + '/master.m3u8', 'w') as f:
              f.write(master)

            nonces = json.load(open(work_dir + '/nonces.json'))
            thumbs_path = work_dir + '/thumbs_manifest.json'
            thumbs = json.load(open(thumbs_path)) if os.path.exists(thumbs_path) else []
            cdn_urls = [f"{raw_base}/master.m3u8", f"{raw_base}/nonces.json",
                        f"{raw_base}/hls/index.m3u8", f"{raw_base}/hls/init.bin"]
            seg_names = sorted(bn for bn in nonces['nonces'] if bn != 'init.bin')
            cdn_urls += [f"{raw_base}/hls/{bn}" for bn in seg_names]
            cdn_urls += [f"{raw_base}/thumbs/{os.path.basename(t['path'])}" for t in thumbs]
            json.dump(cdn_urls, open(work_dir + '/cdn_urls.json', 'w'))
            print(f"✓ URLs geradas pro shard {shard}: master.m3u8 | nonces.json | {len(cdn_urls)} entradas em cdn_urls.json")

          QUOTA_MARKERS = ('size quota', 'pre-receive hook declined', 'repository is above')

          def push_batch(batch_num, total_batches, max_attempts=8):
            for attempt in range(1, max_attempts + 1):
              print(f"→ Lote {batch_num}/{total_batches} — push tentativa {attempt}/{max_attempts}...")
              r = subprocess.run(['git', 'push', '-q', '--force', 'origin', job_branch],
                                  capture_output=True, text=True)
              out = (r.stdout + r.stderr)
              if r.returncode == 0:
                print(f"✓ Lote {batch_num}/{total_batches} enviado (tentativa {attempt})")
                return 'ok'
              if any(m in out.lower() for m in QUOTA_MARKERS):
                print(f"✗ Shard cheio (quota) — erro permanente, não adianta retry: {out.strip()[:300]}")
                return 'quota'
              wait = attempt * 8 + random.randint(0, 10)
              print(f"  ⚠ Push do lote {batch_num} falhou (rede/RPC transitório — branch exclusiva, sem colisão possível) — retry em {wait}s...")
              print(f"  {out.strip()[:300]}")
              time.sleep(wait)
            print(f"✗ Lote {batch_num}/{total_batches} falhou após {max_attempts} tentativas (não relacionado a quota)")
            return 'fail'

          def push_all_batches(shard):
            repo_url = f"https://x-access-token:{token}@github.com/{owner}/{shard}.git"
            shutil.rmtree('/tmp/shard', ignore_errors=True)
            os.makedirs('/tmp/shard')
            os.chdir('/tmp/shard')
            subprocess.run(['git', 'init', '-q'], check=True)
            subprocess.run(['git', 'checkout', '-q', '-b', job_branch], check=True)
            subprocess.run(['git', 'remote', 'add', 'origin', repo_url], check=True)
            os.makedirs(f'{job_id}/hls', exist_ok=True)
            os.makedirs(f'{job_id}/thumbs', exist_ok=True)

            files = sorted(os.path.join('hls', f) for f in os.listdir(hls_dir))
            files += ['master.m3u8', 'nonces.json']
            thumbs_dir = work_dir + '/thumbs'
            if os.path.isdir(thumbs_dir) and os.listdir(thumbs_dir):
              files += sorted(os.path.join('thumbs', f) for f in os.listdir(thumbs_dir))

            total = len(files)
            num_batches = (total + BATCH_SIZE - 1) // BATCH_SIZE
            print(f"→ {total} ficheiro(s) a enviar em {num_batches} lote(s) de até {BATCH_SIZE} na branch {job_branch} (shard {shard})")

            for bi in range(num_batches):
              batch = files[bi*BATCH_SIZE:(bi+1)*BATCH_SIZE]
              for rel in batch:
                os.makedirs(os.path.dirname(f'{job_id}/{rel}') or '.', exist_ok=True)
                shutil.copy(f'{work_dir}/{rel}', f'{job_id}/{rel}')
              subprocess.run(['git', '-c', 'user.name=sv-bot', '-c', 'user.email=sv-bot@pixgo.frii.site',
                               'add', job_id], check=True)
              subprocess.run(['git', '-c', 'user.name=sv-bot', '-c', 'user.email=sv-bot@pixgo.frii.site',
                               'commit', '-m', f'job={job_id} lote={bi+1}/{num_batches}', '-q'])
              result = push_batch(bi+1, num_batches)
              if result != 'ok':
                os.chdir('/')
                shutil.rmtree('/tmp/shard', ignore_errors=True)
                return result

            os.chdir('/')
            shutil.rmtree('/tmp/shard', ignore_errors=True)
            print(f"✓ Todos os {num_batches} lote(s) enviados para {shard}@{job_branch}: {job_id}")
            return 'ok'

          exclude = set()
          final_shard = None
          for shard_attempt in range(1, MAX_SHARD_ATTEMPTS + 1):
            print(f"════ Shard — tentativa {shard_attempt}/{MAX_SHARD_ATTEMPTS} (excluindo: {sorted(exclude) or '-'}) ════")
            shard = pick_shard(exclude)
            print(f"✓ Shard escolhido: {shard}")
            rewrite_urls(shard)
            result = push_all_batches(shard)
            if result == 'ok':
              final_shard = shard
              break
            elif result == 'quota':
              print(f"  → marcando {shard} como cheio nesta run e tentando outro shard...")
              exclude.add(shard)
            else:
              print(f"✗ Falha não relacionada a quota no shard {shard} — trocar de shard não resolveria, abortando job")
              raise SystemExit(1)

          if not final_shard:
            print(f"✗ Todos os {MAX_SHARD_ATTEMPTS} shards tentados estavam cheios ou indisponíveis — job falhou")
            raise SystemExit(1)

          with open(os.environ['GITHUB_ENV'], 'a') as f:
            f.write(f"SHARD_REPO={final_shard}\n")
          print(f"✓ Envio concluído — shard definitivo: {final_shard}")
          PYEOF

      - name: Registar no EdgeOne (Turso + KV)
        if: env.COORDINATOR_DISPATCHED != 'true'
        continue-on-error: true
        env:
          METADATA:       ${{ inputs.metadata }}
          SEASON_NUMBER:  ${{ inputs.season_number }}
          EPISODE_NUMBER: ${{ inputs.episode_number }}
          EPISODE_TITLE:  ${{ inputs.episode_title }}
          FILE_INDICES:   ${{ inputs.file_indices }}
          STORAGE_OWNER:  ${{ env.STORAGE_TARGET_OWNER }}
        run: |
          python3 << 'PYEOF'
          import json, os, urllib.request, urllib.error, datetime, time

          pipeline_api = os.environ.get('PIPELINE_API','').rstrip('/')
          if not pipeline_api: print('⚠ PIPELINE_API não configurado'); raise SystemExit(0)

          work_dir     = os.environ['WORK_DIR']
          job_id       = os.environ['JOB_ID']
          quality      = os.environ.get('QUALITY_LABEL', '')
          seg_dur      = int(os.environ.get('SEG_DURATION', '4') or '4')
          storage_owner = os.environ['STORAGE_OWNER']
          shard_repo    = os.environ['SHARD_REPO']
          job_branch    = os.environ['JOB_BRANCH']
          raw_base      = f"https://cdn.jsdelivr.net/gh/{storage_owner}/{shard_repo}@{job_branch}/{job_id}"

          try:    metadata = json.loads(os.environ.get('METADATA','{}'))
          except: metadata = {}

          probe = json.load(open(os.path.join(work_dir, 'probe_parsed.json')))

          eff_w = int(os.environ.get('EFF_WIDTH', '0') or '0')
          eff_h = int(os.environ.get('EFF_HEIGHT', '0') or '0')

          nonces    = json.load(open(os.path.join(work_dir, 'nonces.json')))
          seg_count = len([k for k in nonces['nonces'] if k != 'init.bin'])

          thumbs_path   = os.path.join(work_dir, 'thumbs_manifest.json')
          thumbs        = json.load(open(thumbs_path)) if os.path.exists(thumbs_path) else []
          thumb_urls    = [f"{raw_base}/thumbs/{os.path.basename(t['path'])}" for t in thumbs]

          cdn_urls_path = os.path.join(work_dir, 'cdn_urls.json')
          cdn_urls      = json.load(open(cdn_urls_path)) if os.path.exists(cdn_urls_path) else []

          content_id = metadata.get('contentId', job_id)
          if not metadata.get('contentId'):
            print(f"⚠⚠ contentId ausente no metadata — usando job_id ('{content_id}') como contentId. "
                  f"Isso impede o backend de agrupar este episódio com outros da mesma série no catálogo. "
                  f"Corrija na origem (dispatcher/coordinator) pra sempre enviar o mesmo contentId entre "
                  f"episódios da mesma série/filme.")

          season_number_env  = os.environ.get('SEASON_NUMBER', '0') or '0'
          episode_number_env = os.environ.get('EPISODE_NUMBER', '') or ''
          episode_title_env  = os.environ.get('EPISODE_TITLE', '') or ''

          body = {
            'contentId':content_id,'title':metadata.get('title','Untitled'),'description':metadata.get('description',''),
            'type':metadata.get('type','movie'),'year':int(metadata.get('year') or datetime.datetime.now().year),
            'lang':metadata.get('lang','en'),'duration':round(probe.get('duration', 0)),'thumbnail':thumb_urls[0] if thumb_urls else '',
            'thumbnails':thumb_urls,'qualities':[quality] if quality else [],'width':eff_w,'height':eff_h,'codec':'h264','fps':probe.get('fps', 24),
            'bitrate':probe.get('bitrate', 0),'segmentCount':seg_count,'segDuration':seg_dur,'videoID':job_id,'cdnUrls':cdn_urls,
            'encrypted':True,'encryption':'chacha20-chunk-v2','container':'fmp4','segExt':'bin',
            'masterUrl':f"{raw_base}/master.m3u8",'noncesUrl':f"{raw_base}/nonces.json",
            'storageRepo': shard_repo, 'storageOwner': storage_owner, 'storageBranch': job_branch,
            'seasonNumber':season_number_env,'episodeNumber':episode_number_env,'episodeTitle':episode_title_env,
          }
          payload = json.dumps(body).encode()
          for attempt in range(1, 6):
            req = urllib.request.Request(f"{pipeline_api}/api/pipeline/register", data=payload,
              headers={'Content-Type':'application/json','X-API-Key':os.environ.get('ADMIN_API_KEY','')}, method='POST')
            try:
              with urllib.request.urlopen(req, timeout=30) as r: print(f"✓ Conteúdo registado ({r.status})"); break
            except urllib.error.HTTPError as e:
              if e.code < 500 and e.code != 429: print(f"  Erro cliente ({e.code})"); break
              print(f"⚠ Tentativa {attempt} — HTTP {e.code}")
            except Exception as e: print(f"⚠ Tentativa {attempt} — {e}")
            if attempt < 5:
              time.sleep([5,10,20,40][attempt-1])
          print("✓ Registo concluído")
          PYEOF

      - name: Notificar dispatcher (webhook FIFO)
        if: success() || failure()
        continue-on-error: true
        run: |
          if [ -z "$DISPATCHER_URL" ]; then
            echo "⚠ DISPATCHER_URL não configurado — webhook ignorado"
            exit 0
          fi
          EFFECTIVE_JOB_ID="${JOB_ID:-${{ inputs.job_id }}}"
          if [ -z "$EFFECTIVE_JOB_ID" ]; then
            echo "⚠ job_id indisponível — webhook ignorado (não há job pra notificar)"
            exit 0
          fi
          if [ "${{ job.status }}" = "success" ]; then
            WEBHOOK_STATUS="done"
          else
            WEBHOOK_STATUS="failed"
          fi
          WEBHOOK_URL="${DISPATCHER_URL%/}/webhook"

          # FIX 9b: propaga parent_job/batch_total (definidos pelo Coordinator
          # ao disparar este job como filho — vazios se este job for "raiz",
          # ex.: filme/dorama, ou uma série sem coordinator envolvido).
          BODY=$(EFFECTIVE_JOB_ID_ENV="$EFFECTIVE_JOB_ID" WEBHOOK_STATUS_ENV="$WEBHOOK_STATUS" python3 - << 'PYEOF'
          import json, os
          body = {
            "job_id": os.environ.get("EFFECTIVE_JOB_ID_ENV", ""),
            "status": os.environ.get("WEBHOOK_STATUS_ENV", ""),
          }
          parent_job  = os.environ.get("PARENT_JOB", "")
          batch_total = os.environ.get("BATCH_TOTAL", "")
          if parent_job:
            body["parent_job"]  = parent_job
            body["batch_total"] = batch_total
          print(json.dumps(body))
          PYEOF
          )

          echo "→ POST ${WEBHOOK_URL} (job_id=${EFFECTIVE_JOB_ID}, status=${WEBHOOK_STATUS}, parent_job=${PARENT_JOB:-<none>})"

          HTTP_CODE=$(curl -s -o /tmp/wh_resp.txt -w '%{http_code}' -X POST \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${ADMIN_API_KEY}" \
            --max-time 20 --retry 2 --retry-delay 3 \
            "${WEBHOOK_URL}" \
            -d "${BODY}") || true

          if [[ "$HTTP_CODE" =~ ^2 ]]; then
            echo "✓ Webhook enviado (HTTP $HTTP_CODE)"
          else
            echo "✗ Webhook falhou (HTTP $HTTP_CODE) — não fatal, resposta:"
            cat /tmp/wh_resp.txt 2>/dev/null || true
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -rf "$WORK_DIR"
          rm -rf /tmp/shard
          rm -f /tmp/wh_resp.txt /tmp/input.torrent /tmp/coord.torrent
          rm -rf /tmp/coord_meta
          echo "✓ Workspace limpo"

name: Catalog Discovery
run-name: catalog ${{ inputs.job_id }}

# Disparado pelo dispatcher (Render) a pedido do worker Cloudflare. Dois inputs apenas:
#   job_id — identificador do job (D1)
#   params — JSON: run_type, options, checkpoint, source{id,url,host,type,category,adapter}, worker_url
# O job reporta progresso e conclusão directamente ao worker (D1) e regista o catálogo na API.
# Segredos usados (todos já existentes): PIPELINE_API, ADMIN_API_KEY, STORAGE_OWNER, STORAGE_APP_ID,
# STORAGE_INSTALLATION_ID, STORAGE_PRIVATE_KEY, STORAGE_CREATE_PAT.

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'ID do job'
        required: true
      params:
        description: 'JSON dos parâmetros do job'
        required: true

# O worker só despacha um job de cada vez; isto é apenas uma segunda barreira.
concurrency:
  group: catalog-discovery
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      JOB_ID: ${{ inputs.job_id }}
      JOB_PARAMS: ${{ inputs.params }}
      PIPELINE_API: ${{ secrets.PIPELINE_API }}
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
      STORAGE_OWNER: ${{ secrets.STORAGE_OWNER }}
      STORAGE_APP_ID: ${{ secrets.STORAGE_APP_ID }}
      STORAGE_INSTALLATION_ID: ${{ secrets.STORAGE_INSTALLATION_ID }}
      STORAGE_PRIVATE_KEY: ${{ secrets.STORAGE_PRIVATE_KEY }}
      STORAGE_CREATE_PAT: ${{ secrets.STORAGE_CREATE_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements*.txt

      - name: Dependências
        run: pip install --quiet -r scraper/requirements.txt

      - name: Playwright (só se a fonte o exigir)
        run: |
          if python3 -c "import json,os,sys; sys.exit(0 if json.loads(os.environ['JOB_PARAMS']).get('options',{}).get('playwright') else 1)"; then
            pip install --quiet -r scraper/requirements-playwright.txt
            playwright install --with-deps chromium
          fi

      - name: Descoberta
        run: python -m scraper.main

      - name: Reportar falha (último recurso)
        if: failure() || cancelled()
        run: python -m scraper.report_failure

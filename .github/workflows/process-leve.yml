name: StreamVault Process (Leve)

# ═══════════════════════════════════════════════════════════════════════
# Substitui o process-leve.yml antigo (mesmo nome de ficheiro, para o
# dispatcher/coordinator continuarem a chamá-lo sem alterações). O
# process-super-leve-dlp.yml não é afectado. Partilha o repo e os secrets.
#
# FAZ: aria2c (magnet / .torrent / URL directa) → escolhe os vídeos →
#      compatibiliza p/ Telegram (h264+aac+faststart) → envia ao canal.
# NÃO FAZ: HLS, encriptação, shards, registo no EdgeOne, coordinator,
#          cadeia sequencial, extracção de .rar/.zip.
#
# INPUTS: os mesmos 6 do process-leve.yml (limite rígido do GitHub é 10),
# para o dispatcher/worker poderem disparar este ficheiro sem alterar o
# formato do payload. Só são lidos:
#   metadata.title                     → legenda
#   episode_info.file_indices          → ficheiros do torrent (1-indexed, aria2)
#   episode_info.episode_number        → "1,2,3" para numerar a legenda
#   encode_opts.thumbnail_url          → miniatura (só se enviar 1 vídeo)
# O resto (seg_duration, max_encode_height, chain...) é ignorado.
#
# SECRETS: TG_API_ID, TG_API_HASH, TG_BOT_TOKEN, TG_CHAT (novos);
#          DISPATCHER_URL, ADMIN_API_KEY (os que já usas no process-leve).
#
# LIMITE TELEGRAM: ~2 GB por ficheiro. Se o vídeo for maior, é re-encodado
# com bitrate calculado para caber em ~1,88 GB (veryfast, pode baixar p/ 720p).
# Torrent inteiro tem de caber no disco do runner (~25 GB livres): para
# packs grandes, usa file_indices para enviar por partes.
# ═══════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Job ID'
        required: true
      video_url:
        description: 'magnet: / URL de .torrent / URL directa de vídeo'
        required: true
      metadata:
        description: 'JSON: { title, ... } (só o título é usado na legenda)'
        required: false
        default: '{}'
      episode_info:
        description: 'JSON: { file_indices (1-indexed), episode_number ("1,2,3") }'
        required: false
        default: '{"season_number":"0","episode_number":"0","episode_title":"","file_indices":"","episode_count":"1"}'
      encode_opts:
        description: 'JSON: { thumbnail_url } (restantes campos ignorados)'
        required: false
        default: '{"seg_duration":"4","max_encode_height":"720","thumbnail_url":""}'
      chain:
        description: '(ignorado — mantido só por compatibilidade com o dispatcher)'
        required: false
        default: '{"remaining_children":[],"chain_root_id":""}'

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read

    env:
      WORK_DIR:       /tmp/sv_work/${{ inputs.job_id }}
      DISPATCHER_URL: ${{ secrets.DISPATCHER_URL }}
      ADMIN_API_KEY:  ${{ secrets.ADMIN_API_KEY }}

    steps:
      - name: Preparar ambiente
        run: |
          echo "JOB_ID=${{ inputs.job_id }}" >> $GITHUB_ENV
          mkdir -p "$WORK_DIR/incoming" "$WORK_DIR/out" "$WORK_DIR/thumbs"

      - name: Instalar ffmpeg + aria2 (cache)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: ffmpeg aria2
          version: 1.0
          execute_install_scripts: true

      - name: Atualizar cache do linker (ldconfig)
        run: sudo ldconfig

      - name: Instalar Telethon
        run: |
          # cryptg acelera muito o upload MTProto
          pip install --quiet --upgrade telethon cryptg
          ffmpeg -version | head -1
          aria2c --version | head -1

      - name: Descarregar (aria2c)
        env:
          VIDEO_URL:          ${{ inputs.video_url }}
          INPUT_EPISODE_INFO: ${{ inputs.episode_info }}
        run: |
          if [ -z "$VIDEO_URL" ]; then echo "ERRO: video_url vazio"; exit 1; fi
          DEST="$WORK_DIR/incoming"

          if [[ "$VIDEO_URL" == magnet:* ]] || [[ "$VIDEO_URL" == *.torrent ]] || [[ "$VIDEO_URL" == *infohash:* ]]; then
            echo "→ Modo torrent (aria2c)"
            FILE_INDICES=$(jq -r '.file_indices // ""' <<< "$INPUT_EPISODE_INFO" 2>/dev/null || true)

            SELECT_ARGS=()
            if [ -n "$FILE_INDICES" ]; then
              echo "  file_indices (1-indexed): $FILE_INDICES"
              SELECT_ARGS=(--select-file="$FILE_INDICES")
            fi

            # --bt-stop-timeout=600: se a velocidade ficar a 0 durante 10 min
            # (sem seeds), o aria2c desiste em vez de queimar horas do teto.
            aria2c \
              --dir="$DEST" \
              --enable-dht=true --enable-dht6=false --bt-enable-lpd=true \
              --seed-time=0 --max-overall-upload-limit=1K \
              --bt-tracker-timeout=15 --bt-stop-timeout=600 \
              --summary-interval=30 --console-log-level=notice \
              --file-allocation=none --continue=true \
              "${SELECT_ARGS[@]}" \
              "$VIDEO_URL" || { echo "ERRO: aria2c falhou (sem peers/seeds ou torrent inexistente)"; exit 1; }
          else
            echo "→ Modo URL directa (aria2c, 4 ligações)"
            aria2c --dir="$DEST" -o input.video -x 4 -s 4 -k 1M \
              --max-tries=5 --retry-wait=5 --console-log-level=notice \
              --summary-interval=30 --file-allocation=none "$VIDEO_URL" \
              || { echo "ERRO: download directo falhou"; exit 1; }
          fi

          echo "Ficheiros descarregados:"
          find "$DEST" -type f -exec du -h {} + | sed 's/^/  → /'
          df -h "$WORK_DIR" | tail -1

      - name: Compatibilizar e enviar para o Telegram
        env:
          TG_API_ID:          ${{ secrets.TG_API_ID }}
          TG_API_HASH:        ${{ secrets.TG_API_HASH }}
          TG_BOT_TOKEN:       ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT:            ${{ secrets.TG_CHAT }}
          INPUT_METADATA:     ${{ inputs.metadata }}
          INPUT_EPISODE_INFO: ${{ inputs.episode_info }}
          INPUT_ENCODE_OPTS:  ${{ inputs.encode_opts }}
        run: |
          python3 << 'PYEOF'
          import os, json, subprocess, asyncio, time
          from telethon import TelegramClient
          from telethon.sessions import StringSession
          from telethon.tl.types import DocumentAttributeVideo

          VIDEO_EXTS = {'.mp4','.mkv','.avi','.mov','.wmv','.flv','.ts','.m4v',
                        '.webm','.mpg','.mpeg','.video'}
          LIMIT  = 2_000_000_000   # limite duro de upload
          PRE    = 1_950_000_000   # acima disto nem tenta copy/crf
          TARGET = 1_880_000_000   # alvo do modo "shrink"

          work      = os.environ['WORK_DIR']
          incoming  = os.path.join(work, 'incoming')
          out_dir   = os.path.join(work, 'out');    os.makedirs(out_dir, exist_ok=True)
          thumb_dir = os.path.join(work, 'thumbs'); os.makedirs(thumb_dir, exist_ok=True)

          def jload(name):
            try:    return json.loads(os.environ.get(name, '') or '{}')
            except Exception: return {}
          metadata = jload('INPUT_METADATA')
          ep_info  = jload('INPUT_EPISODE_INFO')
          enc      = jload('INPUT_ENCODE_OPTS')

          title     = (metadata.get('title') or '').strip()
          thumb_url = (enc.get('thumbnail_url') or '').strip()
          eps = [e.strip() for e in str(ep_info.get('episode_number', '')).split(',')
                 if e.strip().isdigit() and e.strip() != '0']

          # ── Vídeos encontrados (ignora samples pequenos) ──
          files = []
          for root, _, names in os.walk(incoming):
            for n in names:
              p = os.path.join(root, n)
              if os.path.splitext(n)[1].lower() not in VIDEO_EXTS: continue
              sz = os.path.getsize(p)
              if sz < 1_000_000: continue
              if 'sample' in n.lower() and sz < 200_000_000: continue
              files.append(p)
          files.sort()
          if not files:
            print('ERRO: nenhum vídeo encontrado no download:')
            for root, _, names in os.walk(incoming):
              for n in names: print('  ', os.path.join(root, n))
            raise SystemExit(1)
          print(f"→ {len(files)} vídeo(s) a enviar")
          for f in files: print(f"   {os.path.basename(f)} ({os.path.getsize(f)//(1024*1024)} MB)")

          def caption_for(i, n, src):
            if n == 1:
              return title or os.path.splitext(os.path.basename(src))[0]
            if len(eps) == n:
              return f"{title} — Ep. {eps[i]}" if title else f"Ep. {eps[i]}"
            return f"{title} — {i+1}/{n}" if title else f"{i+1}/{n}"

          # ── ffprobe ──
          def probe(path):
            r = subprocess.run(['ffprobe','-v','error','-print_format','json',
                                '-show_streams','-show_format', path],
                               capture_output=True, text=True)
            d = json.loads(r.stdout or '{}')
            st = d.get('streams', [])
            v = next((s for s in st if s.get('codec_type') == 'video'), None)
            a = next((s for s in st if s.get('codec_type') == 'audio'), None)
            return d, v, a

          # ── Compatibilizar: copy → crf18 → shrink (cabe em ~1,88 GB) ──
          def prepare(src, idx):
            d, v, a = probe(src)
            if not v: raise RuntimeError('sem stream de vídeo')
            dur  = float(d.get('format', {}).get('duration') or 0)
            h    = int(v.get('height') or 0)
            size = os.path.getsize(src)
            vc, pix = v.get('codec_name'), v.get('pix_fmt', '')
            can_copy  = (vc == 'h264' and pix in ('yuv420p', 'yuvj420p'))
            aac       = (a is not None and a.get('codec_name') == 'aac')
            out = os.path.join(out_dir, f'video_{idx}.mp4')

            def shrink_vargs():
              if dur <= 0: raise RuntimeError('duração desconhecida — impossível calcular bitrate')
              vbr = int(TARGET * 8 / dur) - 160_000
              if vbr < 400_000:
                raise RuntimeError(f'vídeo demasiado longo p/ caber em 2 GB (bitrate alvo {vbr//1000} kbps)')
              vf = ['-vf', 'scale=-2:720'] if (h > 720 and vbr < 1_800_000) else []
              return vf + ['-c:v','libx264','-preset','veryfast','-b:v',str(vbr),
                           '-maxrate',str(int(vbr*1.15)),'-bufsize',str(vbr*2),'-pix_fmt','yuv420p']

            if size > PRE:           attempts = ['shrink']
            elif can_copy:           attempts = ['copy', 'crf', 'shrink']
            else:                    attempts = ['crf', 'shrink']

            failed_once = False
            for mode in attempts:
              if mode == 'copy':
                vargs = ['-c:v', 'copy']
              elif mode == 'crf':
                vargs = ['-c:v','libx264','-preset','veryfast','-crf','18','-pix_fmt','yuv420p']
              else:
                vargs = shrink_vargs()
              aargs = ['-c:a','copy'] if (aac and not failed_once) else ['-c:a','aac','-b:a','160k','-ac','2']
              print(f"  → modo: {mode} | vídeo={vc}/{pix} | áudio={'aac copy' if (aac and not failed_once) else 're-encode aac'}")
              cmd = ['ffmpeg','-hide_banner','-loglevel','warning','-stats','-i',src,
                     '-map','0:v:0','-map','0:a:0?', *vargs, *aargs,
                     '-movflags','+faststart','-y', out]
              ok = subprocess.run(cmd).returncode == 0
              if ok and os.path.getsize(out) <= LIMIT:
                break
              if ok:
                print(f"  ⚠ resultado com {os.path.getsize(out)//(1024*1024)} MB — acima do limite, a tentar o modo seguinte")
              else:
                print(f"  ⚠ modo {mode} falhou")
              failed_once = True
              if os.path.exists(out): os.remove(out)
            else:
              raise RuntimeError('não foi possível gerar um ficheiro dentro do limite do Telegram')

            d2, v2, _ = probe(out)
            w2, h2 = int(v2['width']), int(v2['height'])
            dur2 = int(float(d2['format'].get('duration') or dur))
            print(f"  ✓ {w2}x{h2} | {dur2}s | {os.path.getsize(out)//(1024*1024)} MB")
            return out, w2, h2, dur2

          # ── Miniatura: URL (só se 1 vídeo) → frame a 7% ──
          def valid_image(p, min_bytes=100):
            if not os.path.exists(p) or os.path.getsize(p) < min_bytes: return False
            with open(p, 'rb') as f: hd = f.read(12)
            return (hd[:3] == b'\xff\xd8\xff' or hd[:4] == b'\x89PNG' or hd[:4] == b'RIFF'
                    or hd[:6] in (b'GIF87a', b'GIF89a'))

          def make_thumb(video, dur, idx, url):
            raw = os.path.join(thumb_dir, f'raw_{idx}')
            got = False
            if url:
              subprocess.run(['curl','-sL','--max-time','15','-H','User-Agent: Mozilla/5.0','-o',raw,url],
                             capture_output=True)
              got = valid_image(raw)
            if not got:
              t = max(1.0, dur * 0.07)
              fr = raw + '.jpg'
              r = subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-ss',f'{t:.2f}',
                                  '-i',video,'-vframes','1','-y',fr], capture_output=True)
              if r.returncode == 0 and os.path.exists(fr):
                raw, got = fr, True
            if not got: return None
            out = os.path.join(thumb_dir, f'thumb_{idx}.jpg')
            r = subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-i',raw,
                                '-vf','scale=320:320:force_original_aspect_ratio=decrease',
                                '-q:v','5',out], capture_output=True)
            if r.returncode == 0 and os.path.exists(out) and os.path.getsize(out) <= 200*1024:
              return out
            return None

          last = {'t': 0}
          def progress(sent, total):
            now = time.time()
            if now - last['t'] > 10 or sent == total:
              last['t'] = now
              print(f"  upload {sent*100//total}% ({sent//(1024*1024)}/{total//(1024*1024)} MB)", flush=True)

          chat = os.environ['TG_CHAT'].strip()
          chat = int(chat) if chat.lstrip('-').isdigit() else chat

          async def main():
            client = TelegramClient(StringSession(), int(os.environ['TG_API_ID']),
                                    os.environ['TG_API_HASH'], flood_sleep_threshold=300)
            await client.start(bot_token=os.environ['TG_BOT_TOKEN'])
            failed = []
            try:
              for i, src in enumerate(files):
                print(f"════ [{i+1}/{len(files)}] {os.path.basename(src)} ════")
                out = None
                try:
                  out, w, h, dur = await asyncio.to_thread(prepare, src, i)
                  thumb = await asyncio.to_thread(make_thumb, out, dur, i,
                                                  thumb_url if len(files) == 1 else '')
                  await client.send_file(
                    chat, out, caption=caption_for(i, len(files), src)[:1024], thumb=thumb,
                    supports_streaming=True, force_document=False,
                    attributes=[DocumentAttributeVideo(duration=dur, w=w, h=h, supports_streaming=True)],
                    progress_callback=progress)
                  print(f"✓ enviado: {os.path.basename(src)}")
                except Exception as ex:
                  print(f"✗ falhou: {os.path.basename(src)} — {ex}")
                  failed.append(os.path.basename(src))
                finally:
                  # libertar disco já (pode haver vários ficheiros grandes)
                  for p in (out, src):
                    if p and os.path.exists(p):
                      try: os.remove(p)
                      except Exception: pass
            finally:
              await client.disconnect()
            if failed:
              print(f"✗ {len(failed)} ficheiro(s) falharam: {failed}")
              raise SystemExit(1)
            print(f"✓ {len(files)} vídeo(s) enviado(s) para o Telegram")

          asyncio.run(main())
          PYEOF

      - name: Notificar dispatcher (webhook FIFO)
        if: always()
        continue-on-error: true
        run: |
          if [ -z "$DISPATCHER_URL" ]; then echo "⚠ DISPATCHER_URL não configurado"; exit 0; fi
          EFFECTIVE_JOB_ID="${JOB_ID:-${{ inputs.job_id }}}"
          if [ -z "$EFFECTIVE_JOB_ID" ]; then echo "⚠ job_id indisponível"; exit 0; fi
          if [ "${{ job.status }}" = "success" ]; then WEBHOOK_STATUS="done"; else WEBHOOK_STATUS="failed"; fi
          WEBHOOK_URL="${DISPATCHER_URL%/}/webhook"
          echo "→ POST ${WEBHOOK_URL} (job_id=${EFFECTIVE_JOB_ID}, status=${WEBHOOK_STATUS})"
          HTTP_CODE=$(curl -s -o /tmp/wh_resp.txt -w '%{http_code}' -X POST \
            -H "Content-Type: application/json" -H "x-api-key: ${ADMIN_API_KEY}" \
            --max-time 20 --retry 2 --retry-delay 3 "${WEBHOOK_URL}" \
            -d "{\"job_id\":\"${EFFECTIVE_JOB_ID}\",\"status\":\"${WEBHOOK_STATUS}\"}") || true
          if [[ "$HTTP_CODE" =~ ^2 ]]; then echo "✓ Webhook enviado (HTTP $HTTP_CODE)"; else
            echo "✗ Webhook falhou (HTTP $HTTP_CODE)"; cat /tmp/wh_resp.txt 2>/dev/null || true; fi

      - name: Cleanup
        if: always()
        run: |
          rm -rf "$WORK_DIR"
          rm -f /tmp/wh_resp.txt
          echo "✓ Workspace limpo"
